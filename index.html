<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HELPY — La plateforme qui vous connecte</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fb;
      color: #172033;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* HEADER */
    header {
      background: white;
      border-bottom: 1px solid #e7eaf0;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-content {
      max-width: 1200px;
      margin: auto;
      height: 70px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 27px;
      font-weight: 900;
      color: #111827;
    }

    .logo-mark {
      width: 35px;
      height: 35px;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      font-weight: bold;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 22px;
      font-size: 14px;
      font-weight: 600;
      color: #4b5563;
    }

    nav a:hover {
      color: #2563eb;
    }

    .login-btn {
      background: #2563eb;
      color: white !important;
      padding: 11px 17px;
      border-radius: 10px;
    }

    /* HERO */
    .hero {
      max-width: 1200px;
      margin: auto;
      padding: 55px 20px 35px;
    }

    .hero-box {
      background: linear-gradient(135deg, #111827, #2563eb);
      border-radius: 24px;
      padding: 45px 35px;
      color: white;
      overflow: hidden;
    }

    .hero h1 {
      font-size: clamp(32px, 6vw, 58px);
      line-height: 1.05;
      max-width: 700px;
      margin-bottom: 16px;
    }

    .hero p {
      font-size: 18px;
      opacity: .9;
      max-width: 650px;
      margin-bottom: 28px;
    }

    .search-box {
      max-width: 720px;
      background: white;
      padding: 7px;
      border-radius: 14px;
      display: flex;
      gap: 7px;
    }

    .search-box input {
      flex: 1;
      border: none;
      outline: none;
      padding: 14px;
      font-size: 15px;
      color: #111827;
      min-width: 0;
    }

    .search-btn {
      border: none;
      background: #2563eb;
      color: white;
      padding: 0 22px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    /* CATEGORIES */
    .section {
      max-width: 1200px;
      margin: auto;
      padding: 25px 20px;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .section-title h2 {
      font-size: 23px;
    }

    .section-title a {
      color: #2563eb;
      font-size: 14px;
      font-weight: bold;
    }

    .categories {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    .category {
      background: white;
      border: 1px solid #e8ebf1;
      border-radius: 17px;
      padding: 25px 20px;
      transition: .2s;
      cursor: pointer;
    }
