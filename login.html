<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connexion — HELPY</title><link rel="stylesheet" href="style.css"><script src="app.js"></script></head><body><main class="container"><form class="form" onsubmit="go(event)"><h1>Connexion</h1><div class="field"><label>Email</label><input id="email" type="email" required></div><div class="field"><label>Mot de passe</label><input id="password" type="password" required></div><button class="btn">Se connecter</button><p id="msg" class="muted"></p><p>Pas encore de compte ? <a href="register.html">Créer un compte</a></p></form></main><script>async function go(e){e.preventDefault();msg.textContent='Connexion...';const r=await apiFetch('/api/login','POST',{email:email.value,password:password.value});if(r.error){msg.textContent=r.message;return}saveUser(r.utilisateur);location.href='index.html'}</script></body></html>
