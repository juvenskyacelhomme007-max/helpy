<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HELPY - Recherche</title>
  <style>
    body { font-family: sans-serif; background: #f8fafc; padding: 15px; max-width: 600px; margin: auto; padding-bottom: 70px; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .logo { font-size: 1.5rem; font-weight: bold; color: #2563eb; text-decoration: none; }
    .search-box { display: flex; gap: 8px; margin-bottom: 15px; }
    input[type="text"] { flex: 1; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem; }
    select { padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; background: white; }
    .item-card { background: white; padding: 15px; border-radius: 8px; border: 1px solid #e2e8f0; margin-bottom: 12px; }
    .badge { display: inline-block; padding: 3px 8px; background: #e0e7ff; color: #3730a3; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }
    .price { font-weight: bold; color: #16a34a; }
    .nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; display: flex; justify-content: space-around; padding: 10px; border-top: 1px solid #ccc; }
    .nav a { text-decoration: none; color: #555; font-size: 0.8rem; text-align: center; }
    .nav a.active { color: #2563eb; font-weight: bold; }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="logo">HELPY</a>
    <a href="profile.html" style="text-decoration:none;">👤</a>
  </header>

  <h3>Recherche</h3>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Rechercher un produit, service...">
    <select id="typeFilter">
      <option value="">Tous</option>
      <option value="product">Produits</option>
      <option value="service">Services</option>
      <option value="business">Entreprises</option>
    </select>
  </div>

  <div id="searchResults">Entrez un mot-clé pour lancer la recherche...</div>

  <nav class="nav">
    <a href="index.html">⌂<br>Accueil</a>
    <a href="search.html" class="active">⌕<br>Recherche</a>
    <a href="publish.html">＋<br>Publier</a>
    <a href="favorites.html">♡<br>Favoris</a>
    <a href="profile.html">👤<br>Profil</a>
  </nav>

  <script>
    const searchInput = document.getElementById('searchInput');
    const typeFilter = document.getElementById('typeFilter');
    const resultsContainer = document.getElementById('searchResults');

    async function fetchResults() {
      const query = searchInput.value.trim();
      const type = typeFilter.value;

      resultsContainer.innerHTML = "Recherche en cours...";

      const url = new URL('/api/items', window.location.origin);
      if (query) url.searchParams.append('query', query);
      if (type) url.searchParams.append('type', type);

      try {
        const res = await fetch(url);
        const data = await res.json();

        if (data.length === 0) {
          resultsContainer.innerHTML = "<p>Aucun résultat trouvé.</p>";
          return;
        }

        resultsContainer.innerHTML = data.map(item => `
          <div class="item-card">
            <span class="badge">${item.type.toUpperCase()}</span>
            <h4>${item.title}</h4>
            <p>${item.description}</p>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:8px;">
              <span class="price">${item.price > 0 ? item.price + ' USD' : 'Gratuit / Sur devis'}</span>
              <small>📍 ${item.location}</small>
            </div>
          </div>
        `).join('');
      } catch (err) {
        resultsContainer.innerHTML = "<p>Erreur lors du chargement des données.</p>";
      }
    }

    searchInput.addEventListener('input', fetchResults);
    typeFilter.addEventListener('change', fetchResults);

    // Charge tout par défaut
    fetchResults();
  </script>
</body>
</html>
