<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HELPY - Publier une annonce</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="app-container">
    <h2 class="hero-title">Publier une annonce</h2>

    <form id="publish-form" onsubmit="submitListing(event)">
      <div class="form-group">
        <label>Type d'annonce</label>
        <select class="form-control" id="pub-type" onchange="adjustFields()">
          <option value="business">Entreprise</option>
          <option value="product">Produit</option>
          <option value="service">Service</option>
          <option value="real_estate">Immobilier</option>
          <option value="vehicle">Véhicule</option>
        </select>
      </div>

      <div class="form-group">
        <label>Titre / Nom</label>
        <input type="text" class="form-control" id="pub-title" required placeholder="Ex: Restaurant Le Bon Goût">
      </div>

      <div class="form-group">
        <label>URL de la photo (Stockage externe / Cloudinary)</label>
        <input type="url" class="form-control" id="pub-image" placeholder="https://exemple.com/image.jpg">
      </div>

      <div class="form-group">
        <label>Description</label>
        <textarea class="form-control" id="pub-desc" rows="3" required placeholder="Décrivez votre offre..."></textarea>
      </div>

      <div class="form-group">
        <label>Localisation</label>
        <input type="text" class="form-control" id="pub-location" required placeholder="Pétion-Ville, Haïti">
      </div>

      <div class="form-group">
        <label>Téléphone</label>
        <input type="tel" class="form-control" id="pub-phone" required placeholder="+509 ...">
      </div>

      <div class="form-group">
        <label>WhatsApp</label>
        <input type="tel" class="form-control" id="pub-whatsapp" placeholder="+509 ...">
      </div>

      <!-- Champ dynamique selon catégorie -->
      <div id="dynamic-fields"></div>

      <button type="submit" class="btn-primary" style="width: 100%; justify-content: center; margin-top: 10px;">
        Publier maintenant
      </button>
    </form>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i><span>Accueil</span></a>
    <a href="search.html" class="nav-item"><i class="fa-solid fa-magnifying-glass"></i><span>Rechercher</span></a>
    <a href="publish.html" class="nav-item active nav-publish"><div class="publish-btn-circle"><i class="fa-solid fa-plus"></i></div><span>Publier</span></a>
    <a href="favorites.html" class="nav-item"><i class="fa-regular fa-bookmark"></i><span>Favoris</span></a>
    <a href="profile.html" class="nav-item"><i class="fa-regular fa-user"></i><span>Profil</span></a>
  </nav>

  <script src="app.js"></script>
  <script>
    function adjustFields() {
      const type = document.getElementById('pub-type').value;
      const container = document.getElementById('dynamic-fields');
      let html = '';

      if (type === 'product' || type === 'real_estate' || type === 'vehicle' || type === 'service') {
        html += `
          <div class="form-group">
            <label>Prix</label>
            <input type="text" class="form-control" id="pub-price" placeholder="Ex: $50 / HTG 5000">
          </div>
        `;
      }
      container.innerHTML = html;
    }

    async function submitListing(e) {
      e.preventDefault();
      const payload = {
        type: document.getElementById('pub-type').value,
        title: document.getElementById('pub-title').value,
        image_url: document.getElementById('pub-image').value,
        description: document.getElementById('pub-desc').value,
        location: document.getElementById('pub-location').value,
        phone: document.getElementById('pub-phone').value,
        whatsapp: document.getElementById('pub-whatsapp').value,
        price: document.getElementById('pub-price') ? document.getElementById('pub-price').value : null
      };

      const res = await apiFetch('/api/listings', 'POST', payload);
      if (res) {
        alert("Votre annonce a été publiée avec succès !");
        window.location.href = "index.html";
      } else {
        alert("Erreur lors de la publication. Veuillez vous connecter.");
      }
    }
  </script>
</body>
</html>
