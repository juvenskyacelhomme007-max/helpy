<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Produits — HELPY</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fb;
      color: #172033;
      padding-bottom: 75px;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    header {
      background: white;
      border-bottom: 1px solid #e5e7eb;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header {
      max-width: 1200px;
      height: 65px;
      margin: auto;
      padding: 0 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 25px;
      font-weight: 900;
    }

    .logo-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    .back {
      color: #2563eb;
      font-size: 14px;
      font-weight: bold;
    }

    main {
      max-width: 1200px;
      margin: auto;
      padding: 25px 18px;
    }

    h1 {
      font-size: 30px;
      margin-bottom: 6px;
    }

    .subtitle {
      color: #6b7280;
      margin-bottom: 20px;
    }

    .search {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 13px;
      padding: 14px 16px;
      width: 100%;
      outline: none;
      font-size: 15px;
      margin-bottom: 25px;
    }

    .search:focus {
      border-color: #2563eb;
    }

    .status {
      text-align: center;
      padding: 20px 15px;
      color: #6b7280;
      font-size: 14px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }

    .product {
      background: white;
      border-radius: 17px;
      overflow: hidden;
      border: 1px solid #e5e7eb;
      transition: .2s;
    }

    .product:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(0,0,0,.08);
    }

    .product-image {
      width: 100%;
      height: 190px;
      background: #eef2f7;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .no-image {
      font-size: 50px;
    }

    .product-info {
      padding: 15px;
    }

    .product-title {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .price {
      color: #2563eb;
      font-size: 19px;
      font-weight: 800;
      margin-bottom: 7px;
    }

    .location {
      color: #6b7280;
      font-size: 13px;
      margin-bottom: 14px;
    }

    .buttons {
      display: flex;
      gap: 8px;
    }

    .details-btn {
      flex: 1;
      text-align: center;
      background: #2563eb;
      color: white;
      padding: 10px 7px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: bold;
    }

    .whatsapp-btn {
      width: 45px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #16a34a;
      color: white;
      border-radius: 9px;
      font-size: 18px;
    }

    .empty {
      grid-column: 1 / -1;
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 17px;
      padding: 50px 20px;
      text-align: center;
    }

    .empty-icon {
      font-size: 50px;
      margin-bottom: 15px;
    }

    .empty h2 {
      margin-bottom: 7px;
    }

    .empty p {
      color: #6b7280;
      font-size: 14px;
    }

    .mobile-nav {
      display: none;
    }

    @media (max-width: 900px) {
      .products {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {

      main {
        padding: 22px 14px;
      }

      h1 {
        font-size: 27px;
      }

      .products {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }

      .product-image {
        height: 145px;
      }

      .product-info {
        padding: 12px;
      }

      .product-title {
        font-size: 15px;
      }

      .price {
        font-size: 17px;
      }

      .details-btn {
        font-size: 12px;
        padding: 9px 5px;
      }

      .whatsapp-btn {
        width: 40px;
      }

      .mobile-nav {
        display: flex;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        height: 65px;
        background: white;
        border-top: 1px solid #e5e7eb;
        z-index: 200;
        justify-content: space-around;
        align-items: center;
      }

      .mobile-nav a {
        text-align: center;
        color: #6b7280;
        font-size: 11px;
      }

      .mobile-nav span {
        display: block;
        font-size: 20px;
        margin-bottom: 2px;
      }

      .mobile-nav .active {
        color: #2563eb;
        font-weight: bold;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="header">

    <a href="/" class="logo">
      <div class="logo-icon">H</div>
      HELPY
    </a>

    <a href="/" class="back">
      ← Accueil
    </a>

  </div>

</header>


<main>

  <h1>Produits 🛍️</h1>

  <p class="subtitle">
    Découvrez les produits disponibles sur HELPY.
  </p>


  <input
    id="searchInput"
    class="search"
    type="text"
    placeholder="Rechercher un produit..."
  >


  <div id="status" class="status">
    Chargement des produits...
  </div>


  <div id="products" class="products"></div>

</main>


<!-- NAVIGATION MOBILE -->

<div class="mobile-nav">

  <a href="/">
    <span>⌂</span>
    Accueil
  </a>

  <a href="/products.html" class="active">
    <span>🛍️</span>
    Produits
  </a>

  <a href="/services.html">
    <span>🛠️</span>
    Services
  </a>

  <a href="/add-service.html">
    <span>＋</span>
    Publier
  </a>

  <a href="/login.html">
    <span>👤</span>
    Compte
  </a>

</div>


<script>

const API_URL =
  "https://helpy-production.up.railway.app";

let allProducts = [];


/* =========================
   CHARGER LES PRODUITS
========================= */

async function loadProducts() {

  const status =
    document.getElementById("status");

  try {

    const response =
      await fetch(API_URL + "/api/products");

    if (!response.ok) {
      throw new Error("Erreur serveur");
    }

    const data =
      await response.json();

    allProducts =
      data.products || [];

    displayProducts(allProducts);

  } catch (error) {

    console.error(error);

    status.innerHTML =
      "❌ Impossible de charger les produits.";

  }

}


/* =========================
   AFFICHER LES PRODUITS
========================= */

function displayProducts(products) {

  const container =
    document.getElementById("products");

  const status =
    document.getElementById("status");

  container.innerHTML = "";


  if (products.length === 0) {

    status.innerHTML = "";

    container.innerHTML = `

      <div class="empty">

        <div class="empty-icon">
          🛍️
        </div>

        <h2>
          Aucun produit trouvé
        </h2>

        <p>
          Aucun produit ne correspond à votre recherche.
        </p>

      </div>

    `;

    return;

  }


  status.innerHTML =
    products.length +
    " produit(s) disponible(s).";


  products.forEach(product => {

    const card =
      document.createElement("div");

    card.className =
      "product";


    /* IMAGE */

    let imageHTML = `
      <div class="no-image">
        🛍️
      </div>
    `;


    if (product.image_url) {

      imageHTML = `

        <img
          src="${escapeHTML(product.image_url)}"
          alt="${escapeHTML(product.title)}"
          onerror="this.style.display='none';this.parentElement.innerHTML='<div class=&quot;no-image&quot;>🛍️</div>';"
        >

      `;

    }


    /* WHATSAPP */

    const whatsappNumber =
      String(product.whatsapp || "")
        .replace(/\D/g, "");


    const whatsappLink =
      whatsappNumber
        ? "https://wa.me/" + whatsappNumber
        : "#";


    /* CARD */

    card.innerHTML = `

      <div class="product-image">

        ${imageHTML}

      </div>


      <div class="product-info">

        <div class="product-title">

          ${escapeHTML(product.title)}

        </div>


        <div class="price">

          ${formatPrice(product.price)}
          ${escapeHTML(product.currency || "HTG")}

        </div>


        <div class="location">

          📍 ${escapeHTML(product.location || "Haïti")}

        </div>


        <div class="buttons">

          <a
            class="details-btn"
            href="/product-details.html?id=${encodeURIComponent(product.id)}"
          >
            👁️ Voir détails
          </a>


          ${
            whatsappNumber
            ?

            `
            <a
              class="whatsapp-btn"
              href="${whatsappLink}"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="WhatsApp"
            >
              💬
            </a>
            `

            :

            ""

          }

        </div>

      </div>

    `;


    container.appendChild(card);

  });

}


/* =========================
   RECHERCHE
========================= */

document
  .getElementById("searchInput")
  .addEventListener("input", function() {

    const query =
      this.value
        .toLowerCase()
        .trim();


    const filtered =
      allProducts.filter(product => {

        return (

          String(product.title || "")
            .toLowerCase()
            .includes(query)

          ||

          String(product.description || "")
            .toLowerCase()
            .includes(query)

          ||

          String(product.category || "")
            .toLowerCase()
            .includes(query)

          ||

          String(product.location || "")
            .toLowerCase()
            .includes(query)

        );

      });


    displayProducts(filtered);

  });


/* =========================
   FORMAT PRIX
========================= */

function formatPrice(price) {

  const number =
    Number(price);


  if (isNaN(number)) {
    return escapeHTML(price);
  }


  return new Intl.NumberFormat("fr-FR")
    .format(number);

}


/* =========================
   SÉCURITÉ HTML
========================= */

function escapeHTML(value) {

  if (
    value === null ||
    value === undefined
  ) {
    return "";
  }


  return String(value)

    .replace(/&/g, "&amp;")

    .replace(/</g, "&lt;")

    .replace(/>/g, "&gt;")

    .replace(/"/g, "&quot;")

    .replace(/'/g, "&#039;");

}


/* =========================
   START
========================= */

loadProducts();

</script>

</body>
</html>
