<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/icon.svg"><link rel="stylesheet" href="/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/config.js"></script><script src="/supabase.js"></script><title>Connexion — HELPY</title></head><body><main class="auth-wrap"><section class="auth panel"><a class="brand" href="/" style="justify-content:center"><span class="logo">H</span><span class="brand-name">HELPY</span></a><h1>Bon retour 👋</h1><p>Connecte-toi pour acheter, vendre et publier.</p><div id="msg"></div><form id="form" class="form"><div class="field"><label>E-mail</label><input id="email" type="email" required></div><div class="field"><label>Mot de passe</label><input id="password" type="password" required></div><button class="primary">Se connecter</button></form><p>Pas encore de compte ? <a style="color:var(--blue);font-weight:800" href="/register.html">Créer un compte</a></p></section></main><script>form.onsubmit=async e=>{e.preventDefault();const db=await HELPY.init();if(!db){msg.className="notice error";msg.textContent="Supabase n’est pas configuré.";return}const {error}=await db.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error){msg.className="notice error";msg.textContent=error.message;return}location.href=new URLSearchParams(location.search).get("next")||"/"}</script></body></html>
