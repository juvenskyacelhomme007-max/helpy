<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HELPY - Mes Favoris</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8fafc; padding: 15px; max-width: 600px; margin: auto; padding-bottom: 70px; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .logo { font-size: 1.5rem; font-weight: 800; color: #2563eb; text-decoration: none; }
    .item-card { background: white; padding: 15px; border-radius: 12px; border: 1px solid #e2e8f0; margin-bottom: 12px; }
    .nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; display: flex; justify-content: space-around; padding: 10px; border-top: 1px solid #e2e8f0; }
    .nav a { text-decoration: none; color: #64748b; font-size: 0.8rem; text-align: center; }
    .nav a.active { color: #2563eb; font-weight: bold; }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="logo">HELPY</a>
    <a href="profile.html" style="text-decoration:none;">👤</a>
  </header>

  <h2>♡ Mes Favoris</h2>
  <div id="favoritesContainer" style="margin-top: 15px;">Chargement de vos favoris...</div>

  <nav class="nav">
    <a href="index.html">⌂<br>Accueil</a>
    <a href="search.html">⌕<br>Recherche</a>
    <a href="publish.html">＋<br>Publier</a>
    <a href="favorites.html" class="active">♡<br>Favoris</a>
    <a href="profile.html">👤<br>Profil</a>
  </nav>

  <script>
    function loadFavorites() {
      const favorites = JSON.parse(localStorage.getItem('helpy_favorites')) || [];
      const container = document.getElementById('favoritesContainer');

      if (favorites.length === 0) {
        container.innerHTML = "<p style='color:#64748b;'>Vous n'avez encore aucun article sauvegardé dans vos favoris.</p>";
        return;
      }

      container.innerHTML = favorites.map(item => `
        <div class="item-card">
          <h4>${item.title}</h4>
          <p style="color: #475569; font-size: 0.9rem;">${item.description}</p>
          <button onclick="removeFavorite(${item.id})" style="margin-top: 10px; background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer;">Retirer des favoris</button>
        </div>
      `).join('');
    }

    function removeFavorite(id) {
      let favorites = JSON.parse(localStorage.getItem('helpy_favorites')) || [];
      favorites = favorites.filter(item => item.id !== id);
      localStorage.setItem('helpy_favorites', JSON.stringify(favorites));
      loadFavorites();
    }

    loadFavorites();
  </script>
</body>
</html>
