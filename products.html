<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HELPY - Produits</title>
  <style>
    body { font-family: sans-serif; background: #f8fafc; padding: 15px; max-width: 600px; margin: auto; padding-bottom: 70px; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .logo { font-size: 1.5rem; font-weight: bold; color: #2563eb; text-decoration: none; }
    .item-card { background: white; padding: 15px; border-radius: 8px; border: 1px solid #e2e8f0; margin-bottom: 12px; }
    .nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; display: flex; justify-content: space-around; padding: 10px; border-top: 1px solid #ccc; }
    .nav a { text-decoration: none; color: #555; font-size: 0.8rem; text-align: center; }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="logo">HELPY</a>
    <a href="profile.html">👤 Profil</a>
  </header>

  <h3>Tous les Produits</h3>
  <div id="productsContainer">Chargement...</div>

  <nav class="nav">
    <a href="index.html">⌂<br>Accueil</a>
    <a href="search.html">⌕<br>Recherche</a>
    <a href="publish.html">＋<br>Publier</a>
    <a href="profile.html">👤<br>Profil</a>
  </nav>

  <script>
    async function loadProducts() {
      const res = await fetch('/api/items?type=product');
      const items = await res.json();
      const container = document.getElementById('productsContainer');
      
      if (items.length === 0) {
        container.innerHTML = "<p>Aucun produit disponible pour le moment.</p>";
        return;
      }

      container.innerHTML = items.map(item => `
        <div class="item-card">
          <h4>${item.title}</h4>
          <p>${item.description}</p>
          <strong style="color: #16a34a;">${item.price} USD</strong> - <small>📍 ${item.location}</small>
        </div>
      `).join('');
    }
    loadProducts();
  </script>
</body>
</html>
