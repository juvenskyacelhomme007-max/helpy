<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HELPY - Connexion</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container" style="justify-content: center;">
    <div style="text-align: center; margin-bottom: 20px;">
      <h2 class="hero-title" style="font-size: 24px;">Connexion à HELPY</h2>
    </div>

    <form onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>Adresse Email</label>
        <input type="email" id="email" class="form-control" required placeholder="nom@exemple.com">
      </div>
      <div class="form-group">
        <label>Mot de passe</label>
        <input type="password" id="password" class="form-control" required>
      </div>
      <button type="submit" class="btn-primary" style="width: 100%; justify-content: center; margin-top: 10px;">Se connecter</button>
    </form>
    <p style="text-align: center; font-size: 12px; margin-top: 15px; color: var(--text-secondary);">
      Pas encore de compte ? <a href="register.html" style="color: var(--light-purple);">Créer un compte</a>
    </p>
  </div>

  <script src="app.js"></script>
  <script>
    async function handleLogin(e) {
      e.preventDefault();
      const res = await apiFetch('/api/login', 'POST', {
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      });

      if (res && res.user_id) {
        localStorage.setItem('helpy_user_id', res.user_id);
        window.location.href = 'profile.html';
      } else {
        alert("Échec de la connexion. Vérifiez vos identifiants.");
      }
    }
  </script>
</body>
</html>
