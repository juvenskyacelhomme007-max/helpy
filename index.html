<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HELPY - Accueil</title>
  <style>
    body { font-family: sans-serif; background: #f8fafc; padding: 15px; max-width: 600px; margin: auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .logo { font-size: 1.5rem; font-weight: bold; color: #2563eb; text-decoration: none; }
    .item-card { background: white; padding: 15px; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 12px; }
    .badge { display: inline-block; padding: 3px 8px; background: #e0e7ff; color: #3730a3; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }
    .price { font-weight: bold; color: #16a34a; }
    .nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; display: flex; justify-content: space-around; padding: 10px; border-top: 1px solid #ccc; }
    .nav a { text-decoration: none; color: #555; font-size: 0.8rem; text-align: center; }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="logo">HELPY</a>
    <a href="profile.html">👤 Profil</a>
  </header>

  <h3>Flux d'activités</h3>
  <div id="itemsContainer">Chargement des annonces...</div>

  <div style="height: 60px;"></div>

  <nav class="nav">
    <a href="index.html">⌂<br>Accueil</a>
    <a href="search.html">⌕<br>Recherche</a>
    <a href="publish.html">＋<br>Publier</a>
    <a href="profile.html">👤<br>Profil</a>
  </nav>

  <script>
    async function loadItems() {
      const res = await fetch('/api/items');
      const items = await res.json();
      const container = document.getElementById('itemsContainer');
      
      if (items.length === 0) {
        container.innerHTML = "<p>Aucune annonce disponible.</p>";
        return;
      }

      container.innerHTML = items.map(item => `
        <div class="item-card">
          <span class="badge">${item.type.toUpperCase()}</span>
          <h4>${item.title}</h4>
          <p>${item.description}</p>
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <span class="price">${item.price > 0 ? item.price + ' USD' : 'Gratuit / N/A'}</span>
            <small>📍 ${item.location}</small>
          </div>
        </div>
      `).join('');
    }

    loadItems();
  </script>
</body>
</html>
