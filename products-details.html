<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HELPY - Produit</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 20px;
    }

    .card {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
    }

    h1 {
      margin-bottom: 10px;
    }

    .price {
      font-size: 25px;
      font-weight: bold;
      margin: 15px 0;
    }

    .info {
      margin: 10px 0;
      padding: 10px;
      background: #f1f1f1;
      border-radius: 8px;
    }

    #error {
      color: red;
    }
  </style>
</head>

<body>

<div class="card">

  <h1 id="title">Chargement...</h1>

  <div id="price" class="price"></div>

  <div class="info">
    📂 Catégorie :
    <span id="category"></span>
  </div>

  <div class="info">
    📍 Localisation :
    <span id="location"></span>
  </div>

  <div class="info">
    📦 Quantité :
    <span id="quantity"></span>
  </div>

  <div class="info">
    👤 Vendeur :
    <span id="seller"></span>
  </div>

  <h3>Description</h3>

  <p id="description"></p>

  <p id="error"></p>

</div>

<script>

const id = new URLSearchParams(
  window.location.search
).get("id");

const API =
  "https://helpy-production.up.railway.app/api/products/";

async function loadProduct() {

  try {

    if (!id) {
      throw new Error("ID produit manquant");
    }

    const response =
      await fetch(API + id);

    const data =
      await response.json();

    console.log(data);

    if (!response.ok) {
      throw new Error(
        data.message || "Erreur API"
      );
    }

    const p = data.product;

    document.getElementById("title").textContent =
      p.title;

    document.getElementById("price").textContent =
      p.price + " " + p.currency;

    document.getElementById("category").textContent =
      p.category || "Non précisé";

    document.getElementById("location").textContent =
      p.location || "Non précisé";

    document.getElementById("quantity").textContent =
      p.quantity || 1;

    document.getElementById("seller").textContent =
      p.seller_name || "Vendeur";

    document.getElementById("description").textContent =
      p.description || "Aucune description";

  } catch (error) {

    console.error(error);

    document.getElementById("title").textContent =
      "Erreur";

    document.getElementById("error").textContent =
      error.message;

  }

}

loadProduct();

</script>

</body>
</html>
