<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>HELPY - Ajouter un service</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f3f4f6;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      padding: 16px;
    }

    .header {
      max-width: 800px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
    }

    .back {
      background: white;
      color: #111827;
      padding: 10px 14px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
    }

    main {
      max-width: 800px;
      margin: auto;
      padding: 25px 15px 50px;
    }

    .box {
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
    }

    h1 {
      margin-bottom: 7px;
    }

    .subtitle {
      color: #6b7280;
      margin-bottom: 25px;
    }

    .field {
      margin-bottom: 17px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      font-size: 16px;
      outline: none;
      background: white;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #2563eb;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    .required {
      color: #dc2626;
    }

    .help {
      color: #6b7280;
      font-size: 13px;
      margin-top: 5px;
    }

    .publish {
      width: 100%;
      border: none;
      background: #2563eb;
      color: white;
      padding: 14px;
      border-radius: 9px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    .publish:hover {
      background: #1d4ed8;
    }

    .publish:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    #message {
      display: none;
      padding: 13px;
      border-radius: 8px;
      margin-bottom: 17px;
      text-align: center;
      font-weight: bold;
    }

    .success {
      display: block !important;
      background: #dcfce7;
      color: #166534;
    }

    .error {
      display: block !important;
      background: #fee2e2;
      color: #991b1b;
    }

    @media(max-width:600px) {

      .header {
        flex-direction: column;
      }

      .box {
        padding: 16px;
      }

    }

  </style>

</head>


<body>

<header>

  <div class="header">

    <div class="logo">
      HELPY
    </div>

    <a
      href="/dashboard.html"
      class="back"
    >
      ← Dashboard
    </a>

  </div>

</header>


<main>

  <div class="box">

    <h1>
      🛠️ Publier un service
    </h1>

    <p class="subtitle">
      Présentez votre service aux clients sur HELPY.
    </p>

    <div id="message"></div>


    <!-- NOM DU SERVICE -->

    <div class="field">

      <label>
        Nom du service
        <span class="required">*</span>
      </label>

      <input
        type="text"
        id="title"
        placeholder="Ex: Réparation de téléphone"
        maxlength="150"
        required
      >

    </div>


    <!-- DESCRIPTION -->

    <div class="field">

      <label>
        Description
      </label>

      <textarea
        id="description"
        placeholder="Décrivez votre service..."
      ></textarea>

    </div>


    <!-- PRIX -->

    <div class="field">

      <label>
        Prix
        <span class="required">*</span>
      </label>

      <input
        type="number"
        id="price"
        placeholder="Ex: 1500"
        min="0"
        step="0.01"
        required
      >

    </div>


    <!-- DEVISE -->

    <div class="field">

      <label>
        Devise
      </label>

      <select id="currency">

        <option value="HTG">
          HTG - Gourdes
        </option>

        <option value="USD">
          USD - Dollars
        </option>

      </select>

    </div>


    <!-- CATEGORIE -->

    <div class="field">

      <label>
        Catégorie
      </label>

      <select id="category">

        <option value="">
          Sélectionner une catégorie
        </option>

        <option value="Informatique">
          💻 Informatique
        </option>

        <option value="Réparation">
          🔧 Réparation
        </option>

        <option value="Beauté">
          💇 Beauté
        </option>

        <option value="Transport">
          🚗 Transport
        </option>

        <option value="Éducation">
          📚 Éducation
        </option>

        <option value="Design">
          🎨 Design
        </option>

        <option value="Photographie">
          📷 Photographie
        </option>

        <option value="Cuisine">
          🍔 Cuisine
        </option>

        <option value="Nettoyage">
          🧹 Nettoyage
        </option>

        <option value="Construction">
          🏗️ Construction
        </option>

        <option value="Autre">
          📦 Autre
        </option>

      </select>

    </div>


    <!-- LOCALISATION -->

    <div class="field">

      <label>
        Localisation
      </label>

      <input
        type="text"
        id="location"
        placeholder="Ex: Delmas"
        maxlength="150"
      >

    </div>


    <!-- WHATSAPP -->

    <div class="field">

      <label>
        WhatsApp
        <span class="required">*</span>
      </label>

      <input
        type="tel"
        id="whatsapp"
        placeholder="Ex: 32699268"
        maxlength="30"
        required
      >

      <div class="help">
        Les clients utiliseront ce numéro pour vous contacter.
      </div>

    </div>


    <!-- IMAGE -->

    <div class="field">

      <label>
        Image du service
      </label>

      <input
        type="url"
        id="image_url"
        placeholder="https://..."
      >

      <div class="help">
        Optionnel.
      </div>

    </div>


    <button
      id="publishButton"
      class="publish"
      onclick="publishService()"
    >
      🚀 Publier le service
    </button>

  </div>

</main>


<script>

// =====================================================
// CONFIGURATION API HELPY
// =====================================================

const API_URL =
  "https://helpy-production.up.railway.app";


// =====================================================
// VERIFIER UTILISATEUR
// =====================================================

let user = null;

try {

  user = JSON.parse(
    localStorage.getItem("helpyUser")
  );

} catch (error) {

  console.error(
    "Erreur lecture utilisateur:",
    error
  );

}


if (!user || !user.id) {

  window.location.href =
    "/login.html";

}


// =====================================================
// MESSAGE
// =====================================================

function showMessage(text, type) {

  const message =
    document.getElementById("message");

  message.textContent = text;

  message.className = type;

}


// =====================================================
// PUBLIER SERVICE
// =====================================================

async function publishService() {

  const button =
    document.getElementById(
      "publishButton"
    );


  const title =
    document.getElementById(
      "title"
    ).value.trim();


  const description =
    document.getElementById(
      "description"
    ).value.trim();


  const price =
    document.getElementById(
      "price"
    ).value;


  const currency =
    document.getElementById(
      "currency"
    ).value;


  const category =
    document.getElementById(
      "category"
    ).value;


  const location =
    document.getElementById(
      "location"
    ).value.trim();


  const whatsapp =
    document.getElementById(
      "whatsapp"
    ).value.trim();


  const image_url =
    document.getElementById(
      "image_url"
    ).value.trim();


  // =================================================
  // VALIDATION
  // =================================================

  if (!title) {

    showMessage(
      "Veuillez entrer le nom du service.",
      "error"
    );

    return;

  }


  if (
    price === "" ||
    isNaN(Number(price)) ||
    Number(price) < 0
  ) {

    showMessage(
      "Veuillez entrer un prix valide.",
      "error"
    );

    return;

  }


  if (!whatsapp) {

    showMessage(
      "Le numéro WhatsApp est obligatoire.",
      "error"
    );

    return;

  }


  // =================================================
  // LOADING
  // =================================================

  button.disabled = true;

  button.textContent =
    "⏳ Publication en cours...";


  try {

    // =================================================
    // ENVOI AU BACKEND RAILWAY
    // =================================================

    const response =
      await fetch(
        API_URL + "/api/services",
        {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({

            user_id:
              user.id,

            title:
              title,

            description:
              description || null,

            price:
              Number(price),

            currency:
              currency,

            category:
              category || null,

            location:
              location || null,

            whatsapp:
              whatsapp,

            image_url:
              image_url || null

          })

        }
      );


    // =================================================
    // LIRE REPONSE
    // =================================================

    const data =
      await response.json();


    // =================================================
    // ERREUR API
    // =================================================

    if (!response.ok) {

      throw new Error(
        data.message ||
        "Impossible de publier le service."
      );

    }


    // =================================================
    // SUCCES
    // =================================================

    showMessage(
      "✅ Service publié avec succès !",
      "success"
    );


    button.textContent =
      "✅ Service publié";


    // =================================================
    // REDIRECTION
    // =================================================

    setTimeout(
      () => {

        window.location.href =
          "/services.html";

      },
      1200
    );


  } catch (error) {

    console.error(
      "ERREUR PUBLICATION SERVICE:",
      error
    );


    showMessage(
      "❌ " + (
        error.message ||
        "Erreur de connexion au serveur."
      ),
      "error"
    );


    button.disabled = false;

    button.textContent =
      "🚀 Publier le service";

  }

}

</script>

</body>

</html>
