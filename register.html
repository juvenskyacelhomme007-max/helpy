<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Créer un compte — HELPY</title><link rel="stylesheet" href="style.css"><script src="app.js"></script></head><body><main class="container"><form class="form" onsubmit="go(event)"><h1>Créer ton compte</h1><div class="field"><label>Nom</label><input id="name" required></div><div class="field"><label>Email</label><input id="email" type="email" required></div><div class="field"><label>Mot de passe</label><input id="password" type="password" minlength="6" required></div><div class="field"><label>WhatsApp</label><input id="whatsapp" required></div><div class="field"><label>Pays</label><input id="country" required></div><div class="field"><label>Ville / zone</label><input id="city"></div><button class="btn">Créer le compte</button><p id="msg" class="muted"></p></form></main><script>async function go(e){e.preventDefault();msg.textContent='Création...';const r=await apiFetch('/api/register','POST',{name:name.value,email:email.value,password:password.value,whatsapp:whatsapp.value,country:country.value,city:city.value});if(r.error){msg.textContent=r.message;return}saveUser(r.utilisateur);location.href='index.html'}</script></body></html>
