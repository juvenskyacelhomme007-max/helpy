<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscription - HElPY</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="app-header">
    <a href="index.html">HElPY</a>
  </header>

  <div class="container">
    <div class="card">
      <h2>Créer un compte</h2>
      <form id="register-form" class="mt-4">
        <div class="form-group">
          <label>Nom complet</label>
          <input type="text" id="name" required>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" required>
        </div>
        <div class="form-group">
          <label>Mot de passe</label>
          <input type="password" id="password" required>
        </div>
        <div class="form-group">
          <label>Téléphone</label>
          <input type="tel" id="phone">
        </div>
        <div class="form-group">
          <label>WhatsApp</label>
          <input type="tel" id="whatsapp">
        </div>
        <div class="form-group">
          <label>Localisation (Ville)</label>
          <input type="text" id="location" placeholder="Ex: Port-au-Prince">
        </div>
        <button type="submit" class="btn">S'inscrire</button>
      </form>
      <p class="mt-4 text-center">
        Déjà un compte? <a href="login.html">Se connecter</a>
      </p>
    </div>
  </div>

  <script>
    const API_BASE = window.location.origin;

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
        phone: document.getElementById('phone').value,
        whatsapp: document.getElementById('whatsapp').value,
        location: document.getElementById('location').value
      };

      try {
        const res = await fetch(`${API_BASE}/api/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (data.status === 'ok') {
          localStorage.setItem('helpyUser', JSON.stringify(data.user));
          window.location.href = 'profile.html';
        } else {
          alert(data.error || "Erreur lors de l'inscription");
        }
      } catch (err) {
        alert('Erreur réseau');
      }
    });
  </script>
</body>
</html>
