<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>HELPY - Produits</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f3f4f6;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      padding: 16px;
    }

    .header {
      max-width: 1100px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
    }

    .buttons {
      display: flex;
      gap: 8px;
    }

    .btn {
      text-decoration: none;
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .dashboard {
      background: white;
      color: #111827;
    }

    .add {
      background: #2563eb;
      color: white;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 20px 15px 40px;
    }

    h1 {
      margin-bottom: 5px;
    }

    .subtitle {
      color: #6b7280;
      margin-bottom: 20px;
    }

    .search {
      width: 100%;
      padding: 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 20px;
      outline: none;
    }

    .search:focus {
      border-color: #2563eb;
    }

    #message {
      text-align: center;
      padding: 20px;
      color: #6b7280;
    }

    #products {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 18px;
    }

    .card {
      background: white;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
    }

    .no-image {
      height: 180px;
      background: #e5e7eb;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 60px;
    }

    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      display: block;
    }

    .content {
      padding: 15px;
    }

    .category {
      display: inline-block;
      background: #eff6ff;
      color: #2563eb;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 9px;
    }

    .title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .description {
      color: #6b7280;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 12px;
    }

    .price {
      font-size: 21px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .info {
      color: #6b7280;
      font-size: 14px;
      margin-top: 6px;
    }

    .seller {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #e5e7eb;
      font-size: 14px;
    }

    .whatsapp {
      display: block;
      background: #25D366;
      color: white;
      text-align: center;
      text-decoration: none;
      padding: 12px;
      border-radius: 8px;
      margin-top: 14px;
      font-weight: bold;
    }

    .empty {
      background: white;
      padding: 40px 20px;
      border-radius: 12px;
      text-align: center;
      color: #6b7280;
    }

    @media(max-width:600px) {

      .header {
        flex-direction: column;
      }

      .buttons {
        width: 100%;
        justify-content: center;
      }

      #products {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="header">

    <div class="logo">
      HELPY
    </div>

    <div class="buttons">

      <a
        href="/dashboard.html"
        class="btn dashboard"
      >
        Dashboard
      </a>

      <a
        href="/add-product.html"
        class="btn add"
      >
        + Vendre
      </a>

    </div>

  </div>

</header>


<main>

  <h1>🛍️ Produits</h1>

  <p class="subtitle">
    Découvrez les produits disponibles sur HELPY.
  </p>


  <input
    type="text"
    id="search"
    class="search"
    placeholder="🔎 Rechercher un produit..."
  >


  <div id="message">
    Chargement des produits...
  </div>


  <div id="products"></div>

</main>


<script>

let products = [];


async function loadProducts() {

  try {

    const response =
      await fetch("/api/products");

    const data =
      await response.json();


    console.log("HELPY PRODUCTS:", data);


    if (!response.ok) {

      throw new Error(
        data.message || "Erreur"
      );

    }


    products =
      data.products || [];


    document.getElementById("message")
      .style.display = "none";


    showProducts(products);


  } catch (error) {

    console.error(error);


    document.getElementById("message")
      .innerHTML = `
        ❌ Erreur lors du chargement
        des produits.
        <br><br>
        ${error.message}
      `;

  }

}



function showProducts(list) {

  const container =
    document.getElementById("products");


  if (!list.length) {

    container.innerHTML = `
      <div class="empty">

        <div style="font-size:50px;">
          🛍️
        </div>

        <h3>
          Aucun produit trouvé
        </h3>

      </div>
    `;

    return;

  }


  container.innerHTML =
    list.map(product => {


      let image = "";


      if (product.image_url) {

        image = `
          <img
            src="${escapeHTML(product.image_url)}"
            alt="${escapeHTML(product.title)}"
          >
        `;

      } else {

        image = `
          <div class="no-image">
            🛍️
          </div>
        `;

      }


      let whatsapp =
        String(product.whatsapp || "")
        .replace(/\D/g, "");


      if (whatsapp.length === 8) {

        whatsapp =
          "509" + whatsapp;

      }


      const whatsappLink =
        "https://wa.me/" + whatsapp;


      return `

        <div class="card">

          ${image}

          <div class="content">

            <span class="category">
              ${escapeHTML(
                product.category || "Autre"
              )}
            </span>


            <div class="title">
              ${escapeHTML(
                product.title
              )}
            </div>


            <div class="description">

              ${
                product.description
                ? escapeHTML(
                    product.description
                  )
                : "Aucune description."
              }

            </div>


            <div class="price">

              ${formatPrice(product.price)}
              ${escapeHTML(
                product.currency || "HTG"
              )}

            </div>


            <div class="info">

              📦 Quantité :
              ${product.quantity || 1}

            </div>


            <div class="info">

              📍
              ${
                escapeHTML(
                  product.location ||
                  "Non indiqué"
                )
              }

            </div>


            <div class="seller">

              👤 Vendeur :
              <strong>
                ${
                  escapeHTML(
                    product.seller_name ||
                    "Vendeur"
                  )
                }
              </strong>

            </div>


            <a
              href="${whatsappLink}"
              target="_blank"
              rel="noopener noreferrer"
              class="whatsapp"
            >
              💬 Contacter sur WhatsApp
            </a>

          </div>

        </div>

      `;

    }).join("");

}



document
  .getElementById("search")
  .addEventListener(
    "input",
    function() {

      const value =
        this.value
        .toLowerCase()
        .trim();


      if (!value) {

        showProducts(products);

        return;

      }


      const filtered =
        products.filter(product => {

          const text = `

            ${product.title || ""}

            ${product.description || ""}

            ${product.category || ""}

            ${product.location || ""}

            ${product.seller_name || ""}

          `.toLowerCase();


          return text.includes(value);

        });


      showProducts(filtered);

    }
  );



function formatPrice(price) {

  const number =
    Number(price);


  if (isNaN(number)) {

    return price;

  }


  return new Intl.NumberFormat(
    "fr-FR",
    {
      minimumFractionDigits: 0,
      maximumFractionDigits: 2
    }
  ).format(number);

}



function escapeHTML(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}



loadProducts();

</script>

</body>
</html>
