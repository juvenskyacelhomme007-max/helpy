<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Détails du service - HELPY</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fa;
      color: #17202a;
    }

    header {
      background: white;
      height: 65px;
      padding: 0 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #e5e7eb;
    }

    .logo {
      font-size: 25px;
      font-weight: 900;
    }

    .back {
      border: none;
      background: #f1f3f5;
      padding: 10px 15px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    main {
      max-width: 900px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .card {
      display: none;
      background: white;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 5px 25px rgba(0,0,0,.07);
    }

    .image {
      height: 350px;
      background: #eef1f5;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .placeholder {
      font-size: 70px;
    }

    .content {
      padding: 25px;
    }

    .category {
      display: none;
      background: #eef2ff;
      color: #3949ab;
      padding: 7px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 30px;
      margin-bottom: 12px;
    }

    .price {
      font-size: 28px;
      font-weight: 900;
      margin-bottom: 20px;
    }

    .info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 25px;
    }

    .box {
      background: #f7f8fa;
      padding: 15px;
      border-radius: 12px;
    }

    .label {
      color: #777;
      font-size: 12px;
      margin-bottom: 5px;
    }

    .value {
      font-weight: bold;
    }

    .description {
      border-top: 1px solid #eee;
      padding-top: 22px;
    }

    .description h2 {
      font-size: 20px;
      margin-bottom: 10px;
    }

    .description p {
      color: #555;
      line-height: 1.7;
      white-space: pre-wrap;
    }

    .provider {
      margin-top: 25px;
      background: #f7f8fa;
      padding: 18px;
      border-radius: 12px;
    }

    .whatsapp {
      display: block;
      margin-top: 20px;
      padding: 16px;
      background: #25D366;
      color: white;
      text-align: center;
      text-decoration: none;
      border-radius: 12px;
      font-weight: bold;
    }

    #loading {
      text-align: center;
      padding: 50px;
    }

    #error {
      display: none;
      background: white;
      padding: 30px;
      text-align: center;
      border-radius: 15px;
    }

    #error p {
      color: #777;
      margin-top: 10px;
    }

    @media (max-width: 600px) {
      .image {
        height: 280px;
      }

      h1 {
        font-size: 24px;
      }

      .price {
        font-size: 24px;
      }

      .info {
        grid-template-columns: 1fr;
      }

      .content {
        padding: 20px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">HELPY</div>

  <button class="back" onclick="history.back()">
    ← Retour
  </button>
</header>


<main>

  <div id="loading">
    Chargement du service...
  </div>


  <div id="error">

    <h2>Service introuvable</h2>

    <p id="errorMessage">
      Impossible de charger ce service.
    </p>

  </div>


  <div id="serviceCard" class="card">

    <div class="image">

      <img id="serviceImage" alt="Service">

      <div id="placeholder" class="placeholder">
        🛠️
      </div>

    </div>


    <div class="content">

      <div id="category" class="category"></div>

      <h1 id="title"></h1>

      <div id="price" class="price"></div>


      <div class="info">

        <div class="box">

          <div class="label">
            📍 Localisation
          </div>

          <div id="location" class="value">
            Non précisé
          </div>

        </div>


        <div class="box">

          <div class="label">
            👤 Prestataire
          </div>

          <div id="provider" class="value">
          </div>

        </div>

      </div>


      <div class="description">

        <h2>
          Description
        </h2>

        <p id="description">
        </p>

      </div>


      <a
        id="whatsapp"
        class="whatsapp"
        href="#"
        target="_blank">

        💬 Contacter le prestataire sur WhatsApp

      </a>

    </div>

  </div>

</main>


<script>

const API_URL =
  "https://helpy-production.up.railway.app";


async function loadService() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  const id =
    params.get("id");


  if (!id) {

    showError(
      "Aucun identifiant de service trouvé."
    );

    return;
  }


  try {

    const response =
      await fetch(
        `${API_URL}/api/services/${encodeURIComponent(id)}`
      );


    const data =
      await response.json();


    console.log(
      "HELPY SERVICE:",
      data
    );


    if (
      !response.ok ||
      data.status !== "ok" ||
      !data.service
    ) {

      showError(
        data.message ||
        "Service introuvable."
      );

      return;
    }


    const service =
      data.service;


    document
      .getElementById("loading")
      .style.display = "none";


    document
      .getElementById("serviceCard")
      .style.display = "block";


    // TITRE
    document
      .getElementById("title")
      .textContent =
        service.title ||
        "Service sans nom";


    // PRIX
    document
      .getElementById("price")
      .textContent =
        `${service.price || 0} ${service.currency || "HTG"}`;


    // CATÉGORIE
    if (service.category) {

      const category =
        document.getElementById("category");

      category.textContent =
        service.category;

      category.style.display =
        "inline-block";
    }


    // LOCALISATION
    document
      .getElementById("location")
      .textContent =
        service.location ||
        "Non précisé";


    // PRESTATAIRE
    document
      .getElementById("provider")
      .textContent =
        service.provider_name ||
        "Prestataire";


    // DESCRIPTION
    document
      .getElementById("description")
      .textContent =
        service.description ||
        "Aucune description disponible.";


    // IMAGE
    if (service.image_url) {

      const image =
        document.getElementById(
          "serviceImage"
        );

      image.src =
        service.image_url;

      image.style.display =
        "block";

      document
        .getElementById("placeholder")
        .style.display =
          "none";
    }


    // WHATSAPP
    const whatsapp =
      document.getElementById(
        "whatsapp"
      );


    if (service.whatsapp) {

      let number =
        String(
          service.whatsapp
        ).replace(
          /\D/g,
          ""
        );


      if (number.length === 8) {
        number =
          "509" + number;
      }


      const message =
        "Bonjour, je suis intéressé par votre service : " +
        (service.title || "");


      whatsapp.href =
        `https://wa.me/${number}?text=${encodeURIComponent(message)}`;

    } else {

      whatsapp.style.display =
        "none";
    }


  } catch (error) {

    console.error(
      "SERVICE DETAIL ERROR:",
      error
    );


    showError(
      "Impossible de communiquer avec le serveur."
    );
  }
}


function showError(message) {

  document
    .getElementById("loading")
    .style.display = "none";


  document
    .getElementById("error")
    .style.display = "block";


  document
    .getElementById("errorMessage")
    .textContent =
      message;
}


loadService();

</script>

</body>
</html>
