<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Annonces - HElPY</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="app-header">
    <a href="index.html">HElPY</a>
    <span id="page-title" style="font-size:0.9rem; font-weight:normal;">Annonces</span>
  </header>

  <div class="container">
    <div id="listings-container" class="grid">
      <p>Chargement...</p>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">Accueil</a>
    <a href="search.html" class="nav-item">Recherche</a>
    <a href="publish.html" class="nav-item">+ Publier</a>
    <a href="my-listings.html" class="nav-item">Mes Annonces</a>
    <a href="profile.html" class="nav-item">Profil</a>
  </nav>

  <script>
    const API_BASE = window.location.origin;
    const urlParams = new URLSearchParams(window.location.search);
    const type = urlParams.get('type');
    const category = urlParams.get('category');

    if (type) document.getElementById('page-title').innerText = type.toUpperCase();

    async function loadListings() {
      try {
        let url = `${API_BASE}/api/listings?`;
        if (type) url += `type=${type}&`;
        if (category) url += `category=${encodeURIComponent(category)}`;

        const res = await fetch(url);
        const data = await res.json();
        const container = document.getElementById('listings-container');

        if (!data.listings || data.listings.length === 0) {
          container.innerHTML = '<p class="text-center">Aucune annonce trouvée.</p>';
          return;
        }

        container.innerHTML = data.listings.map(item => `
          <div class="item-card" onclick="location.href='listing-details.html?id=${item.id}'">
            <img src="${item.image_url || 'https://via.placeholder.com/150'}" alt="${item.title}">
            <div class="item-card-content">
              <div class="item-title">${item.title}</div>
              <div class="item-price">${item.price ? item.price + ' ' + item.currency : ''}</div>
              <div class="item-category">${item.category}</div>
            </div>
          </div>
        `).join('');
      } catch (err) {
        document.getElementById('listings-container').innerHTML = '<p>Erreur de chargement.</p>';
      }
    }

    loadListings();
  </script>
</body>
</html>
