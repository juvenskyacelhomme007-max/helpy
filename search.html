<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HELPY - Recherche</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .filter-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; }
    .tab { background: var(--card-bg); border: 1px solid var(--border-color); padding: 6px 14px; border-radius: 20px; font-size: 12px; color: var(--text-secondary); cursor: pointer; white-space: nowrap; }
    .tab.active { background: var(--primary-purple); color: var(--text-white); border-color: var(--primary-purple); }
    .results-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
  </style>
</head>
<body>
  <div class="app-container">
    <h2 class="hero-title">Que recherchez-vous ?</h2>

    <div class="search-bar">
      <i class="fa-solid fa-magnifying-glass search-icon"></i>
      <input type="text" id="search-input" placeholder="Rechercher un service, un commerce...">
    </div>

    <div class="filter-tabs">
      <div class="tab active" onclick="filterSearch('all', this)">Tous</div>
      <div class="tab" onclick="filterSearch('business', this)">Entreprises</div>
      <div class="tab" onclick="filterSearch('product', this)">Produits</div>
      <div class="tab" onclick="filterSearch('service', this)">Services</div>
      <div class="tab" onclick="filterSearch('real_estate', this)">Immobilier</div>
      <div class="tab" onclick="filterSearch('vehicle', this)">Véhicules</div>
    </div>

    <div class="results-grid" id="search-results">
      <!-- Les résultats s'affichent ici -->
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i><span>Accueil</span></a>
    <a href="search.html" class="nav-item active"><i class="fa-solid fa-magnifying-glass"></i><span>Rechercher</span></a>
    <a href="publish.html" class="nav-item nav-publish"><div class="publish-btn-circle"><i class="fa-solid fa-plus"></i></div><span>Publier</span></a>
    <a href="favorites.html" class="nav-item"><i class="fa-regular fa-bookmark"></i><span>Favoris</span></a>
    <a href="profile.html" class="nav-item"><i class="fa-regular fa-user"></i><span>Profil</span></a>
  </nav>

  <script src="app.js"></script>
  <script>
    let currentType = 'all';

    async function performSearch() {
      const query = document.getElementById('search-input').value;
      const data = await apiFetch(`/api/search?q=${encodeURIComponent(query)}&type=${currentType}`);
      const container = document.getElementById('search-results');

      if (data && data.length > 0) {
        container.innerHTML = data.map(item => `
          <div class="card" style="max-width: 100%;">
            <div class="card-img-container">
              <img src="${item.image_url || 'https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&w=300&q=80'}" class="card-img">
              <div class="badge-cat">${item.type || 'Annonce'}</div>
            </div>
            <div class="card-body">
              <h4 class="card-title">${item.title || item.name}</h4>
              <div class="card-location"><i class="fa-solid fa-location-dot"></i> ${item.location || 'Haïti'}</div>
              <a href="listing-details.html?id=${item.id}" class="btn-contact">Voir détails</a>
            </div>
          </div>
        `).join('');
      } else {
        container.innerHTML = '<div class="empty-state">Aucun résultat trouvé.</div>';
      }
    }

    function filterSearch(type, element) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      element.classList.add('active');
      currentType = type;
      performSearch();
    }

    document.getElementById('search-input').addEventListener('input', performSearch);
    document.addEventListener('DOMContentLoaded', performSearch);
  </script>
</body>
</html>
