<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HELPY</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f6fb;
      color: #172033;
    }

    header {
      background: white;
      padding: 18px 20px;
      text-align: center;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      font-size: 34px;
      font-weight: 800;
      color: #5846e8;
    }

    .subtitle {
      color: #777;
      margin-top: 5px;
    }

    nav {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 12px 10px;
      background: white;
    }

    nav a {
      text-decoration: none;
      color: #172033;
      background: #f0efff;
      padding: 10px 14px;
      border-radius: 20px;
      white-space: nowrap;
      font-size: 14px;
      font-weight: bold;
    }

    nav a.active,
    nav a:hover {
      background: #5846e8;
      color: white;
    }

    .hero {
      text-align: center;
      padding: 55px 20px 30px;
    }

    .hero h1 {
      font-size: 42px;
      margin-bottom: 12px;
    }

    .hero p {
      font-size: 18px;
      color: #666;
    }

    .chat {
      width: calc(100% - 30px);
      max-width: 700px;
      margin: 20px auto 100px;
      background: white;
      border-radius: 24px;
      padding: 25px;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
    }

    .message {
      background: #f0f1f7;
      padding: 18px;
      border-radius: 18px;
      margin-bottom: 20px;
      font-size: 16px;
    }

    .input-area {
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      border: 1px solid #ddd;
      border-radius: 15px;
      padding: 15px;
      font-size: 16px;
      outline: none;
    }

    button {
      border: none;
      background: #5846e8;
      color: white;
      padding: 0 22px;
      border-radius: 15px;
      font-size: 16px;
      font-weight: bold;
    }

    @media(max-width:600px) {
      .hero h1 {
        font-size: 34px;
      }

      .input-area {
        flex-direction: column;
      }

      button {
        height: 50px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">HELPY</div>
  <div class="subtitle">Votre assistant intelligent</div>
</header>

<nav>
  <a href="/" class="active">🏠 Accueil</a>
  <a href="/login.html">🔐 Connexion</a>
  <a href="/register.html">📝 Inscription</a>
  <a href="/products.html">🛒 Produits</a>
  <a href="/services.html">🛠️ Services</a>
  <a href="/add-service.html">➕ Ajouter</a>
</nav>

<section class="hero">
  <h1>Bonjour 👋</h1>
  <p>Comment puis-je vous aider aujourd'hui ?</p>
</section>

<div class="chat">

  <div class="message" id="chatMessage">
    Bonjour 👋 Je suis HELPY. Posez-moi votre question.
  </div>

  <div class="input-area">
    <input
      type="text"
      id="messageInput"
      placeholder="Écrivez votre message..."
    >

    <button onclick="sendMessage()">
      Envoyer
    </button>
  </div>

</div>

<script>
  const API_URL = "https://helpy-production.up.railway.app";

  async function sendMessage() {

    const input = document.getElementById("messageInput");
    const messageBox = document.getElementById("chatMessage");

    const text = input.value.trim();

    if (!text) return;

    messageBox.innerText = "⏳ HELPY réfléchit...";
    input.value = "";

    try {

      const response = await fetch(API_URL + "/api", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          message: text
        })
      });

      const data = await response.json();

      messageBox.innerText =
        data.message ||
        data.response ||
        "Je n'ai pas pu répondre.";

    } catch (error) {

      console.error(error);

      messageBox.innerText =
        "❌ Impossible de contacter HELPY.";
    }
  }

  document
    .getElementById("messageInput")
    .addEventListener("keydown", function(e) {

      if (e.key === "Enter") {
        sendMessage();
      }

    });
</script>

</body>
</html>
