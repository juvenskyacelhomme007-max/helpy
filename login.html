<!DOCTYPE html>
<html lang="ht">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HELPY - Koneksyon</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <div style="text-align: center; margin-bottom: 24px; margin-top: 40px;">
      <div class="logo-badge" style="width: 50px; height: 50px; margin: 0 auto 12px; font-weight: bold; font-size: 20px;">H</div>
      <h2>Konekte sou HELPY</h2>
      <p style="color: var(--text-gray); font-size: 14px; margin-top: 4px;">Antre imèl ak mo de pas ou</p>
    </div>

    <form id="loginForm">
      <div style="margin-bottom: 16px;">
        <label style="display:block; margin-bottom:6px; font-size:14px; color:var(--text-gray);">Imèl</label>
        <input type="email" id="loginEmail" class="search-box" style="width: 100%; color: white;" placeholder="zanmi@email.com" required>
      </div>

      <div style="margin-bottom: 20px;">
        <label style="display:block; margin-bottom:6px; font-size:14px; color:var(--text-gray);">Mo de pas</label>
        <input type="password" id="loginPassword" class="search-box" style="width: 100%; color: white;" placeholder="••••••••" required>
      </div>

      <button type="submit" style="width: 100%; background: var(--primary); color: white; border: none; padding: 12px; border-radius: 12px; font-weight: 600; cursor: pointer;">
        Konekte
      </button>
    </form>

    <div id="loginMessage" style="margin-top: 12px; text-align: center; font-size: 14px;"></div>

    <div style="text-align: center; margin-top: 20px; font-size: 14px; color: var(--text-gray);">
      Ou pa gen kont? <a href="register.html" style="color: var(--primary);">Kreye yon kont</a>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      const msg = document.getElementById('loginMessage');

      msg.style.color = '#94a3b8';
      msg.innerText = "Verifikasyon...";

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (res.ok) {
          msg.style.color = '#4ade80';
          msg.innerText = "Koneksyon reyisi! N ap redirije w...";
          if (data.user) {
            localStorage.setItem('helpy_user_id', String(data.user.id));
            localStorage.setItem('helpyUser', JSON.stringify(data.user));
            localStorage.setItem('helpy_user', JSON.stringify(data.user));
          }
          setTimeout(() => window.location.href = '/', 900);
        } else {
          msg.style.color = '#ef4444';
          msg.innerText = data.error || "Pwoblèm nan koneksyon an.";
        }
      } catch (err) {
        msg.style.color = '#ef4444';
        msg.innerText = "Erè sèvè.";
      }
    });
  </script>
</body>
</html>
