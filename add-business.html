<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ajouter une entreprise — HELPY</title><link rel="stylesheet" href="style.css"><script src="app.js"></script></head><body><main class="container"><form class="form" onsubmit="go(event)"><h1>Présenter une entreprise</h1><div class="field"><label>Nom *</label><input id="name" required></div><div class="field"><label>Catégorie</label><input id="category"></div><div class="field"><label>Description</label><textarea id="description"></textarea></div><div class="field"><label>Téléphone</label><input id="phone"></div><div class="field"><label>WhatsApp *</label><input id="whatsapp" required></div><div class="field"><label>Pays</label><input id="country"></div><div class="field"><label>Ville / zone</label><input id="city"></div><div class="field"><label>Adresse</label><input id="address"></div><button class="btn">Publier l'entreprise</button><p id="msg" class="muted"></p></form></main><script>async function go(e){e.preventDefault();const r=await apiFetch('/api/businesses','POST',{name:name.value,category:category.value,description:description.value,phone:phone.value,whatsapp:whatsapp.value,country:country.value,city:city.value,address:address.value});msg.textContent=r.error?r.message:'Entreprise publiée avec succès.'}</script></body></html>
