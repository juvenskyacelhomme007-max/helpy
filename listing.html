<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/icon.svg"><link rel="stylesheet" href="/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/config.js"></script><script src="/supabase.js"></script><title>Détail — HELPY</title></head><body><header class="topbar"><div class="inner"><a class="brand" href="/"><span class="logo">H</span><span class="brand-name">HELPY</span></a><a class="outline-btn" href="/search.html">Retour</a></div></header><main class="container page"><div id="detail" class="detail"><div class="empty">Chargement…</div></div></main><nav class="bottom-nav"><a href="/"><div>⌂</div><span>Accueil</span></a><a href="/search.html"><div>⌕</div><span>Recherche</span></a><a class="publish-fab" href="/publish.html"><div>＋</div><span>Publier</span></a><a href="/messages.html"><div>💬</div><span>Messages</span></a><a href="/profile.html"><div>♙</div><span>Profil</span></a></nav><script>
async function load(){const id=new URLSearchParams(location.search).get("id");const db=await HELPY.init();if(!db||!id){detail.innerHTML='<div class="empty">Annonce introuvable.</div>';return}const {data:x,error}=await db.from("listings").select("*").eq("id",id).maybeSingle();if(error||!x){detail.innerHTML='<div class="empty">Annonce introuvable.</div>';return}const img=x.image_url?`<img src="${HELPY.esc(x.image_url)}">`:'<div style="display:grid;place-items:center;height:100%;font-size:80px">📦</div>';detail.innerHTML=`<div class="detail-img">${img}</div><div><span class="kicker" style="color:var(--muted);background:#eef2f6">${x.type==="service"?"SERVICE":"PRODUIT"}</span><h1>${HELPY.esc(x.title)}</h1><div class="detail-price">${HELPY.money(x.price,x.currency)}</div><div class="meta"><span>📍 ${HELPY.esc([x.location,x.country].filter(Boolean).join(", ")||"Worldwide")}</span><span>📦 ${Number(x.quantity)||1} disponible(s)</span><span>🏷️ ${HELPY.esc(x.category||"Général")}</span></div><div class="panel"><h3>Description</h3><p class="muted" style="line-height:1.7">${HELPY.esc(x.description||"Aucune description.")}</p></div><div class="contact-row"><button class="outline-btn" onclick="showMessage('${x.user_id}')">💬 Contacter</button>${x.contact?`<a class="primary" href="tel:${HELPY.esc(x.contact)}">☎ Appeler</a>`:""}</div><div id="box" style="display:none;margin-top:15px" class="panel"><textarea id="body" style="width:100%;min-height:90px;border:1px solid var(--line);border-radius:13px;padding:12px" placeholder="Écris ton message…"></textarea><button class="primary" style="margin-top:8px" onclick="send('${x.user_id}')">Envoyer</button></div></div>`}
function showMessage(){document.getElementById("box").style.display="block"}async function send(receiver){const u=await HELPY.requireAuth();if(!u)return;const text=document.getElementById("body").value.trim();if(!text)return;const db=await HELPY.init();const {error}=await db.from("messages").insert({sender_id:u.id,receiver_id:receiver,body:text});if(error)alert(error.message);else alert("Message envoyé.")}
load();
</script></body></html>
