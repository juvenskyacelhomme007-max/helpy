<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/icon.svg"><link rel="stylesheet" href="/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/config.js"></script><script src="/supabase.js"></script><title>Créer un compte — HELPY</title></head><body><main class="auth-wrap"><section class="auth panel"><a class="brand" href="/" style="justify-content:center"><span class="logo">H</span><span class="brand-name">HELPY</span></a><h1>Créer ton compte</h1><p>Rejoins HELPY et commence à découvrir le monde.</p><div id="msg"></div><form id="form" class="form"><div class="field"><label>Nom complet</label><input id="name" required></div><div class="field"><label>E-mail</label><input id="email" type="email" required></div><div class="field"><label>Mot de passe</label><input id="password" type="password" minlength="6" required></div><button class="primary">Créer mon compte</button></form><p>Déjà inscrit ? <a style="color:var(--blue);font-weight:800" href="/login.html">Se connecter</a></p></section></main><script>form.onsubmit=async e=>{e.preventDefault();const db=await HELPY.init();if(!db){msg.className="notice error";msg.textContent="Supabase n’est pas configuré.";return}const {data,error}=await db.auth.signUp({email:email.value.trim(),password:password.value,options:{data:{name:name.value.trim()}}});if(error){msg.className="notice error";msg.textContent=error.message;return}msg.className="notice ok";msg.textContent=data.session?"Compte créé !":"Compte créé. Vérifie ton e-mail si nécessaire.";setTimeout(()=>location.href="/",1000)}</script></body></html>
