<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HElPY</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f4f7f9;
 color:#17202a;
}
header{
 background:#087f5b;
 color:white;
 padding:20px;
 text-align:center;
}
h1{margin:0}
main{
 max-width:500px;
 margin:auto;
 padding:20px;
}
.card{
 background:white;
 padding:18px;
 margin-bottom:15px;
 border-radius:14px;
 box-shadow:0 3px 12px #0001;
}
input,button{
 width:100%;
 padding:13px;
 margin:7px 0;
 border-radius:9px;
 border:1px solid #ddd;
}
button{
 background:#087f5b;
 color:white;
 border:0;
 font-weight:bold;
}
button:active{opacity:.8}
#result{
 margin-top:15px;
 padding:10px;
}
</style>
</head>

<body>

<header>
<h1>HElPY</h1>
<p>Biznis • Pwodwi • Sèvis</p>
</header>

<main>

<div class="card">
<h2>Kreye kont</h2>

<input id="name" placeholder="Non ou">
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Modpas">
<input id="phone" placeholder="Telefòn">
<input id="whatsapp" placeholder="WhatsApp">

<button onclick="register()">Kreye kont</button>
</div>

<div class="card">
<h2>Konekte</h2>

<input id="lemail" type="email" placeholder="Email">
<input id="lpassword" type="password" placeholder="Modpas">

<button onclick="login()">Konekte</button>
</div>

<div id="result"></div>

<script>
const API =
"https://helpy-production-c2f2.up.railway.app";

async function register(){

async function register(){
  const data={
    name:document.getElementById("name").value,
    email:document.getElementById("email").value,
    password:document.getElementById("password").value,
    phone:document.getElementById("phone").value,
    whatsapp:document.getElementById("whatsapp").value
  };

  try{
    const r=await fetch(API+"/api/register",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(data)
    });

    const d=await r.json();

    if(d.user){
      localStorage.setItem("user",JSON.stringify(d.user));
      show("Kont kreye avèk siksè ✅ ID: "+d.user.id);
    }else{
      show(d.error || "Erè");
    }
  }catch(e){
    show("Server pa disponib");
  }
}


async function login(){
  const data={
    email:document.getElementById("lemail").value,
    password:document.getElementById("lpassword").value
  };

  try{
    const r=await fetch(API+"/api/login",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(data)
    });

    const d=await r.json();

    if(d.user){
      localStorage.setItem("user",JSON.stringify(d.user));
      show("Konekte avèk siksè ✅ ID: "+d.user.id);
    }else{
      show(d.error || "Erè koneksyon");
    }
  }catch(e){
    show("Server pa disponib");
  }
}


function show(msg){
  document.getElementById("result").innerHTML=msg;
}

</script>

<div class="card">
<h2>Ajoute antrepriz</h2>

<input id="bname" placeholder="Non antrepriz la">
<input id="bdesc" placeholder="Deskripsyon">
<input id="bcat" placeholder="Kategori">
<input id="bloc" placeholder="Kote">
<input id="bphone" placeholder="Telefòn">
<input id="bwa" placeholder="WhatsApp">
<input id="bphoto" placeholder="URL foto/logo">

<button onclick="addBusiness()">
Ajoute antrepriz
</button>

<div id="businessResult"></div>
</div>

<script>
async function addBusiness(){

  const user=JSON.parse(localStorage.getItem("user"));

  if(!user){
    document.getElementById("businessResult").innerHTML=
      "⚠️ Konekte anvan.";
    return;
  }

  const data={
    name:document.getElementById("bname").value,
    description:document.getElementById("bdesc").value,
    category:document.getElementById("bcat").value,
    location:document.getElementById("bloc").value,
    phone:document.getElementById("bphone").value,
    whatsapp:document.getElementById("bwa").value,
    photo_url:document.getElementById("bphoto").value
  };

  try{
    const r=await fetch(API+"/api/businesses",{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "x-user-id":user.id
      },
      body:JSON.stringify(data)
    });

    const d=await r.json();

    if(d.business){
      document.getElementById("businessResult").innerHTML=
        "✅ Antrepriz ajoute! ID: "+d.business.id;
    }else{
      document.getElementById("businessResult").innerHTML=
        "❌ "+(d.error || "Erè");
    }

  }catch(e){
    document.getElementById("businessResult").innerHTML=
      "❌ Server pa disponib";
  }
}
</script>

</main>
</body>
</html>
