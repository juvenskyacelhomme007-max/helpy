<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HELPY - Publier</title>
  <style>
    body { font-family: sans-serif; background: #f8fafc; padding: 20px; max-width: 500px; margin: auto; }
    .card { background: white; padding: 20px; border-radius: 12px; border: 1px solid #e2e8f0; }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-weight: bold; margin-bottom: 4px; font-size: 0.9rem; }
    input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Publier sur HELPY</h2>
    <form id="publishForm">
      <div class="form-group">
        <label>Type de publication</label>
        <select id="type">
          <option value="product">Produit</option>
          <option value="service">Service</option>
          <option value="business">Entreprise</option>
        </select>
      </div>
      <div class="form-group">
        <label>Titre</label>
        <input type="text" id="title" required placeholder="Ex: Vente Téléphone, Service Plomberie...">
      </div>
      <div class="form-group">
        <label>Catégorie</label>
        <input type="text" id="category" placeholder="Ex: Électronique, Maison...">
      </div>
      <div class="form-group">
        <label>Prix ($ USD / HTG)</label>
        <input type="number" id="price" placeholder="0">
      </div>
      <div class="form-group">
        <label>Emplacement</label>
        <input type="text" id="location" placeholder="Ex: Port-au-Prince, Delmas...">
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea id="description" rows="4"></textarea>
      </div>
      <button type="submit">Publier maintenant</button>
    </form>
  </div>

  <script>
    document.getElementById('publishForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        type: document.getElementById('type').value,
        title: document.getElementById('title').value,
        category: document.getElementById('category').value,
        price: document.getElementById('price').value,
        location: document.getElementById('location').value,
        description: document.getElementById('description').value
      };

      const res = await fetch('/api/items', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (res.ok) {
        alert('Publication réussie !');
        window.location.href = 'index.html';
      } else {
        alert('Erreur lors de la publication.');
      }
    });
  </script>
</body>
</html>
