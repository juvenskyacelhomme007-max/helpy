<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/icon.svg"><link rel="stylesheet" href="/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/config.js"></script><script src="/supabase.js"></script><title>Publier — HELPY</title></head><body><header class="topbar"><div class="inner"><a class="brand" href="/"><span class="logo">H</span><span class="brand-name">HELPY</span></a><a href="/" class="outline-btn">Annuler</a></div></header><main class="container page"><div class="panel"><h1>Publier sur HELPY</h1><p class="muted">Choisis ce que tu veux partager.</p><div class="quick"><button class="quick-card" onclick="setType('product')"><span class="quick-icon q-blue">🛒</span><span><b>Vendre un produit</b><small>Article neuf ou d'occasion</small></span></button><button class="quick-card" onclick="setType('service')"><span class="quick-icon q-green">🛠️</span><span><b>Offrir un service</b><small>Compétence ou prestation</small></span></button><button class="quick-card" onclick="document.getElementById('bizForm').scrollIntoView()"><span class="quick-icon q-orange">🏢</span><span><b>Créer une entreprise</b><small>Présenter ton business</small></span></button></div><div id="msg"></div><form id="listingForm" class="form" style="margin-top:25px"><h2 id="formTitle">Nouvelle annonce produit</h2><input type="hidden" id="type" value="product"><div class="field"><label>Titre</label><input id="title" required></div><div class="field"><label>Description</label><textarea id="description"></textarea></div><div class="two"><div class="field"><label>Prix</label><input id="price" type="number" min="0" step="0.01" value="0"></div><div class="field"><label>Devise</label><select id="currency"><option>USD</option><option>EUR</option><option>CAD</option><option>GBP</option><option>HTG</option><option>MXN</option><option>BRL</option><option>INR</option><option>NGN</option></select></div></div><div class="two"><div class="field"><label>Catégorie</label><input id="category"></div><div class="field"><label>Quantité</label><input id="quantity" type="number" min="1" value="1"></div></div><div class="two"><div class="field"><label>Ville / zone</label><input id="location"></div><div class="field"><label>Pays</label><input id="country"></div></div><div class="field"><label>Contact / WhatsApp</label><input id="contact"></div><div class="field"><label>URL de l'image (optionnel)</label><input id="image_url" placeholder="https://…"></div><button class="primary">Publier l'annonce</button></form><hr style="border:0;border-top:1px solid var(--line);margin:35px 0"><h2 id="bizForm">Créer une entreprise</h2><form id="businessForm" class="form"><div class="field"><label>Nom</label><input id="bname" required></div><div class="field"><label>Catégorie</label><input id="bcategory"></div><div class="field"><label>Description</label><textarea id="bdesc"></textarea></div><div class="two"><div class="field"><label>Téléphone</label><input id="bphone"></div><div class="field"><label>WhatsApp</label><input id="bwa"></div></div><div class="two"><div class="field"><label>Pays</label><input id="bcountry"></div><div class="field"><label>Ville / zone</label><input id="blocation"></div></div><div class="field"><label>Adresse</label><input id="baddress"></div><div class="field"><label>URL de l'image</label><input id="bimage"></div><button class="primary">Créer l'entreprise</button></form></div></main><nav class="bottom-nav"><a href="/"><div>⌂</div><span>Accueil</span></a><a href="/search.html"><div>⌕</div><span>Recherche</span></a><a class="publish-fab" href="/publish.html"><div>＋</div><span>Publier</span></a><a href="/messages.html"><div>💬</div><span>Messages</span></a><a href="/profile.html"><div>♙</div><span>Profil</span></a></nav><script>
function setType(t){type.value=t;formTitle.textContent=t==="service"?"Nouvelle offre de service":"Nouvelle annonce produit"}
listingForm.onsubmit=async e=>{e.preventDefault();const u=await HELPY.requireAuth();if(!u)return;const db=await HELPY.init();const {error}=await db.from("listings").insert({user_id:u.id,type:type.value,title:title.value.trim(),description:description.value.trim(),price:Number(price.value)||0,currency:currency.value,category:category.value.trim(),location:location.value.trim(),country:country.value.trim(),contact:contact.value.trim(),image_url:image_url.value.trim(),quantity:Number(quantity.value)||1,status:"active"});msg.className=error?"notice error":"notice ok";msg.textContent=error?error.message:"Annonce publiée !";if(!error)setTimeout(()=>location.href="/",800)}
businessForm.onsubmit=async e=>{e.preventDefault();const u=await HELPY.requireAuth();if(!u)return;const db=await HELPY.init();const {error}=await db.from("businesses").insert({user_id:u.id,name:bname.value.trim(),category:bcategory.value.trim(),description:bdesc.value.trim(),phone:bphone.value.trim(),whatsapp:bwa.value.trim(),country:bcountry.value.trim(),location:blocation.value.trim(),address:baddress.value.trim(),image_url:bimage.value.trim()});msg.className=error?"notice error":"notice ok";msg.textContent=error?error.message:"Entreprise créée !";if(!error)setTimeout(()=>location.href="/businesses.html",800)}
</script></body></html>
