<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modifier mon profil - HELPY</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6fa;
      color: #222;
    }

    header {
      background: #ffffff;
      border-bottom: 1px solid #e5e5e5;
      padding: 16px 18px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-content {
      max-width: 700px;
      margin: auto;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .back {
      text-decoration: none;
      color: #555;
      font-size: 15px;
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
      color: #5846e8;
    }

    main {
      max-width: 700px;
      margin: 25px auto;
      padding: 0 16px 40px;
    }

    .card {
      background: #fff;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.06);
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 25px;
    }

    .subtitle {
      color: #777;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    .message {
      padding: 14px;
      border-radius: 10px;
      margin-bottom: 20px;
      display: none;
      font-size: 14px;
    }

    .error {
      background: #ffe9e9;
      color: #b00020;
    }

    .success {
      background: #e8f8ed;
      color: #147a35;
    }

    .profile-photo-area {
      text-align: center;
      margin-bottom: 28px;
    }

    .avatar {
      width: 125px;
      height: 125px;
      border-radius: 50%;
      margin: 0 auto 14px;
      background: #5846e8;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      font-weight: bold;
      overflow: hidden;
      border: 4px solid #eee;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .photo-button {
      display: inline-block;
      background: #5846e8;
      color: white;
      padding: 11px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
    }

    #photoInput {
      display: none;
    }

    .photo-info {
      color: #888;
      font-size: 12px;
      margin-top: 8px;
    }

    label {
      display: block;
      margin: 17px 0 7px;
      font-weight: 600;
      font-size: 14px;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      font-family: inherit;
    }

    input:focus,
    textarea:focus {
      border-color: #5846e8;
    }

    input[readonly] {
      background: #f3f3f3;
      color: #777;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    .save-button {
      width: 100%;
      border: none;
      background: #5846e8;
      color: white;
      padding: 15px;
      border-radius: 11px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 25px;
    }

    .save-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .logout {
      width: 100%;
      background: #fff;
      border: 1px solid #ddd;
      color: #d33;
      padding: 13px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
    }

    footer {
      text-align: center;
      color: #999;
      font-size: 12px;
      padding: 20px;
    }

    @media (max-width: 600px) {
      main {
        margin-top: 15px;
      }

      .card {
        padding: 19px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-content">
    <a href="/profile.html" class="back">← Mon profil</a>
    <div class="logo">HELPY</div>
  </div>
</header>

<main>

  <div class="card">

    <h1>Modifier mon profil</h1>

    <div class="subtitle">
      Mets à jour tes informations personnelles et ta photo de profil.
    </div>

    <div id="errorMessage" class="message error"></div>
    <div id="successMessage" class="message success"></div>

    <!-- PHOTO -->
    <div class="profile-photo-area">

      <div class="avatar" id="avatar">
        <span id="avatarLetter">?</span>
      </div>

      <label for="photoInput" class="photo-button">
        📷 Ajouter une photo
      </label>

      <input
        type="file"
        id="photoInput"
        accept="image/jpeg,image/png,image/webp"
      >

      <div class="photo-info">
        JPG, PNG ou WEBP • Taille recommandée : image carrée
      </div>

    </div>

    <!-- FORMULAIRE -->

    <form id="profileForm">

      <label for="fullName">
        Nom complet
      </label>

      <input
        type="text"
        id="fullName"
        placeholder="Ton nom complet"
        required
      >

      <label for="email">
        E-mail
      </label>

      <input
        type="email"
        id="email"
        readonly
      >

      <label for="phone">
        Téléphone
      </label>

      <input
        type="tel"
        id="phone"
        placeholder="+509..."
      >

      <label for="country">
        Pays
      </label>

      <input
        type="text"
        id="country"
        placeholder="Exemple : Haïti"
      >

      <label for="city">
        Ville
      </label>

      <input
        type="text"
        id="city"
        placeholder="Exemple : Port-au-Prince"
      >

      <label for="description">
        À propos de moi
      </label>

      <textarea
        id="description"
        placeholder="Présente-toi brièvement..."
      ></textarea>

      <button
        type="submit"
        class="save-button"
        id="saveButton"
      >
        Enregistrer les modifications
      </button>

    </form>

  </div>

  <div class="card">
    <button class="logout" id="logoutButton">
      Déconnexion
    </button>
  </div>

</main>

<footer>
  © 2026 HELPY
</footer>

<script>

  /* =====================================================
     HELPY - MODIFICATION DU PROFIL
     ===================================================== */

  const API_BASE_URL = window.location.origin;

  let currentUser = null;
  let selectedPhoto = null;


  /* =====================================================
     ELEMENTS
     ===================================================== */

  const errorMessage = document.getElementById("errorMessage");
  const successMessage = document.getElementById("successMessage");

  const avatar = document.getElementById("avatar");
  const avatarLetter = document.getElementById("avatarLetter");

  const photoInput = document.getElementById("photoInput");

  const fullNameInput = document.getElementById("fullName");
  const emailInput = document.getElementById("email");
  const phoneInput = document.getElementById("phone");
  const countryInput = document.getElementById("country");
  const cityInput = document.getElementById("city");
  const descriptionInput = document.getElementById("description");

  const profileForm = document.getElementById("profileForm");
  const saveButton = document.getElementById("saveButton");


  /* =====================================================
     MESSAGE
     ===================================================== */

  function showError(message) {

    errorMessage.textContent = message;
    errorMessage.style.display = "block";

    successMessage.style.display = "none";
  }


  function showSuccess(message) {

    successMessage.textContent = message;
    successMessage.style.display = "block";

    errorMessage.style.display = "none";
  }


  /* =====================================================
     RECUPERER UTILISATEUR
     ===================================================== */

  function getCurrentUser() {

    const possibleKeys = [
      "helpy_user",
      "user",
      "currentUser",
      "helpyUser"
    ];

    for (const key of possibleKeys) {

      const saved = localStorage.getItem(key);

      if (!saved) continue;

      try {

        const user = JSON.parse(saved);

        if (user && typeof user === "object") {

          return user;

        }

      } catch (error) {

        console.log("Erreur lecture utilisateur:", key);

      }

    }

    return null;
  }


  /* =====================================================
     INITIALISATION
     ===================================================== */

  function initializeProfile() {

    currentUser = getCurrentUser();

    if (!currentUser) {

      showError(
        "Aucun utilisateur connecté. Connecte-toi d'abord."
      );

      profileForm.style.display = "none";

      return;

    }

    console.log("Utilisateur HELPY chargé :", currentUser);

    const name =
      currentUser.name ||
      currentUser.full_name ||
      currentUser.fullName ||
      currentUser.nom ||
      "Utilisateur";

    const email =
      currentUser.email ||
      "";

    const phone =
      currentUser.phone ||
      currentUser.telephone ||
      currentUser.whatsapp ||
      currentUser.whatsapp_number ||
      "";

    const country =
      currentUser.country ||
      currentUser.pays ||
      "";

    const city =
      currentUser.city ||
      currentUser.ville ||
      "";

    const description =
      currentUser.description ||
      currentUser.bio ||
      "";

    const photo =
      currentUser.profile_photo ||
      currentUser.profilePhoto ||
      currentUser.avatar ||
      currentUser.photo ||
      currentUser.photo_url ||
      "";


    fullNameInput.value = name;
    emailInput.value = email;
    phoneInput.value = phone;
    countryInput.value = country;
    cityInput.value = city;
    descriptionInput.value = description;


    updateAvatar(name, photo);

  }


  /* =====================================================
     AVATAR
     ===================================================== */

  function updateAvatar(name, photo) {

    if (photo) {

      avatar.innerHTML =
        `<img src="${photo}" alt="Photo de profil">`;

      return;

    }

    const firstLetter =
      (name || "U").trim().charAt(0).toUpperCase();

    avatar.innerHTML =
      `<span id="avatarLetter">${firstLetter}</span>`;
  }


  /* =====================================================
     CHOIX PHOTO
     ===================================================== */

  photoInput.addEventListener("change", function () {

    const file = this.files[0];

    if (!file) return;


    if (!file.type.startsWith("image/")) {

      showError("Veuillez sélectionner une image.");

      this.value = "";

      return;
    }


    if (file.size > 5 * 1024 * 1024) {

      showError(
        "La photo est trop grande. Maximum : 5 MB."
      );

      this.value = "";

      return;
    }


    const reader = new FileReader();


    reader.onload = function (event) {

      selectedPhoto = event.target.result;

      avatar.innerHTML =
        `<img src="${selectedPhoto}" alt="Nouvelle photo de profil">`;

      showSuccess("Photo sélectionnée.");

    };


    reader.readAsDataURL(file);

  });


  /* =====================================================
     ENREGISTRER
     ===================================================== */

  profileForm.addEventListener("submit", async function (event) {

    event.preventDefault();


    if (!currentUser) {

      showError(
        "Aucun utilisateur connecté. Connecte-toi d'abord."
      );

      return;
    }


    const fullName =
      fullNameInput.value.trim();

    const phone =
      phoneInput.value.trim();

    const country =
      countryInput.value.trim();

    const city =
      cityInput.value.trim();

    const description =
      descriptionInput.value.trim();


    if (!fullName) {

      showError(
        "Veuillez entrer votre nom complet."
      );

      return;
    }


    saveButton.disabled = true;

    saveButton.textContent =
      "Enregistrement...";


    /*
      On met d'abord à jour localement.
      Cela garantit que le profil reste visible
      même si l'ancien backend ne possède pas encore
      l'endpoint de modification.
    */

    currentUser.name = fullName;
    currentUser.full_name = fullName;
    currentUser.fullName = fullName;

    currentUser.phone = phone;
    currentUser.telephone = phone;

    currentUser.country = country;
    currentUser.pays = country;

    currentUser.city = city;
    currentUser.ville = city;

    currentUser.description = description;
    currentUser.bio = description;


    if (selectedPhoto) {

      currentUser.profile_photo = selectedPhoto;
      currentUser.profilePhoto = selectedPhoto;
      currentUser.avatar = selectedPhoto;

    }


    /* Sauvegarde locale */

    localStorage.setItem(
      "helpy_user",
      JSON.stringify(currentUser)
    );


    /*
      On conserve également l'ancien identifiant.
    */

    if (currentUser.id) {

      localStorage.setItem(
        "helpy_user_id",
        String(currentUser.id)
      );

    }


    /*
      Tentative de synchronisation avec le serveur.
    */

    let serverUpdated = false;


    if (currentUser.id) {

      const userId =
        encodeURIComponent(currentUser.id);


      const payload = {

        name: fullName,
        full_name: fullName,
        phone: phone,
        country: country,
        city: city,
        description: description

      };


      if (selectedPhoto) {

        payload.profile_photo = selectedPhoto;

      }


      const endpoints = [

        `/api/users/${userId}`,

        `/api/profile/${userId}`,

        `/api/users/profile/${userId}`

      ];


      for (const endpoint of endpoints) {

        try {

          const response =
            await fetch(
              API_BASE_URL + endpoint,
              {
                method: "PUT",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body: JSON.stringify(payload)
              }
            );


          if (response.ok) {

            serverUpdated = true;

            try {

              const data =
                await response.json();

              if (data.user) {

                currentUser = {
                  ...currentUser,
                  ...data.user
                };

                localStorage.setItem(
                  "helpy_user",
                  JSON.stringify(currentUser)
                );

              }

            } catch (e) {}

            break;

          }

        } catch (error) {

          console.log(
            "Endpoint non disponible:",
            endpoint
          );

        }

      }

    }


    saveButton.disabled = false;

    saveButton.textContent =
      "Enregistrer les modifications";


    if (serverUpdated) {

      showSuccess(
        "Profil mis à jour avec succès."
      );

    } else {

      showSuccess(
        "Profil enregistré avec succès sur cet appareil."
      );

    }


    setTimeout(function () {

      window.location.href =
        "/profile.html";

    }, 1200);

  });


  /* =====================================================
     DECONNEXION
     ===================================================== */

  document
    .getElementById("logoutButton")
    .addEventListener("click", function () {

      localStorage.removeItem("helpy_user");
      localStorage.removeItem("helpy_user_id");

      localStorage.removeItem("user");
      localStorage.removeItem("currentUser");
      localStorage.removeItem("helpyUser");

      window.location.href =
        "/login.html";

    });


  /* =====================================================
     START
     ===================================================== */

  initializeProfile();

</script>

</body>
</html>
