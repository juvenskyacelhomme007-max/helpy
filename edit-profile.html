<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Modifier mon profil - HELPY</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f6fa;
      color: #202124;
      min-height: 100vh;
    }

    header {
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      color: #5846e8;
      font-size: 25px;
      font-weight: 800;
      text-decoration: none;
    }

    .back {
      color: #444;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }

    .container {
      width: 100%;
      max-width: 650px;
      margin: 25px auto;
      padding: 0 16px 40px;
    }

    .card {
      background: #ffffff;
      border-radius: 20px;
      padding: 25px 20px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.06);
    }

    h1 {
      font-size: 24px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #777;
      font-size: 14px;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    /* PHOTO */

    .photo-section {
      text-align: center;
      margin-bottom: 28px;
    }

    .photo-wrapper {
      position: relative;
      width: 120px;
      height: 120px;
      margin: 0 auto 14px;
    }

    #profilePreview {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      background: #5846e8;
      border: 4px solid #ffffff;
      box-shadow: 0 5px 20px rgba(0,0,0,0.15);
    }

    .photo-button {
      display: inline-block;
      background: #5846e8;
      color: #ffffff;
      padding: 11px 18px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .photo-button:hover {
      opacity: 0.9;
    }

    #photoInput {
      display: none;
    }

    .photo-help {
      color: #888;
      font-size: 12px;
      margin-top: 9px;
    }

    /* FORM */

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 7px;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid #dcdfe5;
      border-radius: 12px;
      padding: 13px 14px;
      font-size: 15px;
      outline: none;
      background: #ffffff;
      color: #202124;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #5846e8;
      box-shadow: 0 0 0 3px rgba(88,70,232,0.10);
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    input[readonly] {
      background: #f3f4f6;
      color: #777;
    }

    .buttons {
      display: grid;
      gap: 11px;
      margin-top: 25px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .save {
      background: #5846e8;
      color: white;
    }

    .cancel {
      background: #f0efff;
      color: #5846e8;
    }

    .message {
      display: none;
      padding: 13px;
      border-radius: 12px;
      margin-bottom: 18px;
      font-size: 14px;
      line-height: 1.4;
    }

    .success {
      display: block;
      background: #eaf8ef;
      color: #187a3d;
    }

    .error {
      display: block;
      background: #fff0f0;
      color: #c62828;
    }

    .loading {
      opacity: 0.65;
      pointer-events: none;
    }

    footer {
      text-align: center;
      color: #888;
      font-size: 12px;
      padding: 20px;
    }
  </style>
</head>

<body>

<header>
  <a href="index.html" class="logo">HELPY</a>

  <a href="profile.html" class="back">
    ← Mon profil
  </a>
</header>

<main class="container">

  <div class="card">

    <h1>Modifier mon profil</h1>

    <p class="subtitle">
      Mets à jour tes informations personnelles et ta photo de profil.
    </p>

    <div id="message" class="message"></div>

    <!-- PHOTO -->

    <div class="photo-section">

      <div class="photo-wrapper">

        <img
          id="profilePreview"
          src=""
          alt="Photo de profil"
        >

      </div>

      <label for="photoInput" class="photo-button">
        📷 Ajouter une photo
      </label>

      <input
        type="file"
        id="photoInput"
        accept="image/*"
      >

      <p class="photo-help">
        JPG, PNG ou WEBP • Taille recommandée : image carrée
      </p>

    </div>

    <!-- FORM -->

    <form id="profileForm">

      <div class="form-group">

        <label for="fullName">
          Nom complet
        </label>

        <input
          type="text"
          id="fullName"
          placeholder="Ton nom complet"
          maxlength="100"
          required
        >

      </div>

      <div class="form-group">

        <label for="email">
          E-mail
        </label>

        <input
          type="email"
          id="email"
          readonly
        >

      </div>

      <div class="form-group">

        <label for="phone">
          Téléphone / WhatsApp
        </label>

        <input
          type="tel"
          id="phone"
          placeholder="+509..."
          maxlength="30"
        >

      </div>

      <div class="form-group">

        <label for="country">
          Pays
        </label>

        <input
          type="text"
          id="country"
          placeholder="Ton pays"
          maxlength="80"
        >

      </div>

      <div class="form-group">

        <label for="city">
          Ville
        </label>

        <input
          type="text"
          id="city"
          placeholder="Ta ville"
          maxlength="100"
        >

      </div>

      <div class="form-group">

        <label for="description">
          À propos de moi
        </label>

        <textarea
          id="description"
          maxlength="500"
          placeholder="Présente-toi en quelques mots..."
        ></textarea>

      </div>

      <div class="buttons">

        <button
          type="submit"
          class="save"
          id="saveButton"
        >
          💾 Enregistrer les modifications
        </button>

        <button
          type="button"
          class="cancel"
          onclick="window.location.href='profile.html'"
        >
          Annuler
        </button>

      </div>

    </form>

  </div>

</main>

<footer>
  © 2026 HELPY
</footer>


<script>

  /*
   * =====================================================
   * HELPY — MODIFICATION DU PROFIL
   * =====================================================
   */

  const API_BASE_URL =
    window.location.hostname.includes("railway.app")
      ? window.location.origin
      : "https://helpy-production-c2f2.up.railway.app";


  let currentUser = null;
  let selectedPhoto = null;


  /*
   * -----------------------------------------------------
   * UTILISATEUR LOCAL
   * -----------------------------------------------------
   */

  function getStoredUser() {

    const keys = [
      "user",
      "currentUser",
      "helpyUser",
      "loggedUser",
      "userData"
    ];

    for (const key of keys) {

      try {

        const value = localStorage.getItem(key);

        if (!value) {
          continue;
        }

        const data = JSON.parse(value);

        if (data && typeof data === "object") {
          return data;
        }

      } catch (error) {

        console.log(
          "Erreur lecture utilisateur:",
          error
        );

      }

    }

    return null;
  }


  /*
   * -----------------------------------------------------
   * SAUVEGARDE UTILISATEUR LOCAL
   * -----------------------------------------------------
   */

  function saveStoredUser(user) {

    const keys = [
      "user",
      "currentUser",
      "helpyUser",
      "loggedUser",
      "userData"
    ];

    let saved = false;

    for (const key of keys) {

      if (localStorage.getItem(key)) {

        localStorage.setItem(
          key,
          JSON.stringify(user)
        );

        saved = true;

        break;
      }

    }

    if (!saved) {

      localStorage.setItem(
        "user",
        JSON.stringify(user)
      );

    }
  }


  /*
   * -----------------------------------------------------
   * INITIALISER LA PHOTO
   * -----------------------------------------------------
   */

  function setDefaultPhoto(name) {

    const initial =
      name && name.trim()
        ? name.trim().charAt(0).toUpperCase()
        : "H";

    const svg = `
      <svg xmlns="http://www.w3.org/2000/svg"
           width="200"
           height="200"
           viewBox="0 0 200 200">

        <rect
          width="200"
          height="200"
          rx="100"
          fill="#5846e8"
        />

        <text
          x="100"
          y="120"
          text-anchor="middle"
          font-size="82"
          font-family="Arial"
          font-weight="bold"
          fill="white"
        >
          ${initial}
        </text>

      </svg>
    `;

    document.getElementById("profilePreview").src =
      "data:image/svg+xml;charset=UTF-8," +
      encodeURIComponent(svg);
  }


  /*
   * -----------------------------------------------------
   * CHARGER LES DONNÉES
   * -----------------------------------------------------
   */

  function loadProfile() {

    currentUser = getStoredUser();

    if (!currentUser) {

      showMessage(
        "Aucun utilisateur connecté. Connecte-toi d'abord.",
        "error"
      );

      document.getElementById("profileForm").style.display =
        "none";

      return;
    }


    const name =
      currentUser.name ||
      currentUser.full_name ||
      currentUser.fullName ||
      currentUser.nom ||
      "";

    const email =
      currentUser.email ||
      currentUser.email_address ||
      "";

    const phone =
      currentUser.phone ||
      currentUser.telephone ||
      currentUser.whatsapp ||
      currentUser.whatsapp_number ||
      "";

    const country =
      currentUser.country ||
      currentUser.pays ||
      "";

    const city =
      currentUser.city ||
      currentUser.ville ||
      "";

    const description =
      currentUser.description ||
      currentUser.bio ||
      "";


    document.getElementById("fullName").value =
      name;

    document.getElementById("email").value =
      email;

    document.getElementById("phone").value =
      phone;

    document.getElementById("country").value =
      country;

    document.getElementById("city").value =
      city;

    document.getElementById("description").value =
      description;


    const photo =
      currentUser.profile_photo ||
      currentUser.profilePhoto ||
      currentUser.avatar ||
      currentUser.photo ||
      currentUser.photo_url ||
      "";


    if (photo) {

      document.getElementById("profilePreview").src =
        photo;

    } else {

      setDefaultPhoto(name);

    }

  }


  /*
   * -----------------------------------------------------
   * CHOISIR UNE PHOTO
   * -----------------------------------------------------
   */

  document
    .getElementById("photoInput")
    .addEventListener("change", function(event) {

      const file =
        event.target.files[0];

      if (!file) {
        return;
      }


      if (!file.type.startsWith("image/")) {

        showMessage(
          "Veuillez sélectionner une image.",
          "error"
        );

        return;
      }


      const maxSize =
        5 * 1024 * 1024;


      if (file.size > maxSize) {

        showMessage(
          "La photo ne doit pas dépasser 5 Mo.",
          "error"
        );

        event.target.value = "";

        return;
      }


      const reader =
        new FileReader();


      reader.onload = function(e) {

        selectedPhoto =
          e.target.result;

        document.getElementById(
          "profilePreview"
        ).src = selectedPhoto;

      };


      reader.readAsDataURL(file);

    });


  /*
   * -----------------------------------------------------
   * MESSAGE
   * -----------------------------------------------------
   */

  function showMessage(text, type) {

    const message =
      document.getElementById("message");

    message.textContent = text;

    message.className =
      "message " + type;

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }


  /*
   * -----------------------------------------------------
   * ENREGISTRER
   * -----------------------------------------------------
   */

  document
    .getElementById("profileForm")
    .addEventListener("submit", async function(event) {

      event.preventDefault();


      if (!currentUser) {

        showMessage(
          "Utilisateur non connecté.",
          "error"
        );

        return;
      }


      const name =
        document.getElementById("fullName").value.trim();

      const phone =
        document.getElementById("phone").value.trim();

      const country =
        document.getElementById("country").value.trim();

      const city =
        document.getElementById("city").value.trim();

      const description =
        document.getElementById("description").value.trim();


      if (!name) {

        showMessage(
          "Le nom complet est obligatoire.",
          "error"
        );

        return;
      }


      const saveButton =
        document.getElementById("saveButton");


      saveButton.textContent =
        "Enregistrement...";

      document
        .getElementById("profileForm")
        .classList.add("loading");


      /*
       * Mise à jour locale immédiate.
       */

      currentUser.name =
        name;

      currentUser.full_name =
        name;

      currentUser.phone =
        phone;

      currentUser.telephone =
        phone;

      currentUser.whatsapp =
        phone;

      currentUser.country =
        country;

      currentUser.pays =
        country;

      currentUser.city =
        city;

      currentUser.ville =
        city;

      currentUser.description =
        description;


      if (selectedPhoto) {

        currentUser.profile_photo =
          selectedPhoto;

        currentUser.profilePhoto =
          selectedPhoto;

        currentUser.avatar =
          selectedPhoto;

      }


      /*
       * Sauvegarde locale.
       */

      saveStoredUser(currentUser);


      /*
       * Tentative de sauvegarde backend.
       *
       * On essaie plusieurs routes possibles.
       * Si elles n'existent pas encore, les données
       * locales restent sauvegardées.
       */

      let backendSaved = false;


      const userId =
        currentUser.id ||
        currentUser.user_id ||
        currentUser.userId;


      if (userId) {

        const payload = {

          id: userId,

          name: name,

          full_name: name,

          phone: phone,

          whatsapp: phone,

          country: country,

          city: city,

          description: description,

          profile_photo:
            currentUser.profile_photo || null

        };


        const endpoints = [

          "/api/users/" + userId,

          "/api/profile/" + userId,

          "/api/users/profile/" + userId

        ];


        for (const endpoint of endpoints) {

          try {

            const response =
              await fetch(
                API_BASE_URL + endpoint,
                {
                  method: "PUT",

                  headers: {
                    "Content-Type":
                      "application/json"
                  },

                  body:
                    JSON.stringify(payload)
                }
              );


            if (response.ok) {

              backendSaved = true;

              break;

            }

          } catch (error) {

            console.log(
              "Backend:",
              endpoint,
              error
            );

          }

        }

      }


      /*
       * FIN
       */

      document
        .getElementById("profileForm")
        .classList.remove("loading");


      saveButton.textContent =
        "💾 Enregistrer les modifications";


      if (backendSaved) {

        showMessage(
          "Votre profil a été enregistré avec succès.",
          "success"
        );

      } else {

        showMessage(
          "Les informations ont été enregistrées sur cet appareil. La synchronisation serveur sera activée avec l’API profil HELPY.",
          "success"
        );

      }


      setTimeout(function() {

        window.location.href =
          "profile.html";

      }, 1500);

    });


  /*
   * -----------------------------------------------------
   * DÉMARRAGE
   * -----------------------------------------------------
   */

  document.addEventListener(
    "DOMContentLoaded",
    function() {

      loadProfile();

    }
  );

</script>

</body>
</html>
