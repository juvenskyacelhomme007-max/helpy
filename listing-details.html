<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Détails — HELPY</title><link rel="stylesheet" href="style.css"><script src="app.js"></script></head><body><main class="container"><div id="box" class="card">Chargement...</div></main><script>(async()=>{const p=new URLSearchParams(location.search),id=p.get('id'),type=p.get('type')==='service'?'services':'products',r=await apiFetch('/api/'+type+'/'+id);const x=r.item;if(!x){box.textContent=r.message||'Introuvable';return}box.innerHTML=`<h1>${x.title||x.name}</h1><p>${x.description||''}</p><p class="price">${x.price} ${x.currency||'USD'}</p><p>${x.country||''} ${x.city||x.location||''}</p><a class="btn" href="https://wa.me/${String(x.whatsapp||'').replace(/[^0-9]/g,'')}">WhatsApp</a>`})()</script></body></html>
