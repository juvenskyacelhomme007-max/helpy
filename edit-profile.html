<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Modifier profil — HELPY</title><link rel="stylesheet" href="style.css"><script src="app.js"></script></head><body><main class="container"><form class="form" onsubmit="go(event)"><h1>Modifier mon profil</h1><div class="field"><label>Nom</label><input id="name"></div><div class="field"><label>Téléphone</label><input id="phone"></div><div class="field"><label>WhatsApp</label><input id="whatsapp"></div><div class="field"><label>Pays</label><input id="country"></div><div class="field"><label>Ville / zone</label><input id="city"></div><div class="field"><label>Description</label><textarea id="description"></textarea></div><button class="btn">Enregistrer</button><p id="msg"></p></form></main><script>const u=currentUser()||{};for(const k of ['name','phone','whatsapp','country','city','description'])document.getElementById(k).value=u[k]||'';async function go(e){e.preventDefault();const r=await apiFetch('/api/users/'+localStorage.getItem('helpy_user_id'),'PUT',{name:name.value,phone:phone.value,whatsapp:whatsapp.value,country:country.value,city:city.value,description:description.value});msg.textContent=r.error?r.message:'Profil enregistré.';if(!r.error)saveUser(r.utilisateur)}</script></body></html>
