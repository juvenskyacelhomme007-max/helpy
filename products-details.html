<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Détails du produit - HELPY</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fa;
      color: #17202a;
    }

    header {
      background: white;
      padding: 18px 20px;
      border-bottom: 1px solid #eee;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      font-size: 25px;
      font-weight: 900;
      color: #111827;
    }

    .back {
      border: none;
      background: #f1f3f5;
      padding: 10px 15px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    main {
      max-width: 900px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .card {
      background: white;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 5px 25px rgba(0,0,0,.07);
    }

    .product-image {
      width: 100%;
      height: 350px;
      background: #eef1f5;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .placeholder {
      font-size: 70px;
      opacity: .5;
    }

    .content {
      padding: 25px;
    }

    .category {
      display: inline-block;
      background: #eef2ff;
      color: #3742fa;
      padding: 7px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 30px;
      margin-bottom: 12px;
    }

    .price {
      font-size: 28px;
      font-weight: 900;
      margin-bottom: 20px;
    }

    .info {
      display: grid;
      gap: 12px;
      margin: 20px 0;
    }

    .info div {
      padding: 13px;
      background: #f7f8fa;
      border-radius: 10px;
    }

    .label {
      font-size: 12px;
      color: #777;
      margin-bottom: 4px;
    }

    .value {
      font-weight: bold;
    }

    .description {
      margin-top: 25px;
    }

    .description h2 {
      font-size: 20px;
      margin-bottom: 10px;
    }

    .description p {
      color: #555;
      line-height: 1.7;
      white-space: pre-wrap;
    }

    .seller {
      margin-top: 25px;
      padding: 18px;
      background: #f7f8fa;
      border-radius: 12px;
    }

    .whatsapp {
      display: block;
      text-align: center;
      text-decoration: none;
      background: #25D366;
      color: white;
      padding: 15px;
      border-radius: 12px;
      margin-top: 20px;
      font-weight: bold;
      font-size: 16px;
    }

    .error {
      background: white;
      padding: 30px;
      text-align: center;
      border-radius: 15px;
    }

    .loading {
      text-align: center;
      padding: 50px;
      font-size: 18px;
    }

    @media (max-width: 600px) {
      .product-image {
        height: 280px;
      }

      h1 {
        font-size: 24px;
      }

      .price {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">HELPY</div>
  <button class="back" onclick="history.back()">← Retour</button>
</header>

<main>
  <div id="loading" class="loading">
    Chargement du produit...
  </div>

  <div id="error" class="error" style="display:none;">
    <h2>Produit introuvable</h2>
    <p id="errorMessage">Impossible de charger ce produit.</p>
  </div>

  <div id="productCard" class="card" style="display:none;">

    <div class="product-image">
      <img id="productImage" style="display:none;" alt="Produit">
      <div id="placeholder" class="placeholder">🛍️</div>
    </div>

    <div class="content">

      <div id="category" class="category" style="display:none;"></div>

      <h1 id="title"></h1>

      <div id="price" class="price"></div>

      <div class="info">

        <div>
          <div class="label">📍 Localisation</div>
          <div id="location" class="value">Non précisé</div>
        </div>

        <div>
          <div class="label">📦 Quantité disponible</div>
          <div id="quantity" class="value">1</div>
        </div>

      </div>

      <div class="description">
        <h2>Description</h2>
        <p id="description">Aucune description disponible.</p>
      </div>

      <div class="seller">
        <div class="label">👤 Vendeur</div>
        <div id="seller" class="value"></div>
      </div>

      <a id="whatsapp" class="whatsapp" href="#" target="_blank">
        💬 Contacter le vendeur sur WhatsApp
      </a>

    </div>
  </div>
</main>

<script>

const API_URL = "https://helpy-production.up.railway.app";

async function loadProduct() {

  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");

  console.log("PRODUCT ID:", id);

  if (!id) {
    showError("Aucun identifiant de produit trouvé.");
    return;
  }

  try {

    const response = await fetch(
      `${API_URL}/api/products/${encodeURIComponent(id)}`
    );

    console.log("STATUS:", response.status);

    const data = await response.json();

    console.log("PRODUCT DATA:", data);

    if (!response.ok || data.status !== "ok" || !data.product) {
      showError(data.message || "Produit introuvable.");
      return;
    }

    const product = data.product;

    document.getElementById("loading").style.display = "none";
    document.getElementById("productCard").style.display = "block";

    // TITRE
    document.getElementById("title").textContent =
      product.title || "Produit sans nom";

    // PRIX
    document.getElementById("price").textContent =
      `${product.price || 0} ${product.currency || "HTG"}`;

    // CATÉGORIE
    if (product.category) {
      const category = document.getElementById("category");
      category.textContent = product.category;
      category.style.display = "inline-block";
    }

    // LOCALISATION
    document.getElementById("location").textContent =
      product.location || "Non précisé";

    // QUANTITÉ
    document.getElementById("quantity").textContent =
      product.quantity ?? 1;

    // DESCRIPTION
    document.getElementById("description").textContent =
      product.description || "Aucune description disponible.";

    // VENDEUR
    document.getElementById("seller").textContent =
      product.seller_name || "Vendeur";

    // IMAGE
    if (product.image_url) {

      const image = document.getElementById("productImage");

      image.src = product.image_url;
      image.style.display = "block";

      document.getElementById("placeholder").style.display = "none";
    }

    // WHATSAPP
    if (product.whatsapp) {

      let number = String(product.whatsapp)
        .replace(/\D/g, "");

      // Ajoute le code Haïti si nécessaire
      if (number.length === 8) {
        number = "509" + number;
      }

      const whatsapp = document.getElementById("whatsapp");

      whatsapp.href =
        `https://wa.me/${number}?text=${encodeURIComponent(
          "Bonjour, je suis intéressé par votre produit : " +
          (product.title || "")
        )}`;

    } else {

      document.getElementById("whatsapp").style.display = "none";
    }

  } catch (error) {

    console.error("DETAIL ERROR:", error);

    showError(
      "Impossible de communiquer avec le serveur."
    );
  }
}

function showError(message) {

  document.getElementById("loading").style.display = "none";

  document.getElementById("error").style.display = "block";

  document.getElementById("errorMessage").textContent =
    message;
}

loadProduct();

</script>

</body>
</html>
