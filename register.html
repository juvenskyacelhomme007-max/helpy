<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HELPY — Créer un compte</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 28px;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    .logo {
      text-align: center;
      font-size: 32px;
      font-weight: 800;
      color: #5b4bff;
      margin-bottom: 8px;
    }

    h1 {
      text-align: center;
      font-size: 24px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      margin-bottom: 15px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #5b4bff;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="logo">HELPY</div>

    <h1>Créer un compte</h1>

    <p class="subtitle">
      Rejoignez HELPY dès maintenant.
    </p>

    <form id="registerForm">

      <label>Nom</label>
      <input
        id="name"
        type="text"
        placeholder="Votre nom"
        required
      >

      <label>Email</label>
      <input
        id="email"
        type="email"
        placeholder="vous@example.com"
      >

      <label>Téléphone</label>
      <input
        id="phone"
        type="tel"
        placeholder="+509..."
      >

      <label>Mot de passe</label>
      <input
        id="password"
        type="password"
        placeholder="Minimum 6 caractères"
        required
      >

      <button id="registerButton" type="submit">
        S'inscrire
      </button>

    </form>

    <div id="message"></div>

  </div>

<script>

const form = document.getElementById("registerForm");
const button = document.getElementById("registerButton");
const message = document.getElementById("message");

form.addEventListener("submit", async function(event) {

  event.preventDefault();

  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const password = document.getElementById("password").value;

  if (!email && !phone) {
    message.textContent = "Ajoutez un email ou un téléphone.";
    message.style.color = "red";
    return;
  }

  button.disabled = true;
  button.textContent = "Création...";

  try {

    const response = await fetch("/api/auth/register", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        name,
        email: email || null,
        phone: phone || null,
        password
      })
    });

    const data = await response.json();

    if (response.ok) {

      message.textContent = "✅ Compte créé avec succès !";
      message.style.color = "green";

      form.reset();

    } else {

      message.textContent = "❌ " + (data.message || "Erreur");
      message.style.color = "red";

    }

  } catch (error) {

    message.textContent = "❌ Impossible de contacter HELPY.";
    message.style.color = "red";

  }

  button.disabled = false;
  button.textContent = "S'inscrire";

});

</script>

</body>
</html>
