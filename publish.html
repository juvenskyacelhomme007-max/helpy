<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Publier — HELPY</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#172033;
}

header{
  background:linear-gradient(135deg,#0757d9,#18a0fb);
  color:white;
  padding:20px;
  position:sticky;
  top:0;
  z-index:10;
}

.header{
  max-width:700px;
  margin:auto;
  display:flex;
  align-items:center;
  gap:15px;
}

.back{
  font-size:25px;
  cursor:pointer;
}

.logo{
  font-size:25px;
  font-weight:900;
}

main{
  max-width:700px;
  margin:auto;
  padding:20px 15px 100px;
}

.hero{
  margin-bottom:20px;
}

.hero h1{
  font-size:28px;
  margin-bottom:7px;
}

.hero p{
  color:#687386;
}

.card{
  background:white;
  border-radius:20px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 8px 25px rgba(0,0,0,.07);
}

label{
  display:block;
  font-weight:bold;
  margin:15px 0 7px;
}

input,
textarea,
select{
  width:100%;
  padding:14px;
  border:1px solid #dce3ed;
  border-radius:12px;
  font-size:16px;
  outline:none;
  background:white;
}

textarea{
  min-height:110px;
  resize:vertical;
}

input:focus,
textarea:focus,
select:focus{
  border-color:#0878ee;
}

.types{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.type{
  border:2px solid #e1e7ef;
  border-radius:15px;
  padding:15px 10px;
  text-align:center;
  cursor:pointer;
  background:white;
  font-weight:bold;
}

.type.active{
  border-color:#0878ee;
  background:#eaf4ff;
  color:#0878ee;
}

.type div{
  font-size:28px;
  margin-bottom:5px;
}

.hidden{
  display:none;
}

.photo-box{
  border:2px dashed #b9c7d9;
  border-radius:15px;
  padding:22px;
  text-align:center;
  margin-top:10px;
}

button{
  width:100%;
  border:0;
  padding:16px;
  border-radius:14px;
  background:linear-gradient(135deg,#0757d9,#18a0fb);
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
}

.message{
  margin-top:15px;
  padding:14px;
  border-radius:12px;
  display:none;
}

.success{
  display:block;
  background:#e8fff1;
  color:#08753b;
}

.error{
  display:block;
  background:#fff0f0;
  color:#b00020;
}

.price-row{
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:10px;
}

@media(max-width:450px){
  .types{
    grid-template-columns:1fr 1fr;
  }
}
</style>
</head>

<body>

<header>
  <div class="header">

    <div class="back" onclick="history.back()">
      ←
    </div>

    <div class="logo">
      HELPY
    </div>

  </div>
</header>

<main>

<section class="hero">
  <h1>Publier sur HELPY</h1>
  <p>
    Présentez votre activité, votre produit, votre service
    ou votre annonce à la communauté.
  </p>
</section>

<div class="card">

  <label>Que voulez-vous publier ?</label>

  <div class="types">

    <div class="type active" onclick="chooseType('business',this)">
      <div>🏪</div>
      Entreprise
    </div>

    <div class="type" onclick="chooseType('product',this)">
      <div>🛍️</div>
      Produit
    </div>

    <div class="type" onclick="chooseType('service',this)">
      <div>🔧</div>
      Service
    </div>

    <div class="type" onclick="chooseType('realestate',this)">
      <div>🏠</div>
      Immobilier
    </div>

    <div class="type" onclick="chooseType('vehicle',this)">
      <div>🚗</div>
      Véhicule
    </div>

  </div>

</div>

<form id="publishForm">

<div class="card">

  <label id="titleLabel">
    Nom de l'entreprise
  </label>

  <input
    id="title"
    type="text"
    placeholder="Ex: Boutique Juvensky"
    required
  >

  <label>Description</label>

  <textarea
    id="description"
    placeholder="Décrivez ce que vous proposez..."
    required
  ></textarea>

  <label>Catégorie</label>

  <select id="category">
    <option value="">Choisir une catégorie</option>
  </select>

</div>

<div class="card">

  <label>📍 Localisation</label>

  <input
    id="location"
    type="text"
    placeholder="Ex: Delmas, Port-au-Prince"
    required
  >

  <label>📞 Téléphone</label>

  <input
    id="phone"
    type="tel"
    placeholder="Ex: 509 36 00 00 00"
  >

  <label>💬 WhatsApp</label>

  <input
    id="whatsapp"
    type="tel"
    placeholder="Numéro WhatsApp"
  >

</div>

<div class="card hidden" id="priceCard">

  <label>Prix</label>

  <div class="price-row">

    <input
      id="price"
      type="number"
      min="0"
      placeholder="Ex: 25000"
    >

    <select id="currency">
      <option value="HTG">HTG</option>
      <option value="USD">USD</option>
    </select>

  </div>

</div>

<div class="card">

  <label>📸 Photo / Image</label>

  <div class="photo-box">

    <input
      id="photo"
      type="file"
      accept="image/*"
    >

    <p style="margin-top:10px;color:#687386;">
      Ajoutez une photo pour rendre votre annonce plus attractive.
    </p>

  </div>

</div>

<div class="card">

  <button id="submitBtn" type="submit">
    🚀 Publier sur HELPY
  </button>

  <div id="message" class="message"></div>

</div>

</form>

</main>

<script>

const API =
  "https://helpy-production-c2f2.up.railway.app";

let currentType = "business";

const categories = {

  business:[
    "Commerce",
    "Restaurant",
    "Mode",
    "Technologie",
    "Construction",
    "Maison",
    "Autres"
  ],

  product:[
    "Téléphones",
    "Électronique",
    "Vêtements",
    "Matériaux de construction",
    "Meubles",
    "Alimentation",
    "Pièces automobiles",
    "Autres"
  ],

  service:[
    "Plomberie",
    "Électricité",
    "Réparation téléphone",
    "Coiffure / Beauté",
    "Transport",
    "Nettoyage",
    "Photographie",
    "Informatique",
    "Autres"
  ],

  realestate:[
    "Maison à vendre",
    "Maison à louer",
    "Appartement",
    "Terrain",
    "Local commercial",
    "Bureau",
    "Autres"
  ],

  vehicle:[
    "Voiture",
    "Moto",
    "Camion",
    "Pièces et accessoires",
    "Autres"
  ]

};

function chooseType(type,element){

  currentType = type;

  document
    .querySelectorAll(".type")
    .forEach(x =>
      x.classList.remove("active")
    );

  element.classList.add("active");

  const titleLabel =
    document.getElementById("titleLabel");

  const title =
    document.getElementById("title");

  const priceCard =
    document.getElementById("priceCard");

  if(type === "business"){

    titleLabel.textContent =
      "Nom de l'entreprise";

    title.placeholder =
      "Ex: Boutique Juvensky";

    priceCard.classList.add("hidden");

  }

  else if(type === "product"){

    titleLabel.textContent =
      "Nom du produit";

    title.placeholder =
      "Ex: iPhone 13";

    priceCard.classList.remove("hidden");

  }

  else if(type === "service"){

    titleLabel.textContent =
      "Nom du service";

    title.placeholder =
      "Ex: Réparation téléphone";

    priceCard.classList.remove("hidden");

  }

  else if(type === "realestate"){

    titleLabel.textContent =
      "Titre de l'annonce";

    title.placeholder =
      "Ex: Maison 3 chambres à louer";

    priceCard.classList.remove("hidden");

  }

  else if(type === "vehicle"){

    titleLabel.textContent =
      "Nom du véhicule";

    title.placeholder =
      "Ex: Toyota Corolla 2018";

    priceCard.classList.remove("hidden");

  }

  updateCategories();

}

function updateCategories(){

  const select =
    document.getElementById("category");

  select.innerHTML =
    '<option value="">Choisir une catégorie</option>';

  categories[currentType].forEach(category => {

    const option =
      document.createElement("option");

    option.value = category;
    option.textContent = category;

    select.appendChild(option);

  });

}

updateCategories();

document
.getElementById("publishForm")
.addEventListener("submit", async function(e){

  e.preventDefault();

  const user =
    JSON.parse(
      localStorage.getItem("helpyUser") ||
      "null"
    );

  if(!user){

    showMessage(
      "Connectez-vous avant de publier.",
      "error"
    );

    return;
  }

  const btn =
    document.getElementById("submitBtn");

  btn.disabled = true;
  btn.textContent =
    "Publication en cours...";

  const title =
    document.getElementById("title").value.trim();

  const description =
    document.getElementById("description").value.trim();

  const category =
    document.getElementById("category").value;

  const location =
    document.getElementById("location").value.trim();

  const phone =
    document.getElementById("phone").value.trim();

  const whatsapp =
    document.getElementById("whatsapp").value.trim();

  const price =
    document.getElementById("price").value;

  try{

    let url = "";
    let body = {};

    if(currentType === "business"){

      url =
        API + "/api/businesses";

      body = {
        name:title,
        description,
        category,
        location,
        phone,
        whatsapp
      };

    }else{

      url =
        API + "/api/products";

      body = {
        title,
        name:title,
        description,
        category,
        location,
        phone,
        whatsapp,
        price:
          price || null,
        currency:
          document.getElementById("currency").value
      };

    }

    const response =
      await fetch(url,{
        method:"POST",
        headers:{
          "Content-Type":"application/json",
          "x-user-id":
            String(user.id)
        },
        body:JSON.stringify(body)
      });

    const data =
      await response.json();

    if(!response.ok){

      throw new Error(
        data.message ||
        data.error ||
        "Publication impossible."
      );

    }

    showMessage(
      "✅ Publication réussie !",
      "success"
    );

    document
      .getElementById("publishForm")
      .reset();

  }catch(error){

    showMessage(
      error.message ||
      "Une erreur est survenue.",
      "error"
    );

  }finally{

    btn.disabled = false;

    btn.textContent =
      "🚀 Publier sur HELPY";

  }

});

function showMessage(text,type){

  const box =
    document.getElementById("message");

  box.textContent = text;

  box.className =
    "message " + type;

  box.style.display = "block";

}

</script>

</body>
</html>
