<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/icon.svg"><link rel="stylesheet" href="/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/config.js"></script><script src="/supabase.js"></script><title>Messages — HELPY</title></head><body><header class="topbar"><div class="inner"><a class="brand" href="/"><span class="logo">H</span><span class="brand-name">HELPY</span></a></div></header><main class="container page"><div class="panel"><h1>Messages</h1><p class="muted">Tes conversations HELPY.</p><div id="messages"><div class="empty">Chargement…</div></div></div></main><nav class="bottom-nav"><a href="/"><div>⌂</div><span>Accueil</span></a><a href="/search.html"><div>⌕</div><span>Recherche</span></a><a class="publish-fab" href="/publish.html"><div>＋</div><span>Publier</span></a><a class="active" href="/messages.html"><div>💬</div><span>Messages</span></a><a href="/profile.html"><div>♙</div><span>Profil</span></a></nav><script>
async function load(){const u=await HELPY.user();if(!u){messages.innerHTML='<div class="empty">Connecte-toi pour voir tes messages.<br><a href="/login.html" style="color:var(--blue);font-weight:900">Se connecter</a></div>';return}const db=await HELPY.init();const {data,error}=await db.from("messages").select("*").or(`sender_id.eq.${u.id},receiver_id.eq.${u.id}`).order("created_at",{ascending:true});messages.innerHTML=error?'<div class="empty">Erreur de chargement.</div>':(data||[]).map(m=>`<div style="background:${m.sender_id===u.id?"#1769ff":"#f0f2f5"};color:${m.sender_id===u.id?"#fff":"#111"};padding:11px 13px;border-radius:16px;max-width:78%;margin:${m.sender_id===u.id?"8px 0 8px auto":"8px auto 8px 0"}">${HELPY.esc(m.body)}<div style="font-size:9px;opacity:.65;margin-top:4px">${new Date(m.created_at).toLocaleString()}</div></div>`).join("")||'<div class="empty">Aucun message.</div>'}load();
</script></body></html>
