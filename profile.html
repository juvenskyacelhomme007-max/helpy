<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/icon.svg"><link rel="stylesheet" href="/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/config.js"></script><script src="/supabase.js"></script><title>Profil — HELPY</title></head><body><header class="topbar"><div class="inner"><a class="brand" href="/"><span class="logo">H</span><span class="brand-name">HELPY</span></a><button class="outline-btn" onclick="HELPY.signOut()">Déconnexion</button></div></header><main class="container page"><div class="panel"><div id="profile">Chargement…</div></div></main><nav class="bottom-nav"><a href="/"><div>⌂</div><span>Accueil</span></a><a href="/search.html"><div>⌕</div><span>Recherche</span></a><a class="publish-fab" href="/publish.html"><div>＋</div><span>Publier</span></a><a href="/messages.html"><div>💬</div><span>Messages</span></a><a class="active" href="/profile.html"><div>♙</div><span>Profil</span></a></nav><script>
async function load(){const u=await HELPY.user();if(!u){profile.innerHTML='<div class="empty">Tu n’es pas connecté.<br><a href="/login.html" style="color:var(--blue);font-weight:900">Se connecter</a></div>';return}const db=await HELPY.init();const p=await HELPY.profile(u.id);const {count}=await db.from("listings").select("*",{count:"exact",head:true}).eq("user_id",u.id);profile.innerHTML=`<h1>${HELPY.esc(p?.name||u.email.split("@")[0])}</h1><p class="muted">${HELPY.esc(u.email)}</p><div class="quick" style="grid-template-columns:1fr"><a class="quick-card" href="/publish.html"><span class="quick-icon q-blue">＋</span><span><b>Publier</b><small>Ajouter une annonce ou une entreprise</small></span></a><a class="quick-card" href="/settings.html"><span class="quick-icon q-green">⚙️</span><span><b>Paramètres</b><small>Préférences</small></span></a></div><p class="muted" style="margin-top:18px">${count||0} annonce(s) publiée(s)</p>`}load();
</script></body></html>
