<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/icon.svg"><link rel="stylesheet" href="/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/config.js"></script><script src="/supabase.js"></script><title>Recherche — HELPY</title></head><body><header class="topbar"><div class="inner"><a class="brand" href="/"><span class="logo">H</span><span class="brand-name">HELPY</span></a></div></header><main class="container page"><div class="panel"><h1>Recherche</h1><div class="searchbox" style="border:1px solid var(--line);box-shadow:none"><span>⌕</span><input id="q" placeholder="Produit, service, catégorie, ville…"><button onclick="run()">Rechercher</button></div><div class="chips" style="margin-top:15px"><button class="chip active" data-t="">Tout</button><button class="chip" data-t="product">Produits</button><button class="chip" data-t="service">Services</button></div></div><section class="section"><div class="section-head"><h2 id="title">Résultats</h2></div><div id="results" class="grid"><div class="empty">Recherche…</div></div></section></main><nav class="bottom-nav"><a href="/"><div>⌂</div><span>Accueil</span></a><a class="active" href="/search.html"><div>⌕</div><span>Recherche</span></a><a class="publish-fab" href="/publish.html"><div>＋</div><span>Publier</span></a><a href="/messages.html"><div>💬</div><span>Messages</span></a><a href="/profile.html"><div>♙</div><span>Profil</span></a></nav><script>
const p=new URLSearchParams(location.search);q.value=p.get("q")||"";let type=p.get("type")||"";document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{type=b.dataset.t;document.querySelectorAll("[data-t]").forEach(x=>x.classList.toggle("active",x===b));run()});async function run(){const db=await HELPY.init();if(!db){results.innerHTML='<div class="empty">Configure Supabase pour activer la recherche.</div>';return}let r=db.from("listings").select("*").eq("status","active").order("created_at",{ascending:false}).limit(50);if(type)r=r.eq("type",type);const t=q.value.trim();if(t)r=r.or(`title.ilike.%${t}%,description.ilike.%${t}%,category.ilike.%${t}%,location.ilike.%${t}%,country.ilike.%${t}%`);const {data,error}=await r;title.textContent=`${data?.length||0} résultat(s)`;results.innerHTML=error?'<div class="empty">Erreur.</div>':(data||[]).map(x=>`<article class="card"><a href="/listing.html?id=${x.id}"><div class="photo">${x.image_url?`<img src="${HELPY.esc(x.image_url)}">`:'<div style="display:grid;place-items:center;height:100%;font-size:45px">📦</div>'}<span class="type">${x.type==="service"?"SERVICE":"PRODUIT"}</span></div><div class="card-body"><h3>${HELPY.esc(x.title)}</h3><div class="muted">📍 ${HELPY.esc([x.location,x.country].filter(Boolean).join(", ")||"Worldwide")}</div><div class="price">${HELPY.money(x.price,x.currency)}</div></div></a></article>`).join("")||'<div class="empty">Aucun résultat.</div>'}run();
</script></body></html>
