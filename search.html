<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recherche — HELPY</title><link rel="stylesheet" href="style.css"><script src="app.js"></script></head><body><main class="container"><form onsubmit="go(event)"><div class="field"><input id="q" placeholder="Rechercher un produit, service ou entreprise..."></div><button class="btn">Rechercher</button></form><div id="grid" class="grid"></div></main><script>async function go(e){e.preventDefault();const r=await apiFetch('/api/search?q='+encodeURIComponent(q.value));grid.innerHTML=[...(r.produits||[]).map(x=>`<article class=card><h3>${x.title||x.name}</h3><p>Produit</p></article>`),...(r.services||[]).map(x=>`<article class=card><h3>${x.title||x.name}</h3><p>Service</p></article>`),...(r.entreprises||[]).map(x=>`<article class=card><h3>${x.name}</h3><p>Entreprise</p></article>`)].join('')||'<p>Aucun résultat.</p>'}</script></body></html>
