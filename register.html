<!DOCTYPE html>
<html lang="ht">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HELPY - Enskripsyon</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <div style="text-align: center; margin-bottom: 24px;">
      <div class="logo-icon" style="width: 50px; height: 50px; margin: 0 auto 12px; font-weight: bold; font-size: 20px;">H</div>
      <h2>Kreye yon kont HELPY</h2>
      <p style="color: var(--text-gray); font-size: 14px; margin-top: 4px;">Antre enfòmasyon w yo pou w ka kòmanse</p>
    </div>

    <form id="registerForm" class="card">
      <div class="form-group">
        <label style="display:block; margin-bottom:6px; font-size:14px; color:var(--text-gray);">Non konplè</label>
        <input type="text" id="fullname" class="form-control" style="width: 100%;" placeholder="Eg: Jean Baptiste" required>
      </div>

      <div class="form-group">
        <label style="display:block; margin-bottom:6px; font-size:14px; color:var(--text-gray);">Imèl</label>
        <input type="email" id="email" class="form-control" style="width: 100%;" placeholder="zanmi@email.com" required>
      </div>

      <div class="form-group">
        <label style="display:block; margin-bottom:6px; font-size:14px; color:var(--text-gray);">Mo de pas</label>
        <input type="password" id="password" class="form-control" style="width: 100%;" placeholder="••••••••" required>
      </div>

      <button type="submit" id="submitBtn" class="btn-primary" style="width: 100%; justify-content: center; margin-top: 8px;">
        Kreye Kont Mwen
      </button>
    </form>

    <div id="message" style="margin-top: 12px; text-align: center; font-size: 14px;"></div>

    <div style="text-align: center; margin-top: 20px; font-size: 14px; color: var(--text-gray);">
      Ou gen yon kont deja? <a href="login.html">Konekte w</a>
    </div>
  </div>

  <script>
    const form = document.getElementById('registerForm');
    const messageDiv = document.getElementById('message');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const name = document.getElementById('fullname').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      messageDiv.style.color = '#94a3b8';
      messageDiv.innerText = "N ap trete ensripsyon an...";

      try {
        const response = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password })
        });

        const data = await response.json();

        if (response.ok) {
          messageDiv.style.color = '#4ade80';
          messageDiv.innerText = data.message || "Kont ou kreye ak siksè!";
          form.reset();
        } else {
          messageDiv.style.color = '#ef4444';
          messageDiv.innerText = data.error || "Gen yon pwoblèm ki rive.";
        }
      } catch (err) {
        messageDiv.style.color = '#ef4444';
        messageDiv.innerText = "Erè nan koneksyon ak sèvè a.";
      }
    });
  </script>
</body>
</html>
