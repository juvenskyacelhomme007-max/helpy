<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Modifier mon profil - HELPY</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6fa;
      color: #222;
    }

    header {
      background: #ffffff;
      border-bottom: 1px solid #e5e5e5;
      padding: 16px 18px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-content {
      max-width: 700px;
      margin: auto;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .back {
      text-decoration: none;
      color: #555;
      font-size: 15px;
      font-weight: 600;
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
      color: #5846e8;
    }

    main {
      max-width: 700px;
      margin: 25px auto;
      padding: 0 16px 40px;
    }

    .card {
      background: #fff;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 25px;
    }

    .subtitle {
      color: #777;
      margin-bottom: 25px;
      line-height: 1.5;
      font-size: 14px;
    }

    .message {
      padding: 14px;
      border-radius: 10px;
      margin-bottom: 20px;
      display: none;
      font-size: 14px;
      line-height: 1.4;
    }

    .error {
      background: #ffe9e9;
      color: #b00020;
    }

    .success {
      background: #e8f8ed;
      color: #147a35;
    }

    /* ==============================
       PHOTO
       ============================== */

    .profile-photo-area {
      text-align: center;
      margin-bottom: 28px;
    }

    .avatar {
      width: 125px;
      height: 125px;
      border-radius: 50%;
      margin: 0 auto 14px;
      background: #5846e8;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      font-weight: bold;
      overflow: hidden;
      border: 4px solid #eee;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .photo-actions {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .photo-button {
      display: inline-block;
      background: #5846e8;
      color: white;
      padding: 11px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      border: none;
      font-size: 14px;
    }

    .remove-photo {
      display: none;
      background: #fff;
      color: #d33;
      border: 1px solid #ddd;
      padding: 10px 15px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
    }

    #photoInput {
      display: none;
    }

    .photo-info {
      color: #888;
      font-size: 12px;
      margin-top: 9px;
    }

    /* ==============================
       FORMULAIRE
       ============================== */

    label {
      display: block;
      margin: 17px 0 7px;
      font-weight: 600;
      font-size: 14px;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      font-family: inherit;
      background: #fff;
    }

    input:focus,
    textarea:focus {
      border-color: #5846e8;
    }

    input[readonly] {
      background: #f3f3f3;
      color: #777;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    .save-button {
      width: 100%;
      border: none;
      background: #5846e8;
      color: white;
      padding: 15px;
      border-radius: 11px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 25px;
    }

    .save-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* ==============================
       DECONNEXION
       ============================== */

    .logout {
      width: 100%;
      background: #fff;
      border: 1px solid #ddd;
      color: #d33;
      padding: 13px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
    }

    /* ==============================
       PAS CONNECTÉ
       ============================== */

    .login-card {
      text-align: center;
      padding: 35px 20px;
    }

    .login-card h2 {
      margin: 0 0 10px;
    }

    .login-card p {
      color: #777;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .login-link {
      display: inline-block;
      background: #5846e8;
      color: white;
      text-decoration: none;
      padding: 13px 22px;
      border-radius: 10px;
      font-weight: 700;
    }

    footer {
      text-align: center;
      color: #999;
      font-size: 12px;
      padding: 20px;
    }

    @media (max-width: 600px) {

      main {
        margin-top: 15px;
      }

      .card {
        padding: 19px;
      }

      h1 {
        font-size: 22px;
      }

      .photo-actions {
        flex-direction: column;
      }

      .photo-button,
      .remove-photo {
        width: 100%;
        max-width: 250px;
      }
    }
  </style>
</head>


<body>

<header>

  <div class="header-content">

    <a
      href="/profile.html"
      class="back"
    >
      ← Mon profil
    </a>

    <div class="logo">
      HELPY
    </div>

  </div>

</header>


<main>

  <!-- ==========================================
       UTILISATEUR NON CONNECTÉ
       ========================================== -->

  <div
    id="loginCard"
    class="card login-card"
    style="display:none;"
  >

    <h2>
      Connexion requise
    </h2>

    <p>
      Connecte-toi à ton compte HELPY pour modifier ton profil.
    </p>

    <a
      href="/login.html?redirect=/edit-profile.html"
      class="login-link"
    >
      🔑 Se connecter
    </a>

  </div>


  <!-- ==========================================
       PROFIL
       ========================================== -->

  <div
    id="profileCard"
    class="card"
    style="display:none;"
  >

    <h1>
      Modifier mon profil
    </h1>

    <div class="subtitle">
      Mets à jour tes informations personnelles et ta photo de profil.
    </div>


    <!-- MESSAGES -->

    <div
      id="errorMessage"
      class="message error"
    ></div>

    <div
      id="successMessage"
      class="message success"
    ></div>


    <!-- ========================================
         PHOTO DE PROFIL
         ======================================== -->

    <div class="profile-photo-area">

      <div
        class="avatar"
        id="avatar"
      >
        U
      </div>


      <div class="photo-actions">

        <label
          for="photoInput"
          class="photo-button"
        >
          📷 Ajouter une photo
        </label>

        <button
          type="button"
          id="removePhoto"
          class="remove-photo"
        >
          🗑️ Supprimer
        </button>

      </div>


      <input
        type="file"
        id="photoInput"
        accept="image/jpeg,image/png,image/webp"
      >


      <div class="photo-info">
        JPG, PNG ou WEBP • Maximum 5 MB
      </div>

    </div>


    <!-- ========================================
         FORMULAIRE
         ======================================== -->

    <form id="profileForm">


      <label for="fullName">
        Nom complet
      </label>

      <input
        type="text"
        id="fullName"
        placeholder="Ton nom complet"
        required
      >


      <label for="email">
        E-mail
      </label>

      <input
        type="email"
        id="email"
        readonly
      >


      <label for="phone">
        Téléphone
      </label>

      <input
        type="tel"
        id="phone"
        placeholder="+509..."
      >


      <label for="whatsapp">
        WhatsApp
      </label>

      <input
        type="tel"
        id="whatsapp"
        placeholder="+509..."
      >


      <label for="country">
        Pays
      </label>

      <input
        type="text"
        id="country"
        placeholder="Exemple : Haïti"
      >


      <label for="city">
        Ville
      </label>

      <input
        type="text"
        id="city"
        placeholder="Exemple : Port-au-Prince"
      >


      <label for="description">
        À propos de moi
      </label>

      <textarea
        id="description"
        placeholder="Présente-toi brièvement..."
      ></textarea>


      <button
        type="submit"
        class="save-button"
        id="saveButton"
      >
        💾 Enregistrer les modifications
      </button>

    </form>

  </div>


  <!-- ==========================================
       DÉCONNEXION
       ========================================== -->

  <div
    id="logoutCard"
    class="card"
    style="display:none;"
  >

    <button
      class="logout"
      id="logoutButton"
    >
      Déconnexion
    </button>

  </div>

</main>


<footer>
  © 2026 HELPY
</footer>


<script>

  /* =====================================================
     HELPY - MODIFIER PROFIL
     VERSION FINALE
     
     PHOTO :
     - Stockage local uniquement
     - Pas de PostgreSQL
     - Pas de server.js pour la photo
     - La photo disparaît à la déconnexion
     ===================================================== */


  let currentUser = null;

  let selectedPhoto = null;


  /* =====================================================
     ELEMENTS
     ===================================================== */

  const loginCard =
    document.getElementById("loginCard");

  const profileCard =
    document.getElementById("profileCard");

  const logoutCard =
    document.getElementById("logoutCard");

  const errorMessage =
    document.getElementById("errorMessage");

  const successMessage =
    document.getElementById("successMessage");

  const avatar =
    document.getElementById("avatar");

  const photoInput =
    document.getElementById("photoInput");

  const removePhoto =
    document.getElementById("removePhoto");

  const fullNameInput =
    document.getElementById("fullName");

  const emailInput =
    document.getElementById("email");

  const phoneInput =
    document.getElementById("phone");

  const whatsappInput =
    document.getElementById("whatsapp");

  const countryInput =
    document.getElementById("country");

  const cityInput =
    document.getElementById("city");

  const descriptionInput =
    document.getElementById("description");

  const profileForm =
    document.getElementById("profileForm");

  const saveButton =
    document.getElementById("saveButton");

  const logoutButton =
    document.getElementById("logoutButton");


  /* =====================================================
     MESSAGES
     ===================================================== */

  function showError(message) {

    errorMessage.textContent =
      message;

    errorMessage.style.display =
      "block";

    successMessage.style.display =
      "none";

  }


  function showSuccess(message) {

    successMessage.textContent =
      message;

    successMessage.style.display =
      "block";

    errorMessage.style.display =
      "none";

  }


  /* =====================================================
     RÉCUPÉRER UTILISATEUR
     ===================================================== */

  function getCurrentUser() {

    const saved =
      localStorage.getItem("helpy_user");


    if (!saved) {

      return null;

    }


    try {

      return JSON.parse(saved);

    } catch (error) {

      console.error(
        "Erreur utilisateur:",
        error
      );

      return null;

    }

  }


  /* =====================================================
     INITIAL DU NOM
     ===================================================== */

  function getInitial(name) {

    if (!name) {

      return "U";

    }


    return name
      .trim()
      .charAt(0)
      .toUpperCase();

  }


  /* =====================================================
     AFFICHER AVATAR
     ===================================================== */

  function updateAvatar(name, photo) {

    avatar.innerHTML = "";


    if (photo) {

      const img =
        document.createElement("img");


      img.src =
        photo;


      img.alt =
        "Photo de profil";


      img.onerror =
        function() {

          avatar.textContent =
            getInitial(name);

          removePhoto.style.display =
            "none";

        };


      avatar.appendChild(img);


      removePhoto.style.display =
        "inline-block";


      return;

    }


    avatar.textContent =
      getInitial(name);


    removePhoto.style.display =
      "none";

  }


  /* =====================================================
     INITIALISER PROFIL
     ===================================================== */

  function initializeProfile() {

    currentUser =
      getCurrentUser();


    /*
     * Aucun utilisateur
     */

    if (!currentUser) {

      loginCard.style.display =
        "block";

      profileCard.style.display =
        "none";

      logoutCard.style.display =
        "none";

      return;

    }


    /*
     * Utilisateur connecté
     */

    loginCard.style.display =
      "none";

    profileCard.style.display =
      "block";

    logoutCard.style.display =
      "block";


    const name =
      currentUser.name ||
      currentUser.full_name ||
      currentUser.fullName ||
      currentUser.nom ||
      "Utilisateur";


    const email =
      currentUser.email ||
      "";


    const phone =
      currentUser.phone ||
      currentUser.telephone ||
      "";


    const whatsapp =
      currentUser.whatsapp ||
      "";


    const country =
      currentUser.country ||
      currentUser.pays ||
      "";


    const city =
      currentUser.city ||
      currentUser.ville ||
      "";


    const description =
      currentUser.description ||
      currentUser.bio ||
      "";


    /*
     * Photo déjà enregistrée
     * dans la session locale.
     */

    selectedPhoto =
      currentUser.profile_photo ||
      null;


    /*
     * Remplir formulaire
     */

    fullNameInput.value =
      name;

    emailInput.value =
      email;

    phoneInput.value =
      phone;

    whatsappInput.value =
      whatsapp;

    countryInput.value =
      country;

    cityInput.value =
      city;

    descriptionInput.value =
      description;


    /*
     * Afficher avatar
     */

    updateAvatar(
      name,
      selectedPhoto
    );

  }


  /* =====================================================
     CHOISIR PHOTO
     ===================================================== */

  photoInput.addEventListener(
    "change",
    function() {

      const file =
        this.files[0];


      if (!file) {

        return;

      }


      /*
       * Vérifier type
       */

      const allowedTypes = [
        "image/jpeg",
        "image/png",
        "image/webp"
      ];


      if (
        !allowedTypes.includes(
          file.type
        )
      ) {

        showError(
          "Format non accepté. Utilise JPG, PNG ou WEBP."
        );

        this.value =
          "";

        return;

      }


      /*
       * Vérifier taille
       */

      if (
        file.size >
        5 * 1024 * 1024
      ) {

        showError(
          "La photo est trop grande. Maximum : 5 MB."
        );

        this.value =
          "";

        return;

      }


      /*
       * Lire photo
       */

      const reader =
        new FileReader();


      reader.onload =
        function(event) {

          selectedPhoto =
            event.target.result;


          updateAvatar(
            fullNameInput.value ||
            "Utilisateur",
            selectedPhoto
          );


          showSuccess(
            "Photo sélectionnée. Appuie sur « Enregistrer les modifications »."
          );

        };


      reader.onerror =
        function() {

          showError(
            "Impossible de lire cette photo."
          );

        };


      reader.readAsDataURL(file);

    }
  );


  /* =====================================================
     SUPPRIMER PHOTO
     ===================================================== */

  removePhoto.addEventListener(
    "click",
    function() {

      selectedPhoto =
        null;


      photoInput.value =
        "";


      updateAvatar(
        fullNameInput.value ||
        "Utilisateur",
        null
      );


      showSuccess(
        "Photo supprimée. Appuie sur « Enregistrer les modifications » pour confirmer."
      );

    }
  );


  /* =====================================================
     ENREGISTRER PROFIL
     ===================================================== */

  profileForm.addEventListener(
    "submit",
    function(event) {

      event.preventDefault();


      if (!currentUser) {

        showError(
          "Aucun utilisateur connecté."
        );

        return;

      }


      const name =
        fullNameInput.value.trim();


      /*
       * Nom obligatoire
       */

      if (!name) {

        showError(
          "Veuillez entrer votre nom complet."
        );

        return;

      }


      /*
       * Désactiver bouton
       */

      saveButton.disabled =
        true;

      saveButton.textContent =
        "Enregistrement...";


      /*
       * Informations
       */

      currentUser.name =
        name;


      currentUser.full_name =
        name;


      currentUser.fullName =
        name;


      currentUser.phone =
        phoneInput.value.trim();


      currentUser.whatsapp =
        whatsappInput.value.trim();


      currentUser.country =
        countryInput.value.trim();


      currentUser.city =
        cityInput.value.trim();


      currentUser.description =
        descriptionInput.value.trim();


      /*
       * PHOTO
       *
       * Elle est enregistrée
       * uniquement dans localStorage.
       */

      currentUser.profile_photo =
        selectedPhoto;


      /*
       * Sauvegarde locale
       */

      try {

        localStorage.setItem(
          "helpy_user",
          JSON.stringify(
            currentUser
          )
        );


        /*
         * ID utilisateur
         */

        if (
          currentUser.id !== undefined &&
          currentUser.id !== null
        ) {

          localStorage.setItem(
            "helpy_user_id",
            String(
              currentUser.id
            )
          );

        }


        /*
         * Compatibilité avec
         * certaines anciennes pages.
         */

        localStorage.setItem(
          "currentUser",
          JSON.stringify(
            currentUser
          )
        );


        /*
         * Message
         */

        showSuccess(
          "Profil enregistré avec succès."
        );


        /*
         * Retour profil
         */

        setTimeout(
          function() {

            window.location.href =
              "/profile.html";

          },
          900
        );


      } catch (error) {

        console.error(
          "Erreur sauvegarde:",
          error
        );


        showError(
          "Impossible d'enregistrer les modifications. L'image est peut-être trop grande."
        );


        saveButton.disabled =
          false;

        saveButton.textContent =
          "💾 Enregistrer les modifications";

      }

    }
  );


  /* =====================================================
     DÉCONNEXION
     ===================================================== */

  logoutButton.addEventListener(
    "click",
    function() {

      const confirmation =
        confirm(
          "Voulez-vous vraiment vous déconnecter ?"
        );


      if (!confirmation) {

        return;

      }


      /*
       * Supprimer session locale
       *
       * Cela supprime également
       * la photo locale.
       */

      localStorage.removeItem(
        "helpy_user"
      );


      localStorage.removeItem(
        "helpy_user_id"
      );


      localStorage.removeItem(
        "currentUser"
      );


      localStorage.removeItem(
        "user"
      );


      localStorage.removeItem(
        "helpyUser"
      );


      /*
       * Retour vers la connexion
       */

      window.location.href =
        "/login.html";

    }
  );


  /* =====================================================
     DÉMARRAGE
     ===================================================== */

  initializeProfile();

</script>

</body>
</html>
