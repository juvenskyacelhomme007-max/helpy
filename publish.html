<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Publier — HELPY</title><link rel="stylesheet" href="style.css"><script src="app.js"></script></head><body><main class="container"><form class="form" onsubmit="go(event)"><h1>Publier sur HELPY</h1><div class="field"><label>Type</label><select id="type"><option value="products">Produit</option><option value="services">Service</option></select></div><div class="field"><label>Titre *</label><input id="title" required></div><div class="field"><label>Description</label><textarea id="description"></textarea></div><div class="field"><label>Prix</label><input id="price" type="number" step="0.01"></div><div class="field"><label>Devise</label><input id="currency" value="USD"></div><div class="field"><label>Catégorie</label><input id="category"></div><div class="field"><label>Quantité (produit)</label><input id="quantity" type="number" value="1"></div><div class="field"><label>Pays</label><input id="country"></div><div class="field"><label>Ville / zone</label><input id="city"></div><div class="field"><label>WhatsApp *</label><input id="whatsapp" required></div><button class="btn">Publier</button><p id="msg" class="muted"></p></form></main><script>async function go(e){e.preventDefault();const t=type.value;const d={title:title.value,description:description.value,price:price.value,currency:currency.value,category:category.value,quantity:quantity.value,country:country.value,city:city.value,whatsapp:whatsapp.value};msg.textContent='Publication...';const r=await apiFetch('/api/'+t,'POST',d);msg.textContent=r.error?r.message:r.message||'Publication réussie.'}</script></body></html>
