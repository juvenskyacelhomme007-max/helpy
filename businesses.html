<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/icon.svg"><link rel="stylesheet" href="/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/config.js"></script><script src="/supabase.js"></script><title>Entreprises — HELPY</title></head><body><header class="topbar"><div class="inner"><a class="brand" href="/"><span class="logo">H</span><span class="brand-name">HELPY</span></a><a class="primary" href="/publish.html#bizForm">Créer</a></div></header><main class="container page"><div class="panel"><h1>Entreprises</h1><p class="muted">Découvrez des entreprises et professionnels du monde entier.</p><div class="searchbox" style="border:1px solid var(--line);box-shadow:none"><span>⌕</span><input id="q" placeholder="Nom, catégorie, ville…"><button onclick="load()">Rechercher</button></div></div><section class="section"><div id="businesses" class="grid"></div></section></main><nav class="bottom-nav"><a href="/"><div>⌂</div><span>Accueil</span></a><a href="/search.html"><div>⌕</div><span>Recherche</span></a><a class="publish-fab" href="/publish.html"><div>＋</div><span>Publier</span></a><a href="/messages.html"><div>💬</div><span>Messages</span></a><a href="/profile.html"><div>♙</div><span>Profil</span></a></nav><script>
async function load(){const db=await HELPY.init();if(!db){businesses.innerHTML='<div class="empty">Configure Supabase pour afficher les entreprises.</div>';return}let r=db.from("businesses").select("*").order("created_at",{ascending:false}).limit(50);const t=q.value.trim();if(t)r=r.or(`name.ilike.%${t}%,category.ilike.%${t}%,location.ilike.%${t}%,country.ilike.%${t}%`);const {data,error}=await r;businesses.innerHTML=error?'<div class="empty">Erreur.</div>':(data||[]).map(x=>`<article class="card"><div class="photo">${x.image_url?`<img src="${HELPY.esc(x.image_url)}">`:'<div style="display:grid;place-items:center;height:100%;font-size:50px">🏢</div>'}</div><div class="card-body"><h3>${HELPY.esc(x.name)}</h3><div class="muted">🏷️ ${HELPY.esc(x.category||"Entreprise")}</div><div class="muted">📍 ${HELPY.esc([x.location,x.country].filter(Boolean).join(", ")||"Worldwide")}</div><p class="muted">${HELPY.esc(x.description||"")}</p></div></article>`).join("")||'<div class="empty">Aucune entreprise.</div>'}load();
</script></body></html>
