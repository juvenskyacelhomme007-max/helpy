<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entreprise — HELPY</title><link rel="stylesheet" href="style.css"><script src="app.js"></script></head><body><main class="container"><div id="box" class="card">Chargement...</div></main><script>(async()=>{const id=new URLSearchParams(location.search).get('id'),r=await apiFetch('/api/businesses/'+id),x=r.entreprise;if(!x){box.textContent=r.message||'Introuvable';return}box.innerHTML=`<h1>${x.name}</h1><p>${x.description||''}</p><p>${x.category||''} · ${x.city||x.country||''}</p><p>${x.address||''}</p><a class="btn" href="https://wa.me/${String(x.whatsapp||'').replace(/[^0-9]/g,'')}">WhatsApp</a>`})()</script></body></html>
