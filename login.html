<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HELPY - Connexion</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <div class="app-container" style="padding-top: 40px;">
    
    <!-- EN-TÊTE -->
    <div style="text-align: center; margin-bottom: 30px;">
      <div class="logo-icon" style="margin: 0 auto 10px auto; width: 50px; height: 50px; font-size: 24px;">
        <i class="fa-solid fa-handshake"></i>
      </div>
      <h2 style="font-size: 22px; font-weight: 700;">Connexion à <span style="color: var(--light-purple);">HELPY</span></h2>
      <p style="font-size: 13px; color: var(--text-gray); margin-top: 4px;">Accédez à votre compte pour continuer</p>
    </div>

    <!-- FORMULAIRE DE CONNEXION -->
    <form onsubmit="handleLogin(event)">
      
      <div class="form-group">
        <label style="font-size: 12px; color: var(--text-gray); margin-bottom: 6px; display: block;">Adresse e-mail</label>
        <input type="email" id="email" class="form-control" style="width: 100%;" required placeholder="nom@exemple.com">
      </div>

      <div class="form-group" style="margin-top: 14px;">
        <label style="font-size: 12px; color: var(--text-gray); margin-bottom: 6px; display: block;">Mot de passe</label>
        <input type="password" id="password" class="form-control" style="width: 100%;" required placeholder="••••••••">
      </div>

      <button type="submit" id="login-btn" class="btn-primary" style="width: 100%; margin-top: 24px; padding: 14px; font-size: 14px; justify-content: center;">
        <i class="fa-solid fa-right-to-bracket"></i> Se connecter
      </button>

    </form>

    <!-- LIEN INSCRIPTION -->
    <div style="text-align: center; margin-top: 30px; font-size: 13px; color: var(--text-gray);">
      Vous n'avez pas de compte ? 
      <a href="register.html" style="color: var(--light-purple); font-weight: 600; text-decoration: none;">S'inscrire</a>
    </div>

  </div>

  <script src="app.js"></script>
  <script>
    async function handleLogin(e) {
      e.preventDefault();

      const btn = document.getElementById('login-btn');
      btn.disabled = true;
      btn.innerText = "Connexion en cours...";

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      const res = await apiFetch('/api/login', 'POST', { email, password });

      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Se connecter';

      if (res && res.success) {
        localStorage.setItem('helpy_user_id', res.user_id);
        window.location.href = 'index.html';
      } else {
        alert(res?.message || "Identifiants incorrects. Veuillez réessayer.");
      }
    }
  </script>
</body>
</html>
