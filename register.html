<!DOCTYPE html>
<html lang="ht">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kreye kont - HELPY</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #0b1225;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 500px;
    }

    .logo {
      text-align: center;
      font-size: 36px;
      font-weight: 900;
      margin-bottom: 25px;
      color: white;
    }

    .card {
      width: 100%;
      background: #101a32;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 28px 22px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.35);
    }

    h1 {
      text-align: center;
      font-size: 28px;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #9ca8c0;
      font-size: 16px;
      margin-bottom: 28px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      color: #b9c2d4;
      margin-bottom: 8px;
      font-size: 15px;
    }

    input {
      width: 100%;
      height: 52px;
      padding: 0 15px;
      border-radius: 10px;
      border: 1px solid #39445d;
      background: #0c1428;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #6c63ff;
      box-shadow: 0 0 0 3px rgba(108,99,255,0.15);
    }

    input::placeholder {
      color: #68748c;
    }

    button {
      width: 100%;
      height: 52px;
      border: none;
      border-radius: 10px;
      background: #6c63ff;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
      margin-top: 5px;
    }

    button:hover {
      background: #584ff0;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      text-align: center;
      margin-top: 18px;
      padding: 12px;
      border-radius: 10px;
      font-size: 15px;
    }

    .success {
      display: block;
      background: rgba(34,197,94,0.12);
      color: #4ade80;
    }

    .error {
      display: block;
      background: rgba(239,68,68,0.12);
      color: #f87171;
    }

    .login-link {
      text-align: center;
      margin-top: 22px;
      color: #9ca8c0;
      font-size: 15px;
    }

    .login-link a {
      color: #8b5cf6;
      text-decoration: none;
      font-weight: bold;
    }

    .login-link a:hover {
      text-decoration: underline;
    }

    .loading {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 15px;
      }

      .card {
        padding: 25px 18px;
      }

      h1 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      H
    </div>

    <div class="card">

      <h1>Kreye yon kont HELPY</h1>

      <p class="subtitle">
        Antre enfòmasyon w yo pou w ka kòmanse
      </p>

      <form id="registerForm">

        <div class="form-group">
          <label for="name">Non konplè</label>

          <input
            type="text"
            id="name"
            name="name"
            placeholder="Eg: Jean Baptiste"
            required
          >
        </div>

        <div class="form-group">
          <label for="email">Imèl</label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="zanmi@email.com"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Mo de pas</label>

          <input
            type="password"
            id="password"
            name="password"
            placeholder="********"
            minlength="6"
            required
          >
        </div>

        <button type="submit" id="registerButton">
          Kreye Kont Mwen
        </button>

      </form>

      <div id="message" class="message"></div>

      <div class="login-link">
        Ou gen yon kont deja?
        <a href="/login">Konekte w</a>
      </div>

    </div>

  </div>


  <script>

    const form = document.getElementById("registerForm");
    const button = document.getElementById("registerButton");
    const message = document.getElementById("message");


    form.addEventListener("submit", async function(event) {

      event.preventDefault();

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;


      // Verify enfòmasyon yo
      if (!name || !email || !password) {

        showMessage(
          "Tanpri ranpli tout chan yo.",
          "error"
        );

        return;
      }


      if (password.length < 6) {

        showMessage(
          "Mo de pas la dwe gen omwen 6 karaktè.",
          "error"
        );

        return;
      }


      // Loading
      button.disabled = true;

      button.innerHTML =
        '<span class="loading"></span> Ap kreye kont...';

      message.className = "message";
      message.textContent = "";


      try {

        const response = await fetch("/api/register", {

          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            name: name,
            email: email,
            password: password
          })

        });


        const data = await response.json();


        if (!response.ok) {

          showMessage(
            data.error || "Gen yon pwoblèm pandan kreyasyon kont lan.",
            "error"
          );

          button.disabled = false;
          button.textContent = "Kreye Kont Mwen";

          return;
        }


        // Kont kreye avèk siksè
        showMessage(
          "Kont kreye ak siksè! W ap antre sou HELPY...",
          "success"
        );


        // Sove itilizatè a lokalman
        if (data.user) {

          localStorage.setItem("helpy_user_id", String(data.user.id));
          localStorage.setItem("helpyUser", JSON.stringify(data.user));
          localStorage.setItem("helpy_user", JSON.stringify(data.user));

        }


        // Ale sou paj prensipal la
        setTimeout(() => {

          window.location.href = "/";

        }, 1000);


      } catch (error) {

        console.error(error);

        showMessage(
          "Nou pa ka kontakte sèvè HELPY a. Eseye ankò.",
          "error"
        );

        button.disabled = false;
        button.textContent = "Kreye Kont Mwen";

      }

    });


    function showMessage(text, type) {

      message.textContent = text;

      message.className =
        "message " + type;

    }

  </script>

</body>
</html>
