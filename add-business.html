<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ajouter une entreprise - HELPY</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #1f2937;
      min-height: 100vh;
    }

    .header {
      background: #111827;
      color: white;
      padding: 18px 20px;
      text-align: center;
    }

    .header h1 {
      font-size: 25px;
      margin-bottom: 5px;
    }

    .header p {
      color: #cbd5e1;
      font-size: 14px;
    }

    .container {
      width: 100%;
      max-width: 650px;
      margin: 30px auto;
      padding: 0 16px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    .card h2 {
      margin-bottom: 8px;
      font-size: 22px;
    }

    .subtitle {
      color: #64748b;
      font-size: 14px;
      margin-bottom: 22px;
    }

    .form-group {
      margin-bottom: 17px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
      font-size: 14px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      background: white;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,0.10);
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    .required {
      color: #dc2626;
    }

    .button {
      width: 100%;
      border: none;
      border-radius: 11px;
      padding: 15px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    .button:hover {
      background: #1d4ed8;
    }

    .button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .message {
      display: none;
      padding: 13px;
      border-radius: 10px;
      margin-bottom: 18px;
      font-size: 14px;
      font-weight: bold;
    }

    .success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .back {
      display: inline-block;
      margin-top: 18px;
      text-decoration: none;
      color: #2563eb;
      font-weight: bold;
      font-size: 14px;
    }

    .loading {
      display: none;
      text-align: center;
      margin-top: 12px;
      color: #64748b;
      font-size: 14px;
    }

    @media (max-width: 500px) {
      .container {
        margin-top: 18px;
      }

      .card {
        padding: 20px;
        border-radius: 15px;
      }

      .header h1 {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>

  <header class="header">
    <h1>HELPY</h1>
    <p>Ajouter une entreprise</p>
  </header>

  <main class="container">

    <div class="card">

      <h2>Créer une entreprise</h2>

      <p class="subtitle">
        Ajoutez les informations de votre entreprise pour la publier sur HELPY.
      </p>

      <div id="message" class="message"></div>

      <form id="businessForm">

        <!-- NOM -->
        <div class="form-group">
          <label>
            Nom de l'entreprise <span class="required">*</span>
          </label>

          <input
            type="text"
            id="name"
            placeholder="Ex: Boulangerie Chez Marie"
            required
          >
        </div>

        <!-- CATÉGORIE -->
        <div class="form-group">
          <label>
            Catégorie <span class="required">*</span>
          </label>

          <select id="category" required>
            <option value="">Choisir une catégorie</option>
            <option value="Restaurant">Restaurant</option>
            <option value="Boutique">Boutique</option>
            <option value="Supermarché">Supermarché</option>
            <option value="Informatique">Informatique</option>
            <option value="Téléphones">Téléphones</option>
            <option value="Beauté">Beauté</option>
            <option value="Mode">Mode</option>
            <option value="Transport">Transport</option>
            <option value="Hôtel">Hôtel</option>
            <option value="Construction">Construction</option>
            <option value="Éducation">Éducation</option>
            <option value="Services">Services</option>
            <option value="Autre">Autre</option>
          </select>
        </div>

        <!-- DESCRIPTION -->
        <div class="form-group">
          <label>Description</label>

          <textarea
            id="description"
            placeholder="Décrivez votre entreprise..."
          ></textarea>
        </div>

        <!-- TÉLÉPHONE -->
        <div class="form-group">
          <label>Téléphone</label>

          <input
            type="tel"
            id="phone"
            placeholder="Ex: 509 0000 0000"
          >
        </div>

        <!-- WHATSAPP -->
        <div class="form-group">
          <label>WhatsApp</label>

          <input
            type="tel"
            id="whatsapp"
            placeholder="Ex: 509 0000 0000"
          >
        </div>

        <!-- EMAIL -->
        <div class="form-group">
          <label>Email</label>

          <input
            type="email"
            id="email"
            placeholder="entreprise@email.com"
          >
        </div>

        <!-- ADRESSE -->
        <div class="form-group">
          <label>Adresse</label>

          <input
            type="text"
            id="address"
            placeholder="Ex: Delmas 33"
          >
        </div>

        <!-- VILLE -->
        <div class="form-group">
          <label>Ville</label>

          <input
            type="text"
            id="city"
            placeholder="Ex: Port-au-Prince"
          >
        </div>

        <!-- IMAGE -->
        <div class="form-group">
          <label>URL de l'image</label>

          <input
            type="url"
            id="image_url"
            placeholder="https://..."
          >
        </div>

        <button
          type="submit"
          class="button"
          id="submitButton"
        >
          Ajouter l'entreprise
        </button>

        <div id="loading" class="loading">
          Enregistrement en cours...
        </div>

      </form>

      <a href="index.html" class="back">
        ← Retour à HELPY
      </a>

    </div>

  </main>

<script>

  // =====================================================
  // URL DU BACKEND RAILWAY
  // =====================================================

  const API_URL =
    "https://helpy-production-c2f2.up.railway.app";

  // =====================================================
  // FORMULAIRE
  // =====================================================

  const form = document.getElementById("businessForm");
  const message = document.getElementById("message");
  const submitButton = document.getElementById("submitButton");
  const loading = document.getElementById("loading");

  // =====================================================
  // AFFICHER MESSAGE
  // =====================================================

  function showMessage(text, type) {

    message.textContent = text;

    message.className = "message " + type;

  }

  // =====================================================
  // SUBMIT
  // =====================================================

  form.addEventListener("submit", async function(event) {

    event.preventDefault();

    message.className = "message";
    message.textContent = "";

    submitButton.disabled = true;
    submitButton.textContent = "Enregistrement...";
    loading.style.display = "block";

    const businessData = {

      name:
        document.getElementById("name").value.trim(),

      category:
        document.getElementById("category").value,

      description:
        document.getElementById("description").value.trim(),

      phone:
        document.getElementById("phone").value.trim(),

      whatsapp:
        document.getElementById("whatsapp").value.trim(),

      email:
        document.getElementById("email").value.trim(),

      address:
        document.getElementById("address").value.trim(),

      city:
        document.getElementById("city").value.trim(),

      image_url:
        document.getElementById("image_url").value.trim()

    };

    try {

      const response = await fetch(
        API_URL + "/api/businesses",
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify(businessData)
        }
      );

      const data = await response.json();

      if (!response.ok) {

        throw new Error(
          data.message ||
          "Impossible d'ajouter l'entreprise."
        );

      }

      showMessage(
        "✅ Entreprise ajoutée avec succès !",
        "success"
      );

      form.reset();

      console.log("Entreprise créée :", data);

    } catch (error) {

      console.error(error);

      showMessage(
        "❌ " + error.message,
        "error"
      );

    } finally {

      submitButton.disabled = false;

      submitButton.textContent =
        "Ajouter l'entreprise";

      loading.style.display = "none";

    }

  });

</script>

</body>
</html>
