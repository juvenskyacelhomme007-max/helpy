<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Produits — HELPY</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fb;
      color: #172033;
      padding-bottom: 75px;
    }

    header {
      background: white;
      border-bottom: 1px solid #e5e7eb;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header {
      max-width: 1200px;
      height: 65px;
      margin: auto;
      padding: 0 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 25px;
      font-weight: 900;
    }

    .logo-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .back {
      color: #2563eb;
      font-weight: bold;
      font-size: 14px;
    }

    main {
      max-width: 1200px;
      margin: auto;
      padding: 25px 18px;
    }

    h1 {
      font-size: 30px;
      margin-bottom: 6px;
    }

    .subtitle {
      color: #6b7280;
      margin-bottom: 20px;
    }

    .search {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 13px;
      padding: 13px 15px;
      width: 100%;
      outline: none;
      font-size: 15px;
      margin-bottom: 25px;
    }

    .status {
      text-align: center;
      padding: 35px 15px;
      color: #6b7280;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }

    .product {
      background: white;
      border-radius: 17px;
      overflow: hidden;
      border: 1px solid #e5e7eb;
      transition: .2s;
    }

    .product:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(0,0,0,.08);
    }

    .product-image {
      width: 100%;
      height: 190px;
      background: #eef2f7;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .no-image {
      font-size: 45px;
    }

    .product-info {
      padding: 15px;
    }

    .product-title {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .price {
      color: #2563eb;
      font-size: 19px;
      font-weight: 800;
      margin-bottom: 7px;
    }

    .location {
      color: #6b7280;
      font-size: 13px;
      margin-bottom: 12px;
    }

    .whatsapp {
      display: block;
      text-align: center;
      background: #16a34a;
      color: white;
      padding: 10px;
      border-radius: 9px;
      font-size: 14px;
      font-weight: bold;
    }

    .mobile-nav {
      display: none;
    }

    @media (max-width: 900px) {
      .products {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {

      main {
        padding: 22px 14px;
      }

      h1 {
        font-size: 27px;
      }

      .products {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }

      .product-image {
        height: 145px;
      }

      .product-info {
        padding: 12px;
      }

      .product-title {
        font-size: 15px;
      }

      .price {
        font-size: 17px;
      }

      .mobile-nav {
        display: flex;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        height: 65px;
        background: white;
        border-top: 1px solid #e5e7eb;
        z-index: 200;
        justify-content: space-around;
        align-items: center;
      }

      .mobile-nav a {
        text-align: center;
        color: #6b7280;
        font-size: 11px;
      }

      .mobile-nav span {
        display: block;
        font-size: 20px;
        margin-bottom: 2px;
      }

      .mobile-nav .active {
        color: #2563eb;
        font-weight: bold;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header">

    <a href="/" class="logo">
      <div class="logo-icon">H</div>
      HELPY
    </a>

    <a href="/" class="back">← Accueil</a>

  </div>
</header>


<main>

  <h1>Produits 🛍️</h1>

  <p class="subtitle">
    Découvrez les produits disponibles sur HELPY.
  </p>

  <input
    id="searchInput"
    class="search"
    type="text"
    placeholder="Rechercher un produit..."
  >

  <div id="status" class="status">
    Chargement des produits...
  </div>

  <div id="products" class="products"></div>

</main>


<!-- MOBILE NAV -->

<div class="mobile-nav">

  <a href="/">
    <span>⌂</span>
    Accueil
  </a>

  <a href="/products.html" class="active">
    <span>🛍️</span>
    Produits
  </a>

  <a href="/services.html">
    <span>🛠️</span>
    Services
  </a>

  <a href="/add-service.html">
    <span>＋</span>
    Publier
  </a>

  <a href="/login.html">
    <span>👤</span>
    Compte
  </a>

</div>


<script>

const API_URL = "https://helpy-production.up.railway.app";

let allProducts = [];

async function loadProducts() {

  const status = document.getElementById("status");
  const container = document.getElementById("products");

  try {

    const response = await fetch(API_URL + "/api/products");

    if (!response.ok) {
      throw new Error("Erreur serveur");
    }

    const data = await response.json();

    allProducts = data.products || [];

    displayProducts(allProducts);

  } catch (error) {

    console.error(error);

    status.innerHTML =
      "Impossible de charger les produits.";

  }
}


function displayProducts(products) {

  const container = document.getElementById("products");
  const status = document.getElementById("status");

  container.innerHTML = "";

  if (products.length === 0) {

    status.innerHTML =
      "Aucun produit disponible pour le moment.";

    return;

  }

  status.innerHTML =
    products.length + " produit(s) disponible(s).";


  products.forEach(product => {

    const card = document.createElement("div");

    card.className = "product";

    let imageHTML = `
      <div class="no-image">🛍️</div>
    `;

    if (product.image_url) {

      imageHTML = `
        <img
          src="${product.image_url}"
          alt="${escapeHTML(product.title)}"
        >
      `;

    }

    const whatsappNumber =
      product.whatsapp || "";

    const whatsappLink =
      "https://wa.me/" +
      whatsappNumber.replace(/\D/g, "");


    card.innerHTML = `

      <div class="product-image">
        ${imageHTML}
      </div>

      <div class="product-info">

        <div class="product-title">
          ${escapeHTML(product.title)}
        </div>

        <div class="price">
          ${formatPrice(product.price)}
          ${product.currency || "HTG"}
        </div>

        <div class="location">
          📍 ${escapeHTML(product.location || "Haïti")}
        </div>

        ${
          whatsappNumber
          ?
          `
          <a
            class="whatsapp"
            href="${whatsappLink}"
            target="_blank"
          >
            WhatsApp
          </a>
          `
          :
          ""
        }

      </div>

    `;

    container.appendChild(card);

  });

}


function formatPrice(price) {

  const number = Number(price);

  if (isNaN(number)) {
    return price;
  }

  return new Intl.NumberFormat("fr-FR").format(number);

}


function escapeHTML(value) {

  if (!value) return "";

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


document
  .getElementById("searchInput")
  .addEventListener("input", function() {

    const query =
      this.value.toLowerCase().trim();

    const filtered =
      allProducts.filter(product => {

        return (
          (product.title || "")
            .toLowerCase()
            .includes(query)
          ||
          (product.description || "")
            .toLowerCase()
            .includes(query)
          ||
          (product.category || "")
            .toLowerCase()
            .includes(query)
          ||
          (product.location || "")
            .toLowerCase()
            .includes(query)
        );

      });

    displayProducts(filtered);

  });


loadProducts();

</script>

</body>
</html>
