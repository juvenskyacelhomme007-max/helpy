<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Produits — HELPY</title><link rel="stylesheet" href="style.css"><script src="app.js"></script></head><body><main class="container"><h1>Produits</h1><div id="grid" class="grid">Chargement...</div></main><script>(async()=>{const r=await apiFetch('/api/products');grid.innerHTML=(r.produits||[]).map(x=>`<article class="card"><h3>${x.title||x.name}</h3><p>${x.description||''}</p><p class="price">${x.price} ${x.currency||'USD'}</p><a class="btn" href="listing-details.html?id=${x.id}&type=product">Voir détails</a></article>`).join('')||'<p>Aucun produit pour le moment.</p>'})()</script></body></html>
