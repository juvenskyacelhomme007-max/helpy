<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Connexion - HELPY</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f6fa;
      color: #202124;
      min-height: 100vh;
    }

    header {
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      color: #5846e8;
      font-size: 25px;
      font-weight: 800;
      text-decoration: none;
      letter-spacing: -1px;
    }

    .back {
      text-decoration: none;
      color: #444;
      font-size: 14px;
      font-weight: 600;
    }

    .container {
      width: 100%;
      max-width: 480px;
      margin: 45px auto;
      padding: 0 16px 40px;
    }

    .card {
      background: #ffffff;
      border-radius: 20px;
      padding: 28px 22px;
      box-shadow: 0 5px 25px rgba(0, 0, 0, 0.06);
    }

    .top {
      text-align: center;
      margin-bottom: 25px;
    }

    .icon {
      width: 70px;
      height: 70px;
      margin: 0 auto 15px;
      border-radius: 50%;
      background: #f0efff;
      color: #5846e8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
    }

    h1 {
      font-size: 25px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #777;
      font-size: 14px;
      line-height: 1.5;
    }

    .message {
      display: none;
      padding: 12px 14px;
      border-radius: 10px;
      margin-bottom: 16px;
      font-size: 14px;
      line-height: 1.4;
    }

    .message.error {
      display: block;
      background: #fff0f0;
      color: #c5221f;
      border: 1px solid #ffd5d5;
    }

    .message.success {
      display: block;
      background: #eefbf3;
      color: #188038;
      border: 1px solid #ccebd8;
    }

    .field {
      margin-bottom: 17px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: 700;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d9dce3;
      border-radius: 12px;
      font-size: 15px;
      outline: none;
      background: #ffffff;
      color: #202124;
    }

    input:focus {
      border-color: #5846e8;
      box-shadow: 0 0 0 3px rgba(88, 70, 232, 0.10);
    }

    .password-box {
      position: relative;
    }

    .password-box input {
      padding-right: 52px;
    }

    .show-password {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 19px;
      padding: 5px;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 5px;
    }

    .btn-primary {
      background: #5846e8;
      color: white;
    }

    .btn-primary:hover {
      opacity: 0.94;
    }

    .btn-primary:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .links {
      text-align: center;
      margin-top: 22px;
      font-size: 14px;
      color: #777;
      line-height: 1.8;
    }

    .links a {
      color: #5846e8;
      text-decoration: none;
      font-weight: 700;
    }

    footer {
      text-align: center;
      color: #888;
      font-size: 12px;
      padding: 20px;
    }

    @media (max-width: 480px) {
      .container {
        margin-top: 25px;
      }

      .card {
        padding: 24px 17px;
      }

      h1 {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

<header>

  <a href="/" class="logo">
    HELPY
  </a>

  <a href="/" class="back">
    ← Accueil
  </a>

</header>


<main class="container">

  <div class="card">

    <div class="top">

      <div class="icon">
        🔐
      </div>

      <h1>
        Se connecter
      </h1>

      <p class="subtitle">
        Connectez-vous à votre compte HELPY pour accéder à votre espace.
      </p>

    </div>


    <div
      id="message"
      class="message"
    ></div>


    <form id="loginForm">

      <div class="field">

        <label for="email">
          E-mail
        </label>

        <input
          type="email"
          id="email"
          name="email"
          placeholder="exemple@email.com"
          autocomplete="email"
          required
        >

      </div>


      <div class="field">

        <label for="password">
          Mot de passe
        </label>

        <div class="password-box">

          <input
            type="password"
            id="password"
            name="password"
            placeholder="Votre mot de passe"
            autocomplete="current-password"
            required
          >

          <button
            type="button"
            class="show-password"
            id="showPassword"
            aria-label="Afficher le mot de passe"
          >
            👁️
          </button>

        </div>

      </div>


      <button
        type="submit"
        class="btn btn-primary"
        id="loginButton"
      >
        Se connecter
      </button>

    </form>


    <div class="links">

      <div>
        Vous n'avez pas encore de compte ?
        <a href="/register.html">
          Créer un compte
        </a>
      </div>

      <div>
        <a href="/">
          ← Retour à l'accueil
        </a>
      </div>

    </div>

  </div>

</main>


<footer>
  © 2026 HELPY — Acheter • Vendre • Offrir des services • Trouver des services
</footer>


<script>

  /*
   * =====================================================
   * HELPY — CONNEXION
   * =====================================================
   */

  const API_BASE_URL =
    window.location.origin;


  /*
   * -----------------------------------------------------
   * ÉLÉMENTS
   * -----------------------------------------------------
   */

  const loginForm =
    document.getElementById("loginForm");

  const emailInput =
    document.getElementById("email");

  const passwordInput =
    document.getElementById("password");

  const loginButton =
    document.getElementById("loginButton");

  const messageBox =
    document.getElementById("message");

  const showPasswordButton =
    document.getElementById("showPassword");


  /*
   * -----------------------------------------------------
   * MESSAGE
   * -----------------------------------------------------
   */

  function showMessage(message, type) {

    messageBox.textContent =
      message;

    messageBox.className =
      "message " + type;

  }


  function clearMessage() {

    messageBox.textContent =
      "";

    messageBox.className =
      "message";

  }


  /*
   * -----------------------------------------------------
   * AFFICHER / CACHER MOT DE PASSE
   * -----------------------------------------------------
   */

  showPasswordButton.addEventListener(
    "click",
    function() {

      if (
        passwordInput.type ===
        "password"
      ) {

        passwordInput.type =
          "text";

        showPasswordButton.textContent =
          "🙈";

      } else {

        passwordInput.type =
          "password";

        showPasswordButton.textContent =
          "👁️";

      }

    }
  );


  /*
   * -----------------------------------------------------
   * CONNEXION
   * -----------------------------------------------------
   */

  loginForm.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();

      clearMessage();


      const email =
        emailInput.value.trim();

      const password =
        passwordInput.value;


      if (!email || !password) {

        showMessage(
          "Veuillez remplir tous les champs.",
          "error"
        );

        return;

      }


      /*
       * Désactiver le bouton
       */

      loginButton.disabled =
        true;

      loginButton.textContent =
        "Connexion...";


      try {

        const response =
          await fetch(
            API_BASE_URL +
            "/api/login",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                email: email,
                password: password
              })
            }
          );


        /*
         * Lire la réponse du serveur
         */

        let data = null;

        try {

          data =
            await response.json();

        } catch (jsonError) {

          data = null;

        }


        /*
         * Vérifier la réponse
         */

        if (!response.ok) {

          const errorMessage =
            data &&
            (
              data.message ||
              data.error ||
              data.messsage
            );

          throw new Error(
            errorMessage ||
            "E-mail ou mot de passe incorrect."
          );

        }


        /*
         * Récupérer l'utilisateur
         *
         * Le backend HELPY doit normalement
         * retourner:
         *
         * {
         *   user: {...}
         * }
         */

        const user =
          data &&
          data.user
            ? data.user
            : null;


        if (!user) {

          throw new Error(
            "Le serveur a accepté la connexion mais n'a pas retourné les informations du compte."
          );

        }


        /*
         * -------------------------------------------------
         * SAUVEGARDER L'UTILISATEUR
         * -------------------------------------------------
         */

        localStorage.setItem(
          "helpy_user",
          JSON.stringify(user)
        );


        /*
         * Sauvegarder l'ID
         */

        if (user.id !== undefined && user.id !== null) {

          localStorage.setItem(
            "helpy_user_id",
            String(user.id)
          );

        }


        /*
         * Compatibilité avec certaines anciennes pages
         */

        localStorage.setItem(
          "currentUser",
          JSON.stringify(user)
        );


        /*
         * Message de réussite
         */

        showMessage(
          "Connexion réussie ! Redirection...",
          "success"
        );


        /*
         * -------------------------------------------------
         * REDIRECTION
         * -------------------------------------------------
         *
         * Si la page login a été ouverte depuis
         * profile.html avec:
         *
         * /login.html?redirect=/profile.html
         *
         * l'utilisateur retournera automatiquement
         * sur son profil.
         *
         * Sinon, retour à l'accueil.
         */

        const params =
          new URLSearchParams(
            window.location.search
          );


        let redirect =
          params.get("redirect");


        /*
         * Sécurité:
         * on accepte seulement les redirections
         * internes à HELPY.
         */

        if (
          !redirect ||
          !redirect.startsWith("/") ||
          redirect.startsWith("//")
        ) {

          redirect =
            "/";

        }


        setTimeout(
          function() {

            window.location.href =
              redirect;

          },
          500
        );


      } catch (error) {

        console.error(
          "Erreur connexion:",
          error
        );


        showMessage(
          error.message ||
          "Impossible de se connecter. Veuillez réessayer.",
          "error"
        );


        loginButton.disabled =
          false;

        loginButton.textContent =
          "Se connecter";

      }

    }
  );


  /*
   * -----------------------------------------------------
   * SI L'UTILISATEUR EST DÉJÀ CONNECTÉ
   * -----------------------------------------------------
   */

  document.addEventListener(
    "DOMContentLoaded",
    function() {

      try {

        const savedUser =
          localStorage.getItem(
            "helpy_user"
          );


        if (savedUser) {

          const params =
            new URLSearchParams(
              window.location.search
            );


          let redirect =
            params.get("redirect");


          if (
            !redirect ||
            !redirect.startsWith("/") ||
            redirect.startsWith("//")
          ) {

            redirect =
              "/profile.html";

          }


          /*
           * On ne redirige pas immédiatement
           * si l'utilisateur est déjà sur login
           * avec un formulaire qu'il pourrait vouloir utiliser.
           *
           * On affiche simplement un message.
           */

          showMessage(
            "Vous êtes déjà connecté à votre compte HELPY.",
            "success"
          );

        }

      } catch (error) {

        console.log(
          "Lecture session:",
          error
        );

      }

    }
  );

</script>

</body>
</html>
