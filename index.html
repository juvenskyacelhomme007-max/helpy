<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HElPY - Marketplace Haïti</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="app-header">
    <a href="index.html">HElPY</a>
    <a href="profile.html" id="user-link">Profil</a>
  </header>

  <div class="container">
    <form action="search.html" method="GET" class="form-group">
      <input type="text" name="q" placeholder="Rechercher sur HElPY..." required>
    </form>

    <div class="category-pills">
      <a href="listings.html?type=business" class="pill">Entreprises</a>
      <a href="listings.html?type=product" class="pill">Produits</a>
      <a href="listings.html?type=service" class="pill">Services</a>
      <a href="listings.html?type=realestate" class="pill">Immobilier</a>
      <a href="listings.html?type=vehicle" class="pill">Véhicules</a>
    </div>

    <h3>Dernières Publications</h3>
    <div id="listings-container" class="grid mt-2">
      <p>Chargement des publications...</p>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item active">Accueil</a>
    <a href="search.html" class="nav-item">Recherche</a>
    <a href="publish.html" class="nav-item">+ Publier</a>
    <a href="my-listings.html" class="nav-item">Mes Annonces</a>
    <a href="profile.html" class="nav-item">Profil</a>
  </nav>

  <script>
    const API_BASE = window.location.origin;

    async function loadListings() {
      try {
        const res = await fetch(`${API_BASE}/api/listings`);
        const data = await res.json();
        const container = document.getElementById('listings-container');
        
        if (!data.listings || data.listings.length === 0) {
          container.innerHTML = '<p class="text-center mt-4">Aucune publication pour le moment.</p>';
          return;
        }

        container.innerHTML = data.listings.map(item => `
          <div class="item-card" onclick="location.href='listing-details.html?id=${item.id}'">
            <img src="${item.image_url || 'https://via.placeholder.com/150'}" alt="${item.title}">
            <div class="item-card-content">
              <div class="item-title">${item.title}</div>
              <div class="item-price">${item.price ? item.price + ' ' + item.currency : ''}</div>
              <div class="item-category">${item.category}</div>
            </div>
          </div>
        `).join('');
      } catch (err) {
        document.getElementById('listings-container').innerHTML = '<p>Erreur de chargement.</p>';
      }
    }

    loadListings();
  </script>
</body>
</html>
