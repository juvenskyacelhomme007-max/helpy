<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HELPY - Profil</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .menu-item { display: flex; align-items: center; justify-content: space-between; background: var(--card-bg); padding: 14px; border-radius: var(--radius-sm); border: 1px solid var(--border-color); color: var(--text-white); text-decoration: none; font-size: 13px; margin-bottom: 8px; }
  </style>
</head>
<body>
  <div class="app-container">
    <div id="profile-content" class="empty-state">Chargement du profil...</div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i><span>Accueil</span></a>
    <a href="search.html" class="nav-item"><i class="fa-solid fa-magnifying-glass"></i><span>Rechercher</span></a>
    <a href="publish.html" class="nav-item nav-publish"><div class="publish-btn-circle"><i class="fa-solid fa-plus"></i></div><span>Publier</span></a>
    <a href="favorites.html" class="nav-item"><i class="fa-regular fa-bookmark"></i><span>Favoris</span></a>
    <a href="profile.html" class="nav-item active"><i class="fa-regular fa-user"></i><span>Profil</span></a>
  </nav>

  <script src="app.js"></script>
  <script>
    async function loadProfile() {
      const userId = localStorage.getItem('helpy_user_id');
      if (!userId) {
        window.location.href = 'login.html';
        return;
      }

      const user = await apiFetch('/api/profile');
      const container = document.getElementById('profile-content');

      if (user) {
        container.classList.remove('empty-state');
        container.innerHTML = `
          <div style="text-align: center; margin-bottom: 20px;">
            <div style="width: 80px; height: 80px; background: var(--primary-purple); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 32px; margin-bottom: 10px;">
              <i class="fa-solid fa-user"></i>
            </div>
            <h2>${user.name || 'Utilisateur'}</h2>
            <p style="color: var(--text-secondary); font-size: 12px;">${user.email || ''}</p>
          </div>

          <a href="my-listings.html" class="menu-item">
            <span><i class="fa-solid fa-list-check" style="margin-right: 8px;"></i> Mes publications</span>
            <i class="fa-solid fa-chevron-right"></i>
          </a>
          <a href="favorites.html" class="menu-item">
            <span><i class="fa-regular fa-bookmark" style="margin-right: 8px;"></i> Mes favoris</span>
            <i class="fa-solid fa-chevron-right"></i>
          </a>
          <div class="menu-item" style="cursor: pointer; color: #ff3b30;" onclick="logout()">
            <span><i class="fa-solid fa-right-from-bracket" style="margin-right: 8px;"></i> Déconnexion</span>
          </div>
        `;
      } else {
        window.location.href = 'login.html';
      }
    }

    function logout() {
      localStorage.removeItem('helpy_user_id');
      window.location.href = 'login.html';
    }

    document.addEventListener('DOMContentLoaded', loadProfile);
  </script>
</body>
</html>
