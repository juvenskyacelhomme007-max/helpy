<!DOCTYPE html>
<html lang="ht">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HELPY - Koneksyon</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="app-container" style="justify-content: center; min-height: 100vh;">
    
    <!-- EN-TÊTE / LOGO -->
    <div style="text-align: center; margin-bottom: 24px;">
      <div class="logo" style="justify-content: center; margin-bottom: 8px;">
        <div class="logo-icon"><i class="fa-solid fa-handshake"></i></div>
        <span>HEL<span style="color: var(--light-purple);">PY</span></span>
      </div>
      <h2 style="font-size: 20px; font-weight: 700;">Byenvini ankò!</h2>
      <p style="font-size: 12px; color: var(--text-gray); margin-top: 4px;">Konekte sou kont HELPY ou an</p>
    </div>

    <!-- FORMULAIRE KONEKSYON PA EMAIL -->
    <form onsubmit="handleLogin(event)">
      <div class="form-group">
        <label style="font-size: 12px; color: var(--text-gray); margin-bottom: 4px; display: block;">Adrès Email</label>
        <input type="email" id="email" class="form-control" style="width: 100%;" required placeholder="non@egzanp.com">
      </div>
      
      <div class="form-group" style="margin-top: 12px;">
        <label style="font-size: 12px; color: var(--text-gray); margin-bottom: 4px; display: block;">Mewoupas (Mot de passe)</label>
        <input type="password" id="password" class="form-control" style="width: 100%;" required placeholder="••••••••">
      </div>

      <button type="submit" id="login-btn" class="btn-primary" style="width: 100%; margin-top: 18px; padding: 12px; font-size: 13px; justify-content: center;">
        Seコネkte
      </button>
    </form>

    <!-- SEPARATEUR -->
    <div style="display: flex; align-items: center; margin: 20px 0;">
      <div style="flex: 1; height: 1px; background: var(--card-border, #1a2647);"></div>
      <span style="padding: 0 10px; font-size: 10px; color: var(--text-gray); font-weight: 600;">OUBYEN KONEKTE AK</span>
      <div style="flex: 1; height: 1px; background: var(--card-border, #1a2647);"></div>
    </div>

    <!-- BOUTONS REZO SOSYO -->
    <div style="display: flex; flex-direction: column; gap: 10px;">
      <button type="button" onclick="loginWithProvider('google')" class="btn-social">
        <i class="fa-brands fa-google" style="color: #ea4335; font-size: 16px;"></i>
        Konekte ak Google
      </button>

      <button type="button" onclick="loginWithProvider('facebook')" class="btn-social">
        <i class="fa-brands fa-facebook-f" style="color: #1877f2; font-size: 16px;"></i>
        Konekte ak Facebook
      </button>
    </div>

    <!-- LYEN POU KREYE KONT -->
    <p style="text-align: center; font-size: 12px; margin-top: 24px; color: var(--text-gray);">
      Ou pa gen yon kont ankò? <a href="register.html" style="color: var(--light-purple); font-weight: 600; text-decoration: none;">Kreye yon kont</a>
    </p>

  </div>

  <script src="app.js"></script>
  <script>
    async function handleLogin(e) {
      e.preventDefault();
      
      const btn = document.getElementById('login-btn');
      btn.disabled = true;
      btn.innerText = "N ap konekte w...";

      const emailVal = document.getElementById('email').value.trim();
      const passwordVal = document.getElementById('password').value;

      const res = await apiFetch('/api/login', 'POST', {
        email: emailVal,
        password: passwordVal
      });

      btn.disabled = false;
      btn.innerText = "Seコネkte";

      if (res && !res.error && (res.user_id || res.id || res.user?.id)) {
        const userId = res.user_id || res.id || res.user?.id;
        localStorage.setItem('helpy_user_id', userId);
        alert("Koneksyon an reyalize ak siksè!");
        window.location.href = 'index.html';
      } else {
        alert(res?.message || "Echèk nan koneksyon an. Verifye imèl ak mo de pas ou.");
      }
    }
  </script>
</body>
</html>
