<!DOCTYPE html><html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>Se connecter - HELPY</title>  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #f5f6fa;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: white;
      border-radius: 28px;
      padding: 35px 28px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.08);
    }

    .logo {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      margin-bottom: 35px;
    }

    .logo-icon {
      width: 64px;
      height: 64px;
      background: #071a2d;
      color: white;
      border-radius: 18px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 34px;
      font-weight: bold;
      position: relative;
    }

    .logo-icon::after {
      content: "";
      width: 15px;
      height: 15px;
      background: #ffb51b;
      border-radius: 50%;
      position: absolute;
      top: 9px;
      right: 8px;
    }

    .logo-text {
      font-size: 34px;
      font-weight: 800;
      color: #101828;
    }

    h1 {
      text-align: center;
      font-size: 34px;
      color: #101828;
      margin-bottom: 12px;
    }

    .subtitle {
      text-align: center;
      color: #667085;
      font-size: 17px;
      margin-bottom: 28px;
    }

    .message {
      display: none;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 20px;
      font-size: 15px;
      text-align: center;
    }

    .error {
      display: block;
      background: #fff0f0;
      color: #c62828;
    }

    .success {
      display: block;
      background: #ecfdf3;
      color: #027a48;
    }

    label {
      display: block;
      font-weight: 700;
      color: #101828;
      margin: 18px 0 8px;
    }

    input {
      width: 100%;
      height: 58px;
      border: 1px solid #d0d5dd;
      border-radius: 15px;
      padding: 0 18px;
      font-size: 17px;
      outline: none;
      background: white;
    }

    input:focus {
      border-color: #5846e8;
      box-shadow: 0 0 0 3px rgba(88,70,232,0.12);
    }

    button {
      width: 100%;
      height: 58px;
      margin-top: 28px;
      border: none;
      border-radius: 15px;
      background: #ffb51b;
      color: #111;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .bottom {
      text-align: center;
      margin-top: 24px;
      color: #667085;
      font-size: 16px;
    }

    .bottom a {
      color: #175cd3;
      font-weight: 700;
      text-decoration: none;
    }
  </style></head><body>  <div class="container"><div class="logo">
  <div class="logo-icon">H</div>
  <div class="logo-text">HELPY</div>
</div>

<h1>Bienvenue sur HELPY</h1>

<p class="subtitle">
  Connecte-toi à ton compte pour continuer.
</p>

<div id="message" class="message"></div>

<form id="loginForm">

  <label for="email">E-mail</label>

  <input
    type="email"
    id="email"
    placeholder="exemple@email.com"
    autocomplete="email"
    required
  >

  <label for="password">Mot de passe</label>

  <input
    type="password"
    id="password"
    placeholder="Ton mot de passe"
    autocomplete="current-password"
    required
  >

  <button type="submit" id="loginButton">
    Se connecter
  </button>

</form>

<div class="bottom">
  Pas encore de compte ?
  <a href="/register.html">Créer un compte</a>
</div>

  </div>  <script>

    // ==================================================
    // HELPY — CONNEXION
    // Backend : Railway + PostgreSQL
    // ==================================================

    const API_BASE_URL = window.location.origin;

    const form =
      document.getElementById("loginForm");

    const message =
      document.getElementById("message");

    const button =
      document.getElementById("loginButton");


    function showMessage(text, type) {

      message.textContent = text;

      message.className =
        "message " + type;

    }


    form.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const email =
          document
            .getElementById("email")
            .value
            .trim();

        const password =
          document
            .getElementById("password")
            .value;


        message.className =
          "message";

        message.textContent =
          "";


        if (!email || !password) {

          showMessage(
            "Veuillez remplir tous les champs.",
            "error"
          );

          return;
        }


        button.disabled = true;

        button.textContent =
          "Connexion...";


        try {

          // IMPORTANT :
          // Le serveur HELPY utilise /api/login
          const response =
            await fetch(
              API_BASE_URL + "/api/login",
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body: JSON.stringify({
                  email: email,
                  password: password
                })
              }
            );


          let data = {};

          try {

            data =
              await response.json();

          } catch (jsonError) {

            data = {};

          }


          if (!response.ok) {

            throw new Error(
              data.message ||
              "E-mail ou mot de passe incorrect."
            );

          }


          // Le backend HELPY retourne directement
          // l'utilisateur connecté.
          if (data.user) {

            localStorage.setItem(
              "helpy_user",
              JSON.stringify(data.user)
            );

          }


          // Garder l'id séparément pour les pages
          // qui en ont besoin.
          if (
            data.user &&
            data.user.id
          ) {

            localStorage.setItem(
              "helpy_user_id",
              String(data.user.id)
            );

          }


          showMessage(
            "Connexion réussie !",
            "success"
          );


          setTimeout(
            function() {

              window.location.href =
                "/";

            },
            700
          );


        } catch (error) {

          console.error(
            "HELPY login error:",
            error
          );


          showMessage(
            error.message ||
            "Impossible de se connecter.",
            "error"
          );


        } finally {

          button.disabled =
            false;

          button.textContent =
            "Se connecter";

        }

      }
    );

  </script></body>
</html>
