<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HELPY - Inscription</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container" style="justify-content: center;">
    <div style="text-align: center; margin-bottom: 20px;">
      <h2 class="hero-title" style="font-size: 24px;">Rejoindre HELPY</h2>
    </div>

    <form onsubmit="handleRegister(event)">
      <div class="form-group">
        <label>Nom complet</label>
        <input type="text" id="name" class="form-control" required placeholder="Jean Dupont">
      </div>
      <div class="form-group">
        <label>Adresse Email</label>
        <input type="email" id="email" class="form-control" required placeholder="nom@exemple.com">
      </div>
      <div class="form-group">
        <label>Téléphone</label>
        <input type="tel" id="phone" class="form-control" required placeholder="+509 ...">
      </div>
      <div class="form-group">
        <label>Mot de passe</label>
        <input type="password" id="password" class="form-control" required>
      </div>
      <button type="submit" class="btn-primary" style="width: 100%; justify-content: center; margin-top: 10px;">Créer mon compte</button>
    </form>
    <p style="text-align: center; font-size: 12px; margin-top: 15px; color: var(--text-secondary);">
      Déjà un compte ? <a href="login.html" style="color: var(--light-purple);">Se connecter</a>
    </p>
  </div>

  <script src="app.js"></script>
  <script>
    async function handleRegister(e) {
      e.preventDefault();
      const res = await apiFetch('/api/register', 'POST', {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value,
        password: document.getElementById('password').value
      });

      if (res && res.user_id) {
        localStorage.setItem('helpy_user_id', res.user_id);
        window.location.href = 'profile.html';
      } else {
        alert("Erreur lors de l'inscription.");
      }
    }
  </script>
</body>
</html>
