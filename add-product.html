<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Publier un produit - HELPY</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fa;
      color: #17202a;
    }

    header {
      background: white;
      height: 65px;
      padding: 0 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #e5e7eb;
    }

    .logo {
      font-size: 25px;
      font-weight: 900;
    }

    .back {
      border: none;
      background: #f1f3f5;
      padding: 10px 15px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    main {
      max-width: 700px;
      margin: 25px auto;
      padding: 0 15px 40px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 5px 25px rgba(0,0,0,.07);
    }

    h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #777;
      margin-bottom: 25px;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 14px;
      border: 1px solid #dfe3e8;
      border-radius: 11px;
      font-size: 15px;
      outline: none;
      background: white;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #2563eb;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .publish {
      width: 100%;
      border: none;
      background: #2563eb;
      color: white;
      padding: 16px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    .publish:disabled {
      opacity: .6;
      cursor: wait;
    }

    .message {
      display: none;
      padding: 13px;
      border-radius: 10px;
      margin-bottom: 18px;
      font-weight: bold;
    }

    .success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    @media (max-width: 600px) {
      main {
        margin-top: 15px;
      }

      .card {
        padding: 20px;
      }

      h1 {
        font-size: 24px;
      }

      .row {
        grid-template-columns: 1fr;
        gap: 0;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="logo">
    HELPY
  </div>

  <button
    class="back"
    onclick="history.back()">
    ← Retour
  </button>

</header>


<main>

  <div class="card">

    <h1>Publier un produit</h1>

    <p class="subtitle">
      Ajoutez votre produit sur HELPY et permettez aux clients de vous contacter.
    </p>


    <div
      id="message"
      class="message">
    </div>


    <form id="productForm">


      <!-- NOM -->
      <div class="field">

        <label for="title">
          Nom du produit *
        </label>

        <input
          type="text"
          id="title"
          placeholder="Ex: iPhone 13"
          required>

      </div>


      <!-- DESCRIPTION -->
      <div class="field">

        <label for="description">
          Description
        </label>

        <textarea
          id="description"
          placeholder="Décrivez votre produit..."></textarea>

      </div>


      <!-- PRIX + QUANTITÉ -->
      <div class="row">

        <div class="field">

          <label for="price">
            Prix (HTG) *
          </label>

          <input
            type="number"
            id="price"
            min="0"
            step="0.01"
            placeholder="19999"
            required>

        </div>


        <div class="field">

          <label for="quantity">
            Quantité
          </label>

          <input
            type="number"
            id="quantity"
            min="1"
            value="1">

        </div>

      </div>


      <!-- CATEGORIE -->
      <div class="field">

        <label for="category">
          Catégorie
        </label>

        <select id="category">

          <option value="">
            Choisir une catégorie
          </option>

          <option value="Téléphones">
            📱 Téléphones
          </option>

          <option value="Ordinateurs">
            💻 Ordinateurs
          </option>

          <option value="Électronique">
            🔌 Électronique
          </option>

          <option value="Vêtements">
            👕 Vêtements
          </option>

          <option value="Chaussures">
            👟 Chaussures
          </option>

          <option value="Maison">
            🏠 Maison
          </option>

          <option value="Beauté">
            💄 Beauté
          </option>

          <option value="Alimentation">
            🍔 Alimentation
          </option>

          <option value="Autres">
            📦 Autres
          </option>

        </select>

      </div>


      <!-- LOCALISATION -->
      <div class="field">

        <label for="location">
          Localisation
        </label>

        <input
          type="text"
          id="location"
          placeholder="Ex: Delmas">

      </div>


      <!-- WHATSAPP -->
      <div class="field">

        <label for="whatsapp">
          WhatsApp *
        </label>

        <input
          type="tel"
          id="whatsapp"
          placeholder="32699268"
          required>

      </div>


      <!-- IMAGE URL -->
      <div class="field">

        <label for="image_url">
          Lien de la photo
        </label>

        <input
          type="url"
          id="image_url"
          placeholder="https://exemple.com/photo.jpg">

      </div>


      <button
        type="submit"
        id="publishButton"
        class="publish">

        🚀 Publier le produit

      </button>

    </form>

  </div>

</main>


<script>

const API_URL =
  "https://helpy-production.up.railway.app";


const form =
  document.getElementById("productForm");


const button =
  document.getElementById("publishButton");


const message =
  document.getElementById("message");


// ==========================================
// MESSAGE
// ==========================================

function showMessage(text, type) {

  message.textContent = text;

  message.className =
    "message " + type;

}


// ==========================================
// UTILISATEUR CONNECTÉ
// ==========================================

function getUser() {

  const saved =
    localStorage.getItem("helpyUser");

  if (!saved) {
    return null;
  }

  try {

    return JSON.parse(saved);

  } catch (error) {

    console.error(
      "USER DATA ERROR:",
      error
    );

    return null;
  }
}


// ==========================================
// PUBLICATION
// ==========================================

form.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();


    const user =
      getUser();


    if (!user || !user.id) {

      showMessage(
        "Vous devez être connecté pour publier un produit.",
        "error"
      );

      setTimeout(() => {

        window.location.href =
          "/login.html";

      }, 1500);

      return;
    }


    const title =
      document
        .getElementById("title")
        .value
        .trim();


    const description =
      document
        .getElementById("description")
        .value
        .trim();


    const price =
      document
        .getElementById("price")
        .value;


    const quantity =
      document
        .getElementById("quantity")
        .value || 1;


    const category =
      document
        .getElementById("category")
        .value;


    const location =
      document
        .getElementById("location")
        .value
        .trim();


    const whatsapp =
      document
        .getElementById("whatsapp")
        .value
        .trim();


    const image_url =
      document
        .getElementById("image_url")
        .value
        .trim();


    if (!title || !price || !whatsapp) {

      showMessage(
        "Remplissez les champs obligatoires.",
        "error"
      );

      return;
    }


    button.disabled = true;

    button.textContent =
      "Publication en cours...";


    try {

      const response =
        await fetch(
          `${API_URL}/api/products`,
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({

              user_id: user.id,

              title: title,

              description:
                description || null,

              price: price,

              currency: "HTG",

              category:
                category || null,

              location:
                location || null,

              whatsapp:
                whatsapp,

              image_url:
                image_url || null,

              quantity:
                Number(quantity)

            })
          }
        );


      const data =
        await response.json();


      console.log(
        "CREATE PRODUCT:",
        data
      );


      if (!response.ok) {

        throw new Error(
          data.message ||
          "Impossible de publier le produit."
        );
      }


      showMessage(
        "✅ Produit publié avec succès !",
        "success"
      );


      form.reset();


      document
        .getElementById("quantity")
        .value = 1;


      setTimeout(() => {

        window.location.href =
          "/products.html";

      }, 1200);


    } catch (error) {

      console.error(
        "CREATE PRODUCT ERROR:",
        error
      );


      showMessage(
        error.message ||
        "Une erreur est survenue.",
        "error"
      );


      button.disabled = false;

      button.textContent =
        "🚀 Publier le produit";

    }

  }
);

</script>

</body>
</html>
