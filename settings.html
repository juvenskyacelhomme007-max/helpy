<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/icon.svg"><link rel="stylesheet" href="/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/config.js"></script><script src="/supabase.js"></script><title>Paramètres — HELPY</title></head><body><main class="container page"><div class="panel"><h1>Paramètres</h1><form id="f" class="form"><div class="two"><div class="field"><label>Pays</label><input id="country"></div><div class="field"><label>Devise</label><select id="currency"><option>USD</option><option>EUR</option><option>CAD</option><option>GBP</option><option>HTG</option></select></div></div><div class="field"><label>Langue</label><select id="language"><option>Français</option><option>Kreyòl Ayisyen</option><option>English</option><option>Español</option></select></div><button class="primary">Enregistrer</button><div id="msg"></div></form></div></main><script>country.value=localStorage.helpyCountry||"";currency.value=localStorage.helpyCurrency||"USD";language.value=localStorage.helpyLanguage||"Français";f.onsubmit=e=>{e.preventDefault();localStorage.helpyCountry=country.value;localStorage.helpyCurrency=currency.value;localStorage.helpyLanguage=language.value;msg.className="notice ok";msg.textContent="Préférences enregistrées."}</script></body></html>
