<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entreprises — HELPY</title><link rel="stylesheet" href="style.css"><script src="app.js"></script></head><body><main class="container"><h1>Entreprises</h1><div id="grid" class="grid">Chargement...</div></main><script>(async()=>{const r=await apiFetch('/api/businesses');grid.innerHTML=(r.entreprises||[]).map(x=>`<article class="card"><h3>${x.name}</h3><p>${x.description||''}</p><p class="muted">${x.category||''} · ${x.city||x.country||''}</p><a class="btn" href="business-details.html?id=${x.id}">Voir</a></article>`).join('')||'<p>Aucune entreprise pour le moment.</p>'})()</script></body></html>
