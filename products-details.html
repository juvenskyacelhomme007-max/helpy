<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Détails du produit — HELPY</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fb;
      color: #172033;
      padding-bottom: 40px;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    header {
      background: white;
      border-bottom: 1px solid #e5e7eb;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header {
      max-width: 1100px;
      height: 65px;
      margin: auto;
      padding: 0 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 25px;
      font-weight: 900;
    }

    .logo-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    .back {
      color: #2563eb;
      font-size: 14px;
      font-weight: bold;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 25px 18px;
    }

    .loading {
      text-align: center;
      padding: 80px 20px;
      color: #6b7280;
    }

    .product-card {
      background: white;
      border-radius: 22px;
      overflow: hidden;
      border: 1px solid #e5e7eb;
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    .image-area {
      min-height: 450px;
      background: #eef2f7;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .image-area img {
      width: 100%;
      height: 100%;
      min-height: 450px;
      object-fit: cover;
    }

    .no-image {
      font-size: 90px;
    }

    .details {
      padding: 35px;
    }

    .category {
      display: inline-block;
      background: #eef4ff;
      color: #2563eb;
      padding: 7px 11px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .title {
      font-size: 34px;
      line-height: 1.15;
      margin-bottom: 15px;
    }

    .price {
      color: #2563eb;
      font-size: 28px;
      font-weight: 900;
      margin-bottom: 20px;
    }

    .info {
      border-top: 1px solid #edf0f4;
      border-bottom: 1px solid #edf0f4;
      padding: 18px 0;
      margin-bottom: 20px;
    }

    .info-row {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
      font-size: 14px;
    }

    .info-row:last-child {
      margin-bottom: 0;
    }

    .info-label {
      color: #6b7280;
    }

    .description {
      margin-bottom: 25px;
    }

    .description h3 {
      font-size: 17px;
      margin-bottom: 8px;
    }

    .description p {
      color: #6b7280;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .seller {
      background: #f8fafc;
      border-radius: 13px;
      padding: 15px;
      margin-bottom: 20px;
    }

    .seller-title {
      color: #6b7280;
      font-size: 12px;
      margin-bottom: 5px;
    }

    .seller-name {
      font-weight: bold;
      font-size: 16px;
    }

    .whatsapp {
      display: block;
      width: 100%;
      text-align: center;
      background: #16a34a;
      color: white;
      padding: 14px;
      border-radius: 11px;
      font-size: 15px;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }

    .whatsapp:hover {
      background: #15803d;
    }

    .error {
      text-align: center;
      background: white;
      border-radius: 18px;
      padding: 50px 20px;
      border: 1px solid #e5e7eb;
    }

    .error-icon {
      font-size: 50px;
      margin-bottom: 15px;
    }

    .error h2 {
      margin-bottom: 8px;
    }

    .error p {
      color: #6b7280;
      margin-bottom: 20px;
    }

    .home-btn {
      display: inline-block;
      background: #2563eb;
      color: white;
      padding: 12px 20px;
      border-radius: 10px;
      font-weight: bold;
    }

    @media (max-width: 750px) {

      .product-card {
        grid-template-columns: 1fr;
      }

      .image-area {
        min-height: 320px;
      }

      .image-area img {
        min-height: 320px;
      }

      .details {
        padding: 25px 20px;
      }

      .title {
        font-size: 27px;
      }

      .price {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="header">

    <a href="/" class="logo">
      <div class="logo-icon">H</div>
      HELPY
    </a>

    <a href="/products.html" class="back">
      ← Produits
    </a>

  </div>

</header>


<main>

  <div id="loading" class="loading">
    Chargement du produit...
  </div>

  <div id="content"></div>

</main>


<script>

const API_URL = "https://helpy-production.up.railway.app";


/* Récupérer l'ID dans l'URL */

const params = new URLSearchParams(window.location.search);

const productId = params.get("id");


/* Échapper les caractères HTML */

function escapeHTML(value) {

  if (value === null || value === undefined) {
    return "";
  }

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* Format du prix */

function formatPrice(price) {

  const number = Number(price);

  if (isNaN(number)) {
    return escapeHTML(price);
  }

  return new Intl.NumberFormat("fr-FR").format(number);

}


/* Charger le produit */

async function loadProduct() {

  const loading =
    document.getElementById("loading");

  const content =
    document.getElementById("content");


  if (!productId) {

    showError(
      "Produit introuvable",
      "Aucun identifiant de produit n'a été fourni."
    );

    return;

  }


  try {

    const response =
      await fetch(
        API_URL + "/api/products/" +
        encodeURIComponent(productId)
      );


    if (!response.ok) {
      throw new Error("Produit introuvable");
    }


    const data =
      await response.json();


    const product =
      data.product || data;


    if (!product || !product.id) {
      throw new Error("Produit introuvable");
    }


    displayProduct(product);


  } catch (error) {

    console.error(error);

    showError(
      "Produit introuvable",
      "Ce produit n'est plus disponible ou une erreur est survenue."
    );

  }

}


/* Afficher le produit */

function displayProduct(product) {

  const loading =
    document.getElementById("loading");

  const content =
    document.getElementById("content");


  loading.style.display = "none";


  let imageHTML = `
    <div class="no-image">🛍️</div>
  `;


  if (product.image_url) {

    imageHTML = `
      <img
        src="${escapeHTML(product.image_url)}"
        alt="${escapeHTML(product.title)}"
      >
    `;

  }


  const whatsapp =
    String(product.whatsapp || "")
      .replace(/\D/g, "");


  const whatsappLink =
    whatsapp
      ? "https://wa.me/" + whatsapp
      : "#";


  const currency =
    product.currency || "HTG";


  const quantity =
    product.quantity !== undefined
      ? product.quantity
      : "—";


  const category =
    product.category || "Produit";


  const location =
    product.location || "Haïti";


  const description =
    product.description ||
    "Aucune description disponible pour ce produit.";


  const seller =
    product.seller_name ||
    "Vendeur HELPY";


  content.innerHTML = `

    <div class="product-card">

      <div class="image-area">
        ${imageHTML}
      </div>


      <div class="details">

        <div class="category">
          ${escapeHTML(category)}
        </div>


        <h1 class="title">
          ${escapeHTML(product.title)}
        </h1>


        <div class="price">
          ${formatPrice(product.price)}
          ${escapeHTML(currency)}
        </div>


        <div class="info">

          <div class="info-row">
            <strong>📍</strong>
            <span>
              <span class="info-label">Localisation :</span>
              ${escapeHTML(location)}
            </span>
          </div>


          <div class="info-row">
            <strong>📦</strong>
            <span>
              <span class="info-label">Quantité :</span>
              ${escapeHTML(quantity)}
            </span>
          </div>

        </div>


        <div class="description">

          <h3>Description</h3>

          <p>
            ${escapeHTML(description)}
          </p>

        </div>


        <div class="seller">

          <div class="seller-title">
            Vendu par
          </div>

          <div class="seller-name">
            👤 ${escapeHTML(seller)}
          </div>

        </div>


        ${
          whatsapp
          ?
          `
          <a
            class="whatsapp"
            href="${whatsappLink}"
            target="_blank"
            rel="noopener noreferrer"
          >
            💬 Contacter sur WhatsApp
          </a>
          `
          :
          `
          <button
            class="whatsapp"
            style="background:#9ca3af;cursor:not-allowed;"
            disabled
          >
            WhatsApp non disponible
          </button>
          `
        }

      </div>

    </div>

  `;


  document.title =
    product.title +
    " — HELPY";

}


/* Afficher une erreur */

function showError(title, message) {

  document.getElementById("loading").style.display = "none";

  document.getElementById("content").innerHTML = `

    <div class="error">

      <div class="error-icon">
        🔎
      </div>

      <h2>
        ${escapeHTML(title)}
      </h2>

      <p>
        ${escapeHTML(message)}
      </p>

      <a
        href="/products.html"
        class="home-btn"
      >
        ← Retour aux produits
      </a>

    </div>

  `;

}


/* Lancer */

loadProduct();

</script>

</body>
</html>
