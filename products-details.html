<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Détails du produit - HELPY</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fa;
      color: #17202a;
    }

    /* HEADER */
    header {
      background: #ffffff;
      height: 65px;
      padding: 0 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #e5e7eb;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 25px;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .back-btn {
      border: none;
      background: #f1f3f5;
      color: #222;
      padding: 10px 15px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    /* MAIN */
    main {
      width: 100%;
      max-width: 900px;
      margin: 25px auto;
      padding: 0 15px;
    }

    /* LOADING */
    #loading {
      text-align: center;
      padding: 50px 20px;
      font-size: 18px;
      color: #666;
    }

    /* ERROR */
    #error {
      display: none;
      background: white;
      border-radius: 16px;
      padding: 35px 20px;
      text-align: center;
      box-shadow: 0 5px 25px rgba(0,0,0,.06);
    }

    #error h2 {
      margin-bottom: 10px;
    }

    #error p {
      color: #777;
    }

    /* PRODUCT CARD */
    #productCard {
      display: none;
      background: white;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 5px 25px rgba(0,0,0,.07);
    }

    /* IMAGE */
    .product-image {
      width: 100%;
      height: 380px;
      background: #eef1f5;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .placeholder {
      font-size: 75px;
      opacity: .45;
    }

    /* CONTENT */
    .content {
      padding: 25px;
    }

    .category {
      display: none;
      background: #eef2ff;
      color: #3949ab;
      padding: 7px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 13px;
    }

    #title {
      font-size: 30px;
      line-height: 1.2;
      margin-bottom: 12px;
    }

    .price {
      font-size: 28px;
      font-weight: 900;
      margin-bottom: 22px;
    }

    /* INFO */
    .info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 25px;
    }

    .info-box {
      background: #f7f8fa;
      padding: 15px;
      border-radius: 12px;
    }

    .label {
      color: #777;
      font-size: 12px;
      margin-bottom: 5px;
    }

    .value {
      font-size: 15px;
      font-weight: bold;
    }

    /* DESCRIPTION */
    .description {
      border-top: 1px solid #eee;
      padding-top: 22px;
    }

    .description h2 {
      font-size: 20px;
      margin-bottom: 10px;
    }

    .description p {
      color: #555;
      line-height: 1.7;
      white-space: pre-wrap;
    }

    /* SELLER */
    .seller {
      margin-top: 25px;
      background: #f7f8fa;
      padding: 18px;
      border-radius: 12px;
    }

    /* WHATSAPP */
    .whatsapp {
      display: block;
      width: 100%;
      margin-top: 20px;
      padding: 16px;
      border-radius: 12px;
      text-align: center;
      text-decoration: none;
      background: #25D366;
      color: white;
      font-weight: bold;
      font-size: 16px;
    }

    .whatsapp:hover {
      opacity: .9;
    }

    /* MOBILE */
    @media (max-width: 600px) {

      main {
        margin-top: 15px;
      }

      .product-image {
        height: 280px;
      }

      .content {
        padding: 20px;
      }

      #title {
        font-size: 24px;
      }

      .price {
        font-size: 24px;
      }

      .info {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header>

    <div class="logo">
      HELPY
    </div>

    <button
      class="back-btn"
      onclick="history.back()">
      ← Retour
    </button>

  </header>


  <!-- MAIN -->
  <main>

    <!-- LOADING -->
    <div id="loading">
      Chargement du produit...
    </div>


    <!-- ERROR -->
    <div id="error">

      <h2>Produit introuvable</h2>

      <p id="errorMessage">
        Impossible de charger ce produit.
      </p>

    </div>


    <!-- PRODUCT -->
    <div id="productCard">

      <!-- IMAGE -->
      <div class="product-image">

        <img
          id="productImage"
          alt="Image du produit">

        <div
          id="placeholder"
          class="placeholder">
          🛍️
        </div>

      </div>


      <!-- CONTENT -->
      <div class="content">

        <!-- CATEGORY -->
        <div
          id="category"
          class="category">
        </div>


        <!-- TITLE -->
        <h1 id="title">
        </h1>


        <!-- PRICE -->
        <div
          id="price"
          class="price">
        </div>


        <!-- INFORMATION -->
        <div class="info">

          <div class="info-box">

            <div class="label">
              📍 Localisation
            </div>

            <div
              id="location"
              class="value">
              Non précisé
            </div>

          </div>


          <div class="info-box">

            <div class="label">
              📦 Quantité disponible
            </div>

            <div
              id="quantity"
              class="value">
              1
            </div>

          </div>

        </div>


        <!-- DESCRIPTION -->
        <div class="description">

          <h2>
            Description
          </h2>

          <p id="description">
            Aucune description disponible.
          </p>

        </div>


        <!-- SELLER -->
        <div class="seller">

          <div class="label">
            👤 Vendeur
          </div>

          <div
            id="seller"
            class="value">
          </div>

        </div>


        <!-- WHATSAPP -->
        <a
          id="whatsapp"
          class="whatsapp"
          href="#"
          target="_blank">

          💬 Contacter le vendeur sur WhatsApp

        </a>

      </div>

    </div>

  </main>


  <!-- JAVASCRIPT -->
  <script>

    const API_URL =
      "https://helpy-production.up.railway.app";


    async function loadProduct() {

      // Récupérer ID depuis l'URL
      const params =
        new URLSearchParams(
          window.location.search
        );

      const id =
        params.get("id");


      console.log(
        "HELPY PRODUCT ID:",
        id
      );


      // Pas d'ID
      if (!id) {

        showError(
          "Aucun identifiant de produit trouvé."
        );

        return;
      }


      try {

        // Appel API
        const response =
          await fetch(
            `${API_URL}/api/products/${encodeURIComponent(id)}`
          );


        console.log(
          "HELPY API STATUS:",
          response.status
        );


        // Lire JSON
        const data =
          await response.json();


        console.log(
          "HELPY PRODUCT DATA:",
          data
        );


        // Vérifier réponse
        if (
          !response.ok ||
          data.status !== "ok" ||
          !data.product
        ) {

          showError(
            data.message ||
            "Produit introuvable."
          );

          return;
        }


        // Produit
        const product =
          data.product;


        console.log(
          "PRODUCT:",
          product
        );


        // Cacher loading
        document
          .getElementById("loading")
          .style.display = "none";


        // Afficher produit
        document
          .getElementById("productCard")
          .style.display = "block";


        // =========================
        // TITRE
        // =========================

        document
          .getElementById("title")
          .textContent =
            product.title ||
            "Produit sans nom";


        // =========================
        // PRIX
        // =========================

        document
          .getElementById("price")
          .textContent =
            `${product.price || 0} ${product.currency || "HTG"}`;


        // =========================
        // CATÉGORIE
        // =========================

        if (product.category) {

          const category =
            document.getElementById(
              "category"
            );

          category.textContent =
            product.category;

          category.style.display =
            "inline-block";
        }


        // =========================
        // LOCALISATION
        // =========================

        document
          .getElementById("location")
          .textContent =
            product.location ||
            "Non précisé";


        // =========================
        // QUANTITÉ
        // =========================

        document
          .getElementById("quantity")
          .textContent =
            product.quantity ??
            1;


        // =========================
        // DESCRIPTION
        // =========================

        document
          .getElementById("description")
          .textContent =
            product.description ||
            "Aucune description disponible.";


        // =========================
        // VENDEUR
        // =========================

        document
          .getElementById("seller")
          .textContent =
            product.seller_name ||
            "Vendeur";


        // =========================
        // IMAGE
        // =========================

        if (product.image_url) {

          const image =
            document.getElementById(
              "productImage"
            );

          image.src =
            product.image_url;

          image.style.display =
            "block";


          document
            .getElementById(
              "placeholder"
            )
            .style.display =
              "none";
        }


        // =========================
        // WHATSAPP
        // =========================

        const whatsapp =
          document.getElementById(
            "whatsapp"
          );


        if (product.whatsapp) {

          let number =
            String(
              product.whatsapp
            ).replace(
              /\D/g,
              ""
            );


          // Ajouter code Haïti
          if (
            number.length === 8
          ) {

            number =
              "509" + number;
          }


          const message =
            "Bonjour, je suis intéressé par votre produit : " +
            (product.title || "");


          whatsapp.href =
            `https://wa.me/${number}?text=${encodeURIComponent(message)}`;

        } else {

          whatsapp.style.display =
            "none";
        }

      } catch (error) {

        console.error(
          "HELPY DETAIL ERROR:",
          error
        );


        showError(
          "Impossible de communiquer avec le serveur."
        );
      }

    }


    // =========================
    // ERROR FUNCTION
    // =========================

    function showError(message) {

      document
        .getElementById("loading")
        .style.display =
          "none";


      document
        .getElementById("error")
        .style.display =
          "block";


      document
        .getElementById("errorMessage")
        .textContent =
          message;

    }


    // Lancer
    loadProduct();

  </script>

</body>
</html>
