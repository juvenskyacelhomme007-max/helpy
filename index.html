<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HELPY — Services, commerces et professionnels</title>

<meta name="description"
content="HELPY — Trouvez facilement des services, commerces et professionnels près de chez vous.">

<meta name="theme-color" content="#050a16">

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#050a16;
  --card:#0c1629;
  --card2:#111d33;
  --border:rgba(125,140,190,.25);
  --purple:#7b12ff;
  --purple2:#a000ff;
  --text:#edf2ff;
  --muted:#9ba9c8;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:
  Inter,
  -apple-system,
  BlinkMacSystemFont,
  "Segoe UI",
  Roboto,
  Arial,
  sans-serif;

  background:
  radial-gradient(
    circle at 50% -10%,
    rgba(100,0,255,.15),
    transparent 35%
  ),
  var(--bg);

  color:var(--text);
  min-height:100vh;
  padding-bottom:100px;
}

button,
input{
  font-family:inherit;
}

button{
  cursor:pointer;
}

a{
  text-decoration:none;
  color:inherit;
}


/* =========================
   HEADER
========================= */

.header{
  width:100%;
  padding:24px 18px 12px;
}

.header-inner{
  max-width:1100px;
  margin:auto;

  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.brand-logo{
  width:58px;
  height:58px;
  border-radius:16px;

  background:
  linear-gradient(
    145deg,
    #7b00ff,
    #3f00b8
  );

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:30px;

  box-shadow:
  0 10px 35px
  rgba(111,0,255,.35);
}

.brand-text h1{
  font-size:37px;
  line-height:1;
  font-weight:900;
  letter-spacing:-1.5px;
}

.brand-text h1 span{
  color:#8e16ff;
}

.brand-text p{
  margin-top:4px;
  font-size:14px;
  color:#d0d8eb;
}

.header-actions{
  display:flex;
  align-items:center;
  gap:12px;
}

.icon-btn,
.profile-btn{
  width:52px;
  height:52px;

  border-radius:50%;

  border:
  1px solid
  rgba(120,130,180,.2);

  background:
  rgba(13,22,43,.85);

  color:white;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:23px;

  position:relative;
}

.profile-btn{
  background:
  linear-gradient(
    145deg,
    #1b2d68,
    #172456
  );

  font-size:25px;
}

.notification-dot{
  position:absolute;

  width:10px;
  height:10px;

  background:#ff2148;

  border-radius:50%;

  right:9px;
  top:8px;

  border:2px solid #080d1c;
}


/* =========================
   MAIN
========================= */

main{
  width:100%;
  max-width:1100px;

  margin:auto;

  padding:
  15px 18px 0;
}
