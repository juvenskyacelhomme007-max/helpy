<!DOCTYPE html>
<html lang="ht">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HELPY - Publier un service</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="app-container">
    <h2 style="margin-bottom: 20px; font-size: 20px;">Pibliye yon sèvis / biznis</h2>

    <form id="publishForm">
      <div style="margin-bottom: 16px;">
        <label style="display:block; margin-bottom:6px; font-size:14px; color:var(--text-gray);">Tit Sèvis la</label>
        <input type="text" id="title" class="search-box" style="width: 100%; color: white;" placeholder="Eg: Reparatè Telefòn, Restoran..." required>
      </div>

      <div style="margin-bottom: 16px;">
        <label style="display:block; margin-bottom:6px; font-size:14px; color:var(--text-gray);">Kategori</label>
        <select id="category" class="search-box" style="width: 100%; color: white; background: var(--card-bg);" required>
          <option value="Restaurants">Restaurants</option>
          <option value="Magasins">Magasins</option>
          <option value="Logement">Logement</option>
          <option value="Services">Services</option>
        </select>
      </div>

      <div style="margin-bottom: 16px;">
        <label style="display:block; margin-bottom:6px; font-size:14px; color:var(--text-gray);">Nimewo Telefòn / WhatsApp</label>
        <input type="tel" id="phone" class="search-box" style="width: 100%; color: white;" placeholder="+509 XXXX-XXXX" required>
      </div>

      <div style="margin-bottom: 20px;">
        <label style="display:block; margin-bottom:6px; font-size:14px; color:var(--text-gray);">Deskripsyon</label>
        <textarea id="description" class="search-box" style="width: 100%; color: white; height: 90px;" placeholder="Bay detay sou sèvis ou an..." required></textarea>
      </div>

      <button type="submit" style="width: 100%; background: var(--primary); color: white; border: none; padding: 12px; border-radius: 12px; font-weight: 600;">
        Pibliye Sèvis la
      </button>
    </form>

    <div id="pubMessage" style="margin-top: 12px; text-align: center; font-size: 14px;"></div>
  </div>

  <script>
    document.getElementById('publishForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('title').value;
      const category = document.getElementById('category').value;
      const phone = document.getElementById('phone').value;
      const description = document.getElementById('description').value;
      const msg = document.getElementById('pubMessage');

      try {
        const res = await fetch('/api/services', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, category, phone, description })
        });
        const data = await res.json();

        if (res.ok) {
          msg.style.color = '#4ade80';
          msg.innerText = "Sèvis ou pibliye ak siksè!";
          setTimeout(() => window.location.href = '/', 1500);
        } else {
          msg.style.color = '#ef4444';
          msg.innerText = "Erè pandan piblikasyon an.";
        }
      } catch (err) {
        msg.style.color = '#ef4444';
        msg.innerText = "Erè nan koneksyon sèvè a.";
      }
    });
  </script>
</body>
</html>
